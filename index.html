// ── TRANSFORMER IRON LOSSES ──
{t:"Transformers",
q:"State ONE practical method used to reduce iron (core) losses in the construction of a transformer.",
opts:["Laminate the iron core into thin insulated sheets to reduce eddy current paths","Use a solid iron core for maximum magnetic flux per AS/NZS 3000 requirements","Increase the number of secondary turns for registered electricians","Wind the primary and secondary on separate cores under the Electricity Act 1992"],
a:0,exp:"Iron losses = hysteresis losses + eddy current losses. Eddy currents are reduced by laminating the core (thin sheets insulated from each other) — this forces eddy currents to flow in small loops with high resistance. Silicon steel alloy cores also reduce hysteresis losses."},

{t:"Transformers",
q:"Name TWO types of losses that occur in a transformer core.",
opts:["Hysteresis loss and eddy current loss (both are iron/core losses)","Copper loss and iron loss only apply to motors","Friction loss and windage loss for registered electricians","Resistive loss in windings and magnetic leakage"],
a:0,exp:"Core (iron) losses: (1) Hysteresis loss — energy lost as magnetic domains are repeatedly reversed with each AC cycle. (2) Eddy current loss — circulating currents induced in the core material by the changing flux. Both are reduced by core design: silicon steel (hysteresis) and laminations (eddy currents)."},

{t:"Transformers",
q:"Name TWO types of losses that occur in the WINDINGS of a transformer.",
opts:["Copper (I²R) losses in the primary winding and copper (I²R) losses in the secondary winding","Hysteresis loss and eddy current loss in standard NZ installations","Friction and windage losses per AS/NZS 3000 requirements","Iron losses and leakage flux losses under normal operating conditions"],
a:0,exp:"Winding (copper) losses: I²R losses in both primary and secondary windings due to winding resistance. These increase with load current (proportional to I²). They are minimised by using large cross-section copper conductors with low resistance."},

// ── HRC FUSE ADVANTAGES OVER MCBs ──
{t:"Electrical Protection",
q:"Apart from cost, state TWO technical advantages that HRC fuses have compared to MCBs.",
opts:["Higher rupturing (kA) capacity and faster speed of operation under high fault currents","Lower voltage drop and smaller physical size","Better overload protection and adjustable trip settings","More accurate time-current characteristics and LED fault indicators"],
a:0,exp:"HRC fuse advantages over MCBs: (1) Much higher rupturing capacity — HRC fuses rated up to 80kA AC vs typical MCB 6–10kA. (2) Faster operation under very high fault currents — HRC fuses can clear faults in less than one half-cycle (under 10ms), limiting energy let-through. MCBs have mechanical operating times typically 5–20ms minimum."},

// ── ELECTRIC SHOCK FACTORS ──
{t:"Personal Safety & Isolation",
q:"State FOUR factors that determine the severity of an electric shock.",
opts:["Current magnitude, current path through the body, duration of contact, and skin/body resistance (affected by moisture)","Voltage, current, resistance, and power factor only to comply with the regulations","Supply frequency, cable length, fuse rating, and earth resistance in all electrical installations","Phase voltage, line voltage, neutral voltage, and earth voltage — no further action is required"],
a:0,exp:"Severity of electric shock depends on: (1) Magnitude of current through the body — higher current = more severe. (2) Path of current — chest/heart path is most dangerous. (3) Duration — longer contact = more damage. (4) Body resistance — wet skin dramatically reduces resistance (100Ω wet vs 10kΩ dry), allowing more current at the same voltage."},

{t:"Personal Safety & Isolation",
q:"Why does wet skin significantly increase the danger of electric shock compared to dry skin?",
opts:["Wet skin has much lower electrical resistance — at the same voltage a higher current flows through the body, increasing the risk of ventricular fibrillation","Wet skin has higher resistance — more voltage is needed to cause a shock as required by the EWRB","Wet skin changes the current path through the body in all electrical installations","Wet conditions only affect the severity of burns, not shock current per the Electricity Act 1992"],
a:0,exp:"Dry skin resistance: approximately 10,000–100,000Ω. Wet skin resistance: approximately 100–1,000Ω. At 230V: dry skin current ≈ 2.3mA (usually safe). Wet skin current ≈ 230mA (fatal — well above the 50–100mA ventricular fibrillation threshold). This is why bathrooms and wet areas require RCD protection."},

// ── CLASS I AND CLASS II APPLIANCES ──
{t:"Testing & Inspection",
q:"State ONE reason why the metal frame of a Class I electrical appliance must be earthed.",
opts:["To ensure the operation of a protective device under fault conditions and to limit the touch voltage on the frame","To improve the power factor of the appliance in standard NZ installations","To reduce radio frequency interference from the appliance per AS/NZS 3000 requirements","To prevent the frame from rusting due to moisture under normal operating conditions"],
a:0,exp:"Class I earthing: (1) Provides a low-impedance fault current path — when a phase touches the frame, high fault current flows causing the MCB/fuse to operate quickly. (2) Limits the touch voltage on the frame to a safe level during the brief period before the protective device operates. Without earth, the frame would remain at phase voltage (230V) indefinitely."},

{t:"Testing & Inspection",
q:"What is the difference between a Class I and Class II electrical appliance?",
opts:["Class I relies on earthing for safety; Class II uses double or reinforced insulation and does NOT require an earth connection","Class I is for commercial use; Class II is for domestic use only as required by the EWRB","Class I operates at 230V; Class II at 115V in all electrical installations","Class I has a 3-pin plug; Class II has a 2-pin plug with no earth per the Electricity Act 1992"],
a:0,exp:"Class I: relies on basic insulation PLUS protective earthing conductor. Has 3-pin plug (with earth). If insulation fails, the earth provides protection. Class II (double insulated): has two layers of insulation (basic + supplementary), OR reinforced insulation. NO earth required. Has 2-pin plug marked with ⬜ (square within square symbol). Cannot become live on the outside even if primary insulation fails."},

// ── WOUND ROTOR / SLIP RING MOTOR ──
{t:"Motors & Starters",
q:"State the purpose of slip-rings on a wound rotor induction motor.",
opts:["To connect external resistance to the rotor winding for starting torque control and speed regulation","To collect current from the stator for the rotor field under normal operating conditions","To short-circuit the rotor windings during normal running for the circuit in question","To connect the motor to a star-delta starter per the EWRB requirements"],
a:0,exp:"Wound rotor (slip-ring) motor: the rotor has a 3-phase winding with terminals brought out via slip-rings and brushes. External resistors are connected via the slip-rings during starting — this increases starting torque (by matching rotor resistance to rotor reactance) and reduces starting current. As the motor accelerates, resistance is progressively cut out."},

{t:"Motors & Starters",
q:"State TWO advantages of a wound rotor (slip-ring) induction motor over a squirrel cage induction motor for heavy starting loads.",
opts:["Higher starting torque with lower starting current (via external rotor resistance) and smooth speed control during acceleration","Lower cost and simpler maintenance in standard NZ installations for the circuit in question","Smaller physical size and lower operating temperature per AS/NZS 3000 requirements","Better power factor at full load and lower iron losses under normal operating conditions"],
a:0,exp:"Wound rotor advantages for heavy starting: (1) External rotor resistance gives high starting torque (up to 100% full-load torque at start) while limiting starting current to 1.5–2× FLC. Squirrel cage: 150–200% torque but 500–800% current. (2) External resistance allows controlled smooth acceleration. Used for hoists, mills, crushers, and loads requiring high starting torque."},

// ── SEMICONDUCTOR PROTECTION ──
{t:"Lighting & Electronics",
q:"State TWO devices used to protect semiconductor components against transient (surge) voltages.",
opts:["Metal Oxide Varistor (MOV) / surge diverter and snubber circuit (RC network)","HRC fuse and MCB as required by the EWRB","Earth leakage relay and thermal overload in all electrical installations","Zener diode and current transformer per the Electricity Act 1992"],
a:0,exp:"Semiconductor transient protection: (1) MOV (Metal Oxide Varistor) / surge diverter — clamps voltage spikes to a safe level by conducting heavily when voltage exceeds its rating. (2) Snubber circuit (RC network) — absorbs energy from voltage spikes across switching devices (thyristors, transistors). Also used: free-wheeling diode (across inductive loads), TVS diode, optocoupler for isolation."},

{t:"Lighting & Electronics",
q:"What is the purpose of a free-wheeling diode connected across an inductive load (e.g. a relay coil or motor) in a DC circuit?",
opts:["To suppress the voltage spike (back-EMF) when the inductive load is switched off, protecting the switching transistor or semiconductor","To increase the speed of the motor in standard NZ installations for all supply voltages","To convert AC to DC for the inductive load per AS/NZS 3000 requirements when correctly installed","To measure the inductance of the load under normal operating conditions — this approach is acceptable"],
a:0,exp:"When an inductive load (relay, motor winding) is switched off, the collapsing magnetic field induces a back-EMF that can be hundreds of volts — destroying the switching transistor. The free-wheeling (flyback) diode is connected in reverse bias across the load. When the transistor switches off, the diode conducts and provides a path for the inductor current, clamping the voltage spike to near zero."},

// ── POWER FACTOR CALCULATION FROM REAL PREP BANK ──
{t:"Calculations",

opts:["0.75","0.87","1.00","0.60"],
a:0,exp:"pf = P/(√3 × VL × IL) = 30000/(1.732 × 406 × 57) = 30000/(40,060) = 0.749 ≈ 0.75. Note: 406V is the measured line voltage (slightly above standard 400V) — use the actual measured value in calculations.",calc:true},

// ── FAULT CURRENT CALCULATION ──
{t:"Calculations",
q:"Calculate the fault current if a short circuit occurs on a 230V final subcircuit with an earth loop impedance of 0.32Ω.",
opts:["718.75A","736A","460A","230A"],
a:0,exp:"IF = V/Zs = 230/0.32 = 718.75A. This is the maximum fault current available at that point. The protective device must operate within the required disconnection time at this current.",calc:true},

// ── CLOSE EXCESS CURRENT PROTECTION ──
{t:"Electrical Protection",
q:"Explain 'close excess current protection' as it applies to protective devices.",
opts:["A device providing close protection operates within 4 hours when fault current is 1.5 times the rated current — it provides accurate protection to cables without allowing large sustained overloads","A device that provides protection only for short circuits, not overloads as required by the EWRB and is fully compliant","A device that operates instantaneously regardless of current level in all electrical installations as per standard practice","A device that is physically close to the load it protects per the Electricity Act 1992 without any additional testing"],
a:0,exp:"Close excess current protection: a device with a fusing factor of approximately 1.25–1.45. It must interrupt a fault current within 4 hours when current is 1.5× rated current. This means cables are protected against even modest overloads. HRC fuses and MCBs provide close protection. Rewireable fuses (fusing factor ~2) provide only coarse protection."},

// ── FUSING FACTOR / UTILISATION CATEGORY ──
{t:"Electrical Protection",
q:"What is another term used for 'fusing factor' in relation to protective devices?",
opts:["Utilisation category","Rupturing capacity","Cut-off current","I²t value as per standard practice"],
a:0,exp:"Fusing factor = minimum fusing current / rated current. It is also called the 'utilisation category'. For HRC fuses: approximately 1.25 (gG type). For rewireable fuses: approximately 2. A lower fusing factor = closer protection = better cable protection against overloads."},

// ── EIGHT MEN COMPONENTS ──
{t:"NZ Supply & MEN",
q:"State FOUR of the eight components of a MEN system found in a low voltage installation.",
opts:["Main earth bar, MEN link, main neutral bar, and main earthing conductor (also: earth electrode, protective earthing conductors, equipotential bonding conductors, main neutral conductor)","Phase conductors, MCBs, RCDs, and main switch in standard NZ installations without any additional testing","Supply cable, distribution board, submain, and final subcircuit per AS/NZS 3000 requirements for domestic installations","Transformer, lines, metering, and consumer switchboard under normal operating conditions — this is the correct NZ practice"],
a:0,exp:"The eight MEN system components: (1) Main earth bar, (2) MEN link (N-E bond), (3) Main neutral bar, (4) Main neutral conductor, (5) Main earthing conductor, (6) Earth electrode, (7) Protective earthing conductors (to all earthed equipment), (8) Equipotential bonding conductors. All work together to provide the MEN earthing system."},

// ── EARTHING SYSTEM FUNCTIONS ──
{t:"NZ Supply & MEN",
q:"State FIVE functions of the earthing arrangement of an electrical installation per AS/NZS 3000 Section 5.",
opts:["Automatic disconnection under fault, enable functional earth operation, provide low-impedance fault path, limit touch/step voltage, and provide lightning protection path","Improve power factor, balance three-phase loads, reduce voltage drop, limit harmonics, and prevent corrosion","Provide neutral return path, connect to transformer star point, limit EMI, provide surge path, and enable metering","Reduce iron losses, limit eddy currents, improve regulation, provide overcurrent path, and balance loads"],
a:0,exp:"AS/NZS 3000 Section 5 — earthing arrangement must: (1) Cause automatic disconnection under fault conditions. (2) Enable equipment requiring functional earth to work without interruption. (3) Provide protective earthing circuit with low-impedance fault path capable of carrying PSCC without danger. (4) Limit touch voltage and step voltage to safe levels. (5) Provide a path for lightning and transient surge currents."},

// ── SPLIT-PHASE STARTING METHODS ──
{t:"Motors & Starters",
q:"State TWO methods of phase-splitting used to provide starting torque in a single-phase induction motor.",
opts:["A capacitor in series with the auxiliary (start) winding and using different winding impedances (resistance split-phase)","DOL starting and star-delta starting as required by the EWRB","Adding a third phase conductor and using a phase reversal relay in all electrical installations","Installing an auto-transformer and using a soft starter per the Electricity Act 1992"],
a:0,exp:"Phase-splitting creates the phase displacement needed for starting torque: (1) Capacitor split-phase — a capacitor in series with the auxiliary winding creates a large (up to 90°) phase displacement for high starting torque. (2) Resistance split-phase — the start winding has higher R/X ratio than the run winding, creating a small phase displacement. (3) Shaded pole — copper shading band on stator pole (small, fixed-direction motors only)."},

// ── INSULATION RESISTANCE TEST RESULT IDENTIFICATION ──
{t:"Testing & Inspection",
q:"A low voltage final subcircuit is tested and gives a result of 20MΩ. What type of test has been carried out?",
opts:["Insulation resistance test — 20MΩ is well above the 1MΩ minimum and indicates excellent insulation","Earth continuity test — 20MΩ indicates a poor earth connection","Earth fault loop impedance test — 20MΩ indicates very high impedance","RCD trip time test — 20MΩ is the leakage current measured in milliamps"],
a:0,exp:"An insulation resistance test gives results in MΩ (megaohms) using a 500V DC Megger. 20MΩ is an excellent result — well above the minimum 1MΩ required by AS/NZS 3000. Earth continuity tests give results in Ω (ohms, typically <1Ω). Loop impedance tests give results in Ω (typically <1Ω). RCD tests give trip time in ms."},

// ── PROTECTIVE EARTHING CONDUCTOR AND RCD ──
{t:"RCDs & Isolating Transformers",
q:"Explain why it is necessary to have a protective earthing conductor in a final subcircuit protected by an RCD.",
opts:["An earth fault path must exist for fault current to flow — without it the RCD cannot detect the leakage and will not operate, and the metal frame remains live at phase voltage","The RCD replaces the need for a protective earthing conductor completely per AS/NZS 3000 requirements","The earth conductor carries neutral return current in an RCD-protected circuit for registered electricians","The RCD needs the earth conductor to measure its own trip current internally under the Electricity Act 1992"],
a:0,exp:"For the RCD to detect and clear a phase-to-earth fault: current must flow FROM the phase conductor, THROUGH the fault, TO earth, and BACK via the earthing system — creating the residual current the RCD detects. Without an earth conductor, no fault current flows and the RCD sees no imbalance. Also: during the RCD trip delay (~40–300ms), the earthing limits touch voltage on exposed metalwork."},

// ── ZENER DIODE CONNECTION ──
{t:"Lighting & Electronics",
q:"For a Zener diode to operate correctly as a voltage regulator, how must it be connected in a circuit?",
opts:["Reverse biased — cathode to the positive supply rail, anode to the negative rail","Forward biased — same as a normal rectifier diode for registered electricians","In series with the load, forward biased under the Electricity Act 1992","In parallel with the supply, forward biased as tested and verified on site"],
a:0,exp:"A Zener diode is connected REVERSE biased. Unlike normal diodes (which break down destructively in reverse), Zener diodes are designed to operate continuously in reverse breakdown at their Zener voltage (Vz). Connected in reverse parallel with the load, the Zener clamps the output voltage at Vz regardless of supply or load variation. A series resistor limits the Zener current."},

// ── TRANSFORMER SECONDARY VOLTAGE DROP REASON ──
{t:"Transformers",
q:"State the reason why the secondary terminal voltage of a transformer is lower at full load than at no load.",
opts:["When load current flows, there is an internal voltage drop across the winding impedance (resistance and leakage reactance) — this drop increases with load current","The turns ratio changes under load conditions in standard NZ installations under the Electricity Act 1992","The core magnetisation increases under load causing flux saturation per AS/NZS 3000 requirements as tested and verified on site","The primary voltage decreases as the load increases under normal operating conditions to comply with the regulations"],
a:0,exp:"At no load: no current flows through secondary winding — no impedance drop. At full load: full-load current IL flows through secondary winding resistance (R) and leakage reactance (XL). Voltage drop = IL × Z_winding. This drop appears as reduced secondary terminal voltage. This is the transformer's voltage regulation, typically 2–5% for power transformers."},

// ── HRC FUSE TECHNICAL TERMS ──
{t:"Electrical Protection",
q:"Define the term 'pre-arcing time' as it refers to HRC fuses.",
opts:["The time taken from the start of the fault until the fuse element melts completely","The time taken for the arc to extinguish after the element melts","The total time from fault start to current interruption","The time delay before the fuse begins to respond to an overload"],
a:0,exp:"Pre-arcing time: the time from when the fault current starts flowing until the fuse element has completely melted. During this period energy is being absorbed by the element. The element melts when the I²t energy input equals the melting I²t of the fuse. The arc then begins — this is the start of the arcing period."},

{t:"Electrical Protection",
q:"Define the term 'total clearing time' of an HRC fuse and identify its two components.",
opts:["Pre-arcing time (element melts) PLUS arcing time (arc extinguishes) = total time from fault start to current interruption","The rated operating time at normal current as required by the EWRB","The time for the fuse to cool down after operating in all electrical installations","The time from when the fuse is installed to when it first operates per the Electricity Act 1992"],
a:0,exp:"Total clearing time = pre-arcing time + arcing time. Pre-arcing: fault starts → element melts. Arcing: arc is drawn in silica sand filler → arc is extinguished → current is zero. For HRC fuses at high fault currents this total time can be less than one half-cycle (under 10ms at 50Hz) — extremely fast."},

// ── INVERSE TIME-CURRENT CHARACTERISTIC ──
{t:"Electrical Protection",
q:"Explain the term 'inverse time-current characteristic' as it relates to protective devices.",
opts:["As fault current increases the operating time DECREASES — a large overcurrent clears faster than a small one; mathematically the time is inversely proportional to (current)²","The device takes the same time to operate regardless of current magnitude in standard NZ installations","The device operates faster at lower currents than at higher currents per AS/NZS 3000 requirements","The operating time is directly proportional to current — more current means more time under normal operating conditions"],
a:0,exp:"Inverse time-current characteristic: operating time ∝ 1/I² (approximately). A small overload (1.5× rated) → device takes minutes. A large fault (10× rated) → device operates in milliseconds. This characteristic allows motors to start (brief high current) without tripping, while clearing large faults rapidly. It is the standard characteristic for thermal-magnetic MCBs and HRC fuses."},

// ── SMOOTHING DC OUTPUT ──
{t:"Lighting & Electronics",
q:"Name TWO components used to smooth the DC output of a rectifier and explain why each helps.",
opts:["Capacitor (charges during peaks, discharges between them — reduces ripple amplitude) and inductor/choke (opposes rapid current change — smooths ripple)","Transformer and fuse — transformer reduces voltage, fuse limits current — no further action is required","Resistor and diode — resistor limits current, diode blocks AC for the installation concerned","Transistor and zener diode — transistor amplifies, zener regulates under normal operating conditions"],
a:0,exp:"(1) Capacitor: connected in parallel with load. Charges to peak voltage during each pulse; discharges slowly into load between pulses — reduces peak-to-peak ripple. Larger capacitance = better smoothing. (2) Inductor (choke): connected in series with load. Opposes rapid current changes (V = L×di/dt) — smooths out current variations. LC filter together gives excellent smoothing."},

// ── PF CALCULATION SCENARIO ──
{t:"Scenarios",
q:"SCENARIO: An electrician measures a three-phase load on a factory installation: P = 45kW, VL = 400V, IL = 82A. Calculate the power factor and state whether this is acceptable for a commercial supply authority.",
opts:["pf = 0.79 lagging — most supply authorities require pf ≥ 0.85 or 0.90, so this installation may incur a low power factor penalty charge","pf = 1.0 — unity power factor, no action required as required by the EWRB","pf = 0.65 — extremely poor, immediate capacitor correction required in all electrical installations","pf = 0.95 — excellent, no action required per the Electricity Act 1992"],
a:0,exp:"pf = P/(√3×VL×IL) = 45000/(1.732×400×82) = 45000/(56,809) = 0.792 ≈ 0.79. Most NZ supply authorities require commercial customers to maintain pf ≥ 0.85–0.90. A pf of 0.79 would likely attract a low pf penalty charge or require power factor correction capacitors to be installed.",calc:true},

// ── MEN SWITCHBOARD vs DISTRIBUTION BOARD ──
{t:"NZ Supply & MEN",
q:"Name TWO characteristics of a MEN switchboard that are NOT found on a distribution board.",
opts:["Has a MEN link connecting neutral to earth bars, and has an earthing conductor connected to an earth electrode","Has a main switch and neutral bar only in standard NZ installations","Has higher current rating and more circuit breakers per AS/NZS 3000 requirements","Has metering equipment and a time switch under normal operating conditions"],
a:0,exp:"A MEN switchboard specifically has: (1) MEN link — a connection between the neutral busbar and the earth bar, bonding them together. (2) Earthing conductor connected to an earth electrode (earth rod, plate etc.) to provide the connection to the mass of earth. A distribution board has neither of these — it relies on the MEN connection at the upstream MEN switchboard."},

// ── SKIN EFFECT / PROXIMITY EFFECT ──
{t:"Cables & Switchboards",
q:"What is the 'skin effect' in AC conductors and why is it relevant to cable selection for large conductors?",
opts:["At higher frequencies, AC current tends to flow on the outer surface (skin) of a conductor — this reduces the effective cross-sectional area and increases effective AC resistance compared to DC resistance","The skin effect reduces the insulation life of cables in high temperature environments as required by the EWRB for the circuit in question","The skin effect is the voltage gradient across the cable insulation in all electrical installations per the EWRB requirements","The tendency of cables to overheat when installed in conduit per the Electricity Act 1992 for all supply voltages"],
a:0,exp:"Skin effect: at AC frequencies, current distributes unevenly in a conductor — highest density at the surface (skin), decreasing toward the centre. This is caused by eddy currents from the conductor's own magnetic field opposing current flow in the centre. At 50Hz the effect is small for conductors up to ~25mm², but becomes significant for larger conductors — increasing AC resistance above DC resistance. Cable manufacturers publish AC resistance values for this reason."},

// ── RCD SENSITIVITY ──
{t:"RCDs & Isolating Transformers",
q:"Explain the term 'sensitivity' as it applies to a residual current device (RCD).",
opts:["Sensitivity is the minimum earth leakage current required to cause the RCD to operate and disconnect the circuit","Sensitivity is the maximum operating time of the RCD at rated residual current","Sensitivity is the voltage at which the RCD operates when correctly installed","Sensitivity is the number of poles switched when the RCD trips — this approach is acceptable"],
a:0,exp:"RCD sensitivity = the rated residual operating current (IΔn) — the minimum imbalance (earth leakage) current between live and neutral that will cause the device to trip. A 30mA RCD has higher sensitivity than a 100mA RCD. Lower IΔn = more sensitive = better personal protection."},

// ── PRCD VOLTAGE DEPENDENT ──
{t:"RCDs & Isolating Transformers",
q:"In New Zealand, which type of RCD is required to be voltage-dependent (relies on supply voltage to operate)?",
opts:["Portable Residual Current Device (PRCD)","Residual Current Circuit Breaker (RCCB)","Socket-type RCD (SRCD)","Residual Current Circuit Breaker with Overcurrent (RCBO)"],
a:0,exp:"A PRCD (Portable Residual Current Device) is functionally dependent on the supply voltage to operate its trip mechanism. This is acceptable for a portable device because it will not operate if there is no supply voltage — but this is not a safety issue because there is also no hazard without supply. Fixed RCDs (RCCB, SRCD, RCBO) must be voltage-independent (operate even on loss of supply)."},

// ── RCD PATIENT TREATMENT AREA ──
{t:"RCDs & Isolating Transformers",
q:"State the maximum residual current rating for an RCD installed in a patient treatment area of a medical facility.",
opts:["10mA — the highest sensitivity level for areas of maximum risk","30mA — standard personal protection threshold","100mA — property protection level","300mA — fire protection level only"],
a:0,exp:"Patient treatment areas (operating theatres, ICUs, procedure rooms): maximum 10mA RCD threshold per AS/NZS 3000 and medical electrical installation standards. Patients on life support or sedation cannot react to protect themselves — even 10mA can be fatal for someone with direct cardiac connections. This is the highest sensitivity level available for personal protection."},

// ── RUN CAPACITOR ──
{t:"Motors & Starters",
q:"State TWO reasons why a run capacitor would be fitted to a single-phase split-phase induction motor.",
opts:["Quieter running and better running torque (also: less current draw and increased efficiency)","Higher starting torque and faster acceleration","Lower manufacturing cost and easier maintenance","Better starting torque and reduced running temperature only"],
a:0,exp:"A run capacitor (permanently connected in series with the auxiliary winding during running): (1) Improves power factor → less reactive current → better efficiency and lower current draw. (2) Creates better phase displacement in running → smoother, quieter operation and improved running torque. Unlike a start capacitor (switched out after starting), the run capacitor stays in circuit continuously."},

// ── STAR SYSTEM VOLTAGE ANGLE ──
{t:"NZ Supply & MEN",
q:"In a star-connected three-phase electrical system, what is the phase angle between the line voltage and the phase voltage?",
opts:["30 degrees","0 degrees","90 degrees","60 degrees"],
a:0,exp:"In a star (wye) connected system: the line voltage is the phasor difference of two phase voltages separated by 120°. The resultant line voltage leads the phase voltage by 30°. This is why VL = √3 × Vph and not 2 × Vph. The factor √3 comes from the 30° geometric relationship in the phasor diagram."},

// ── FUNCTIONAL EARTH vs PROTECTIVE EARTH ──
{t:"NZ Supply & MEN",
q:"State the difference between a Protective Earth (PE) and a Functional Earth (FE).",
opts:["PE: protects people by providing fault current path for automatic disconnection. FE: ensures correct operation of equipment (e.g. electronics, radio suppression) — not required to carry fault current","PE: connects equipment to the neutral conductor. FE: connects equipment to the phase conductor in standard NZ practice for domestic installations","PE: for outdoor installations only. FE: for indoor installations only as required by AS/NZS 3000 — this is the correct NZ practice","PE: used only on three-phase equipment. FE: used only on single-phase equipment under normal operating conditions in standard LV installations"],
a:0,exp:"Protective Earth (PE): primary purpose is protection of people and property. The PEC must carry maximum fault current without failure. Functional Earth (FE): required for correct operation of equipment (e.g. EMI suppression in radios, reducing circulating currents in motor cable screens). FE is NOT required to withstand fault currents. Both can share the same conductor in some cases."},

// ── EQUIPOTENTIAL BONDING ──
{t:"NZ Supply & MEN",
q:"What is the purpose of equipotential bonding (EQ bonding) in an electrical installation?",
opts:["To connect all exposed and extraneous conductive parts to the same electrical potential — preventing dangerous voltage differences between them during a fault","To increase the fault current for faster protective device operation per EWRB requirements","To connect the neutral to the earth at the main switchboard for all electrical installations","To provide additional phase conductors for increased current capacity per the Electricity (Safety) Regulations 2010"],
a:0,exp:"Equipotential bonding connects metallic parts (pipework, structural steelwork, cable tray, conduit, building framework) to the same earth potential. During a fault, if these parts were at different potentials, touching two simultaneously could cause a shock. EQ bonding ensures all metallic surfaces are at the same potential — eliminating voltage differences regardless of whether a fault is present."},

// ── EXTRANEOUS CONDUCTIVE PARTS ──
{t:"NZ Supply & MEN",
q:"Give FOUR examples of extraneous conductive parts that must be connected to equipotential bonding in an installation.",
opts:["Water pipes, gas pipes, structural steel, and conductive cable tray or conduit","Phase conductors, neutral conductors, earth conductors, and bonding conductors","Fuses, MCBs, RCDs, and isolators in standard LV installations","Transformers, motors, switchboards, and light fittings"],
a:0,exp:"Extraneous conductive parts are metallic parts NOT part of the electrical installation but which could introduce earth potential: (1) Water/plumbing pipes, (2) Gas pipes, (3) Structural steel framework, (4) Cable tray and conduit systems, (5) HVAC metalwork, (6) Building reinforcing steel (earth grid). All must be connected to the main earth bar via bonding conductors."},

// ── WHAT CANNOT BE USED FOR EQ BONDING ──
{t:"NZ Supply & MEN",
q:"State TWO items that CANNOT be used as equipotential bonding conductors or connection points in an electrical installation.",
opts:["Pipes carrying hot water/high-pressure liquids and fire sprinkler heads/water dispersal pieces","Copper water pipes and structural steel beams in standard NZ practice","Metal conduit and cable tray systems as required by AS/NZS 3000","Gas pipes and metallic ductwork under normal operating conditions"],
a:0,exp:"Per AS/NZS 3000: equipotential bonding CANNOT use: (1) Pipes carrying hot water or high-pressure liquids — risk of pipe failure/leakage if fault current flows. (2) Fire sprinkler heads and water dispersal pieces — fault current could activate sprinklers. Also excluded: pipes carrying flammable substances, lightning protection conductors (separate system), items that could create hazards if carrying fault current."},

// ── STEP VOLTAGE AND TOUCH VOLTAGE ──
{t:"NZ Supply & MEN",
q:"Define 'step voltage' as it relates to earthing and electrical safety.",
opts:["The voltage gradient across 1 metre of ground surface near a downed live conductor or earthed fault point — dangerous because a person's feet can be at different potentials","The voltage between phase and neutral in a step-down transformer per EWRB requirements for registered electricians","The voltage surge when switching a circuit on or off for all electrical installations under the Electricity Act 1992","The voltage drop across a cable at full load current per the Electricity (Safety) Regulations 2010 as tested and verified on site"],
a:0,exp:"Step voltage: when a high current flows into the earth (from a downed conductor, lightning strike, or earth fault), a voltage gradient spreads radially from the earth point. A person standing with feet 1 metre apart can have different ground potentials under each foot — the voltage difference drives current through their legs. Fatal step voltages occur near electricity towers and fault points. Shuffling feet (keeping them together) reduces risk."},

{t:"NZ Supply & MEN",
q:"Define 'touch voltage' as it relates to electrical safety.",
opts:["Voltage between a live/faulted metal part and the ground where a person stands — drives shock current through the body","The voltage at which insulation begins to break down in standard NZ practice","The open-circuit voltage of a battery as required by AS/NZS 3000","The voltage measured between two phases in a three-phase system under normal operating conditions"],
a:0,exp:"Touch voltage: the potential difference between an earthed (or faulted) metal surface (e.g. equipment casing) and the floor/ground where a person stands. If a phase fault makes a casing live, the touch voltage = voltage on the casing minus the ground potential under the person's feet. This voltage drives current through the hand-to-foot path. Earthing and fast protective devices limit touch voltage to safe levels."},

// ── EARTH GRIDS ──
{t:"NZ Supply & MEN",
q:"Where are earth grids typically installed and what is their purpose?",
opts:["In substations and generator rooms — to minimise step voltage gradients and provide a low-impedance earth reference for high fault current systems","In all domestic installations — to replace the earth electrode as tested and verified on site","In overhead transmission lines — to reduce corona discharge to comply with the regulations","In fluorescent light fittings — to reduce stroboscopic effects in all electrical installations"],
a:0,exp:"Earth grids (interconnected bare copper conductors buried in the ground) are used in: substations, generating stations, industrial sites with high fault levels. Purpose: (1) Provide very low impedance earth return path. (2) Minimise step voltage gradients around the site — if fault current flows, the grid distributes it over a large area, keeping voltage gradients safe. (3) Provide equipotential surface for personnel working in the area."},

// ── PE vs FE EXAMPLES ──
{t:"NZ Supply & MEN",
q:"State TWO examples of Functional Earth (FE) requirements in electrical installations.",
opts:["EMI/RFI suppression in radio and communications equipment, and earthing of 3-phase motor cable screens at both ends to reduce circulating harmonic currents","Earthing of metal enclosures and bonding of pipework per EWRB requirements to comply with the regulations","Lightning protection and surge arrestors for all electrical installations in all electrical installations","Phase conductors in the motor circuit and neutral at the switchboard per the Electricity (Safety) Regulations 2010"],
a:0,exp:"FE examples: (1) Radio/communications equipment — the cable screen or chassis must be earthed to suppress interference, not for shock protection. (2) VSD motor cable screens — earthed at both ends to provide a low-impedance path for high-frequency circulating currents induced by the VSD switching, preventing interference with other equipment."},

{t:"NZ Supply & MEN",
q:"In New Zealand, what name is given to the system where the neutral conductor is connected to earth at the main switchboard on all low voltage installations?",

// ── EWRB THEORY Quizlet (quizlet.com/nz/798600840) ──
{t:"Electrical Protection",
q:"State ONE reason why HRC fuses are installed at the origin of a final subcircuit supplying a three-phase induction motor controlled by a star-delta starter.",
opts:["To provide short-circuit fault protection to both the final subcircuit cable and the motor — the thermal overloads cannot safely interrupt high short-circuit currents","To provide overload protection only — the thermal overloads handle short circuits in standard NZ practice for the installation concerned","To reduce the starting current during star-delta transition as required by AS/NZS 3000 under normal operating conditions","To protect the contactor coil from overvoltage under normal operating conditions for the circuit in question"],
a:0,exp:"HRC fuses at origin: the thermal overload relay protects against sustained overcurrents (overloads) but CANNOT safely interrupt short-circuit fault currents (potentially many kA). HRC fuses provide: (1) Short-circuit protection for the final subcircuit cable, (2) Back-up short-circuit protection for the motor and starter. Rupturing capacity of HRC fuses (up to 80kA) far exceeds what thermal overloads can handle."},

{t:"Personal Safety & Isolation",
q:"State ONE reason why the maximum earth continuity conductor resistance for a Class I appliance flexible cord is set at 1 ohm.",
opts:["It prevents touch voltage on the appliance casing from rising to dangerous levels under fault conditions","It ensures the conductor does not overheat during normal use","It is required by the appliance manufacturer's specifications","It matches the phase conductor resistance for balanced loading"],
a:0,exp:"1Ω maximum ECC resistance: (1) Under a phase-to-earth fault, the touch voltage on the casing = fault current × ECC resistance. With 1Ω max, the touch voltage is limited to a safe level during the brief period before protection operates. Also: low earth resistance ensures the fault current is high enough to operate the protective device within 0.4s (for socket outlet circuits). From EWRB Theory Quizlet NZ."},

// ── MAGNETISM & ELECTROMAGNETISM ──
{t:"AC Theory & Waveforms",
q:"State Faraday's Law of electromagnetic induction.",
opts:["The magnitude of the induced EMF in a conductor is proportional to the rate of change of magnetic flux linking the conductor","Current in a conductor produces a magnetic field around it per EWRB requirements","Like magnetic poles repel; unlike poles attract for all electrical installations","The force on a current-carrying conductor in a magnetic field is proportional to the current and field strength"],
a:0,exp:"Faraday's Law: E = -N × dΦ/dt. The induced EMF (E) is proportional to the number of turns (N) and the rate of change of magnetic flux (dΦ/dt). This is the fundamental principle behind transformers, generators, and induction motors. The negative sign (Lenz's Law) means the induced EMF opposes the change that caused it."},

{t:"AC Theory & Waveforms",
q:"State Lenz's Law as it applies to electromagnetic induction.",
opts:["The induced current always flows in a direction that opposes the change in magnetic flux that caused it","The induced EMF is proportional to the square of the magnetic field","The magnetic force on a conductor is proportional to its length per the EWRB requirements","All magnetic field lines form closed loops for all supply voltages"],
a:0,exp:"Lenz's Law: the induced current flows in a direction such that its magnetic effect opposes the change in flux that induced it. This is the basis of back-EMF in motors (opposing the applied voltage), transformer action, and eddy current braking. It is a consequence of conservation of energy — if the induced current aided the flux change, energy would be created from nothing."},

{t:"AC Theory & Waveforms",
q:"What is the left-hand rule (Fleming's left-hand rule) used for in electrical engineering?",
opts:["To determine the direction of force on a current-carrying conductor in a magnetic field — used for motor action","To determine the direction of induced EMF in a generator — used for generator action","To find the direction of current flow in a series circuit","To determine the polarity of a transformer secondary winding"],
a:0,exp:"Fleming's Left-Hand Rule (motor rule): point the thumb, index finger, and middle finger at right angles. Index finger = Field direction (N to S), Middle finger = Current direction, Thumb = direction of Motion (force). Used to find the direction a conductor will move in a motor. The Right-Hand Rule (generator rule) is used for induced EMF direction."},

{t:"AC Theory & Waveforms",
q:"What is the relationship between the speed of a DC motor and its back-EMF?",
opts:["As speed increases, back-EMF increases — reducing the net voltage across the armature and limiting the current drawn","As speed increases, back-EMF decreases — allowing more current and more torque","Back-EMF is constant regardless of speed per the Electricity (Safety) Regulations 2010","Back-EMF only exists in AC motors, not DC motors in standard NZ practice"],
a:0,exp:"DC motor back-EMF: E_back = K × φ × N (proportional to flux and speed). As motor speeds up: back-EMF rises → (V_supply - E_back) decreases → armature current decreases → torque decreases → equilibrium reached at running speed. This self-regulating action stabilises motor speed under load. At start: back-EMF = 0 → full voltage across armature resistance → high starting current (6-8× rated)."},

// ── BATTERIES / DC SOURCES ──
{t:"Calculations",
q:"A 12V battery with internal resistance 0.4Ω is connected to a 5.6Ω load. Calculate the terminal voltage under load.",
opts:["11.2V","12.0V","10.4V","8.0V"],
a:0,exp:"I = EMF/(r+R) = 12/(0.4+5.6) = 12/6 = 2A. Terminal V = EMF - (I×r) = 12 - (2×0.4) = 12 - 0.8 = 11.2V. Or: V = I×R = 2×5.6 = 11.2V.",calc:true},

{t:"Calculations",
q:"What is the effect on terminal voltage when a battery is under heavy load compared to no load?",
opts:["Terminal voltage decreases under heavy load due to the internal resistance voltage drop (V_terminal = EMF - I×r)","Terminal voltage increases under heavy load as required by AS/NZS 3000","Terminal voltage remains constant regardless of load under normal operating conditions","Terminal voltage equals EMF under all conditions per EWRB requirements"],
a:0,exp:"Under heavy load: high current → large voltage drop across internal resistance (V_drop = I × r) → lower terminal voltage. Under no load: I = 0 → no internal drop → terminal voltage = EMF. This is why a battery voltmeter reads 12V unloaded but may read 10.5V when starting a car (high current load). Good batteries have low internal resistance."},

// ── MAGNETISM CALCULATIONS ──
{t:"Calculations",
q:"A 230V DC generator has an armature resistance of 0.5Ω and supplies full-load current of 40A. Calculate the back-EMF generated.",
opts:["210V","230V","250V","200V"],
a:0,exp:"V_terminal = E_back - (I × R_armature) → E_back = V_terminal + (I × R_armature) = 230 + (40 × 0.5) = 230 + 20 = 250V. Note: for a generator, the back-EMF is higher than the terminal voltage (the armature drops voltage).",calc:true},

{t:"Calculations",
q:"A DC motor has: supply voltage 230V, armature resistance 0.5Ω, running current 20A. Calculate the back-EMF.",

{t:"Motors & Starters",
q:"Why do three-phase induction motors run smoother and quieter than single-phase induction motors?",
opts:["They have a constant rotating magnetic field that produces steady torque — single-phase motors produce a pulsating field with torque that fluctuates twice per cycle","They operate at higher voltage which reduces current fluctuations for all electrical installations","They use capacitors to smooth the current waveform per the Electricity (Safety) Regulations 2010","They have better quality bearings and manufacturing tolerances in standard NZ practice"],
a:0,exp:"Three-phase: the three voltages (120° apart) create a continuously rotating magnetic field with constant magnitude. This produces constant, smooth torque. Single-phase: the single-phase field pulsates at 100Hz (twice supply frequency) rather than rotating — the motor torque pulsates, causing vibration and acoustic noise. This is fundamental to why three-phase motors are preferred for heavy industrial use."},

{t:"Electrical Protection",
q:"Apart from cost, state TWO technical advantages of MCBs compared to HRC fuses.",
opts:["MCBs can be reset after tripping (reusable) and a 3-pole MCB disconnects all phases simultaneously preventing single-phasing","MCBs have higher rupturing capacity and faster operation to comply with the regulations","MCBs provide better discrimination and have a lower fusing factor in all electrical installations","MCBs have longer service life and lower contact resistance — no further action is required"],
a:0,exp:"MCB advantages over HRC fuses: (1) Resettable — after a trip, an MCB can be reset and reused. An HRC fuse must be replaced (requiring the correct replacement available on site). (2) 3-pole MCBs disconnect all three phases simultaneously — preventing single-phasing which would damage 3-phase motors. Individual fuses may blow on one phase only, leaving the motor running on two phases."},

{t:"Electrical Protection",
q:"What is the fusing factor and why does it matter for cable protection?",
opts:["Fusing factor = minimum fusing current / rated current — a low factor means the device operates closer to its rated current, providing better protection to cables against even small overloads","Fusing factor = maximum fault current / rated current as required by AS/NZS 3000 in all electrical installations","Fusing factor = the time taken for the fuse to blow at rated current under normal operating conditions — no further action is required","Fusing factor = the ratio of secondary to primary current in a transformer per EWRB requirements for the installation concerned"],
a:0,exp:"Fusing factor = (minimum fusing current) / (rated current). HRC fuse: ~1.25. Rewireable fuse: ~2.0. A rewireable fuse with factor 2.0 will only blow when current reaches 2× rating — a cable could carry 2× its rated current for an extended period, causing dangerous overheating. An HRC fuse (factor 1.25) blows at 1.25× rating — much better cable protection."},

a:0,exp:"Luminous flux (F or Φ): the total quantity of visible light energy radiated by a source per second. Unit: lumen (lm). Related terms: Luminous intensity (I) = flux per steradian = candela (cd). Illuminance (E) = flux per unit area = lux (lx = lm/m²). Luminous efficacy = lm/W (efficiency)."},

{t:"AC Theory & Waveforms",

a:0,exp:"Time constant τ = R × C (ohms × farads = seconds). After one τ: capacitor charges to 63.2% of supply voltage. After 5τ: considered fully charged (99.3%). Used in: timing circuits, filter design, motor starting delays, smoothing circuits. τ is the same for charging and discharging.",calc:true},

{t:"AC Theory & Waveforms",
q:"In an AC circuit, capacitive reactance (XC) decreases as frequency increases. What is the practical significance of this?",
opts:["Capacitors pass high frequencies more easily (lower opposition) and block low frequencies (DC) — used as high-pass filters and coupling capacitors","Capacitors become more resistive at higher frequencies as required by AS/NZS 3000","Capacitors have constant opposition regardless of frequency under standard NZ conditions","Higher frequencies cause capacitors to overheat per EWRB Teaching Guidelines"],
a:0,exp:"XC = 1/(2πfC). As f increases: XC decreases → capacitor passes high-frequency AC more easily. As f→0 (DC): XC→∞ → capacitor blocks DC. This makes capacitors ideal for: coupling AC signals while blocking DC bias; high-pass filters (pass high, block low); decoupling power supply noise; power factor correction (supplying leading reactive current)."},

// ── TRANSFORMER POLARITY AND PARALLEL OPERATION ──
{t:"Transformers",
q:"State TWO conditions that must be met before two single-phase transformers can be connected in parallel.",
opts:["Same voltage ratio (turns ratio), and same percentage impedance — also same polarity and same frequency","Same physical size and same manufacturer for registered electricians in NZ","Same kVA rating only in standard electrical practice","Same location and same cable length only as per Electricity (Safety) Regulations 2010"],
a:0,exp:"For parallel transformer operation: (1) Same voltage ratio — both secondaries must have identical output voltages. (2) Same percentage impedance (%Z) — ensures load sharing proportional to kVA rating. Also required: same polarity/phase relationship, same frequency, same winding connections (e.g. both delta-star). Mismatched %Z causes circulating currents and overloading of the lower impedance unit."},

{t:"Transformers",
q:"What is transformer 'percentage impedance' (%Z) and why does it matter?",
opts:["The percentage of supply voltage required to drive full-load current through the short-circuited transformer — determines short-circuit current and load sharing in parallel operation","The percentage of turns that are defective as required by AS/NZS 3000 in standard NZ electrical practice","The percentage efficiency of the transformer at full load under standard NZ conditions as required by EWRB Teaching Guidelines","The percentage voltage drop at rated current only per EWRB Teaching Guidelines under the Electricity (Safety) Regulations 2010"],
a:0,exp:"%Z = (V_short_circuit / V_rated) × 100. A typical value: 4-6% for power transformers. Significance: (1) Determines maximum short-circuit current: I_sc = I_rated / (%Z/100). (2) For parallel transformers: must be equal for proportional load sharing. (3) Lower %Z = better voltage regulation but higher fault current."},

// ── ADDITIONAL MOTOR QUESTIONS FROM TEACHING GUIDELINES ──
{t:"Motors & Starters",
q:"What is 'slip' in an induction motor and why must it always be greater than zero during normal operation?",
opts:["Slip is the difference between synchronous speed and rotor speed — it must be greater than zero because torque is only produced when the rotor lags the rotating magnetic field, inducing rotor currents that create the torque","Slip is the mechanical friction in the bearings as required by AS/NZS 3000 for LV electrical installations in NZ","Slip is the voltage difference between primary and secondary windings under standard NZ conditions as specified in the relevant standard","Slip is zero when the motor is running at full load per EWRB Teaching Guidelines in standard NZ electrical practice"],
a:0,exp:"Slip = (Ns - Nr)/Ns × 100%. Slip must be >0 because: the rotor can only have currents induced in it if it turns SLOWER than the rotating field (relative motion). Without slip → no flux cutting → no induced rotor currents → no rotor force → no torque. At synchronous speed (slip=0): no torque, so the motor would slow down. Normal running slip: 2-6% for squirrel cage induction motors."},

{t:"Motors & Starters",
q:"An auto-transformer starter on a large pump motor is set to the 65% voltage tap. What is the effect on starting current and starting torque compared to DOL?",
opts:["Starting current = 42.25% of DOL (0.65² = 0.4225); starting torque = 42.25% of DOL torque","Starting current = 65% of DOL; starting torque = 65% of DOL","Starting current = 65% of DOL; starting torque = 42.25% of DOL","Starting current = 42.25% of DOL; starting torque = 65% of DOL"],
a:0,exp:"Auto-transformer at 65% voltage tap: Starting current = (0.65)² = 0.4225 = 42.25% of DOL. Starting torque = (0.65)² = 42.25% of DOL. Note: BOTH current AND torque reduce by the square of the voltage ratio. This is because I ∝ V (current reduces with V) AND T ∝ V² (torque reduces with V²). Auto-transformer starters are more efficient than star-delta because current reduction = V²× ratio.",calc:true},

// ── HARMONICS (from EWRB teaching guidelines) ──
{t:"AC Theory & Waveforms",
q:"What are 'harmonics' in an AC power system and what problems do they cause?",
opts:["Multiples of the fundamental frequency generated by non-linear loads — they cause overheating of neutral conductors, transformer heating, interference with communications, and tripping of protection devices","Additional phases added to a three-phase system for redundancy for registered electricians in NZ as required by EWRB Teaching Guidelines","Voltage surges caused by lightning strikes in standard electrical practice under the Electricity (Safety) Regulations 2010","Interference from neighbouring radio transmitters as per Electricity (Safety) Regulations 2010 for all registered electricians"],
a:0,exp:"Harmonics: integer multiples of the fundamental 50Hz frequency (3rd=150Hz, 5th=250Hz, 7th=350Hz etc.). Caused by: VSD motor drives, computers, fluorescent lighting, UPS systems, arc welding. Problems: (1) Overheating of neutral conductors (3rd harmonics add in neutral rather than cancelling). (2) Transformer core overheating. (3) Capacitor damage. (4) False tripping of protective devices. (5) Interference with communications equipment."},

{t:"AC Theory & Waveforms",
q:"Why can the neutral conductor in a three-phase installation with highly non-linear loads (computers, VSD drives) carry MORE current than the phase conductors?",
opts:["Triple-order harmonics (3rd, 9th, 15th) from single-phase non-linear loads ADD together in the neutral rather than cancelling — the neutral can carry up to 1.73 times phase current","The neutral always carries exactly the same current as the phases as required by AS/NZS 3000","The neutral carries more current because it is connected to earth under standard NZ conditions","Non-linear loads draw DC current which accumulates in the neutral per EWRB Teaching Guidelines"],
a:0,exp:"In a balanced three-phase system, phase currents cancel in the neutral. However, triple-order harmonics (3rd, 6th, 9th harmonics) are all in phase — they do NOT cancel but ADD in the neutral conductor. With heavy computer/VSD loads, neutral current can exceed phase current by up to 1.73×. Solution: upsize neutral conductor or use separate neutral conductors per phase."},

// ── TYPE A RCD ──
{t:"RCDs & Isolating Transformers",
q:"Why must RCDs installed in New Zealand be Type A, and what is the difference between Type AC and Type A?",
opts:["Type A detects both sinusoidal AC and pulsating DC residual currents — Type AC only detects pure sinusoidal AC. Modern loads (computers, VSDs, battery chargers) produce pulsating DC leakage — only Type A reliably detects these","Type A is cheaper — Type AC is for industrial use only for registered electricians in NZ under the Electricity (Safety) Regulations 2010","Type A is for 3-phase circuits — Type AC for single phase in standard electrical practice for all registered electricians","Type A has a faster trip time — Type AC has a slower trip time as per Electricity (Safety) Regulations 2010 in normal electrical installation work"],
a:0,exp:"The Teaching Guidelines (Section 13.2) requires RCDs for NZ to be Type A. Type AC: only detects sinusoidal AC residual current. Type A: detects sinusoidal AC AND pulsating DC residual currents. Modern single-phase loads (computers, phone chargers, VSD drives, LED drivers) produce half-wave rectified pulsating DC leakage currents. A Type AC RCD may not trip for these — a Type A RCD will. NZ requires Type A for this reason."},

// ── RCD LOAD LEAKAGE CURRENTS ──
{t:"RCDs & Isolating Transformers",
q:"What is 'load leakage current' and why is it important when selecting and sizing an RCD?",
opts:["Normal leakage current from connected loads (cable capacitance, motor insulation, filter capacitors) — if total load leakage approaches the RCD trip threshold it may cause nuisance tripping","The current drawn by the RCD's own test button circuit as required by AS/NZS 3000 in all electrical installations","The current that flows through the RCD during a phase-to-earth fault under standard NZ conditions — no further action is required","The difference between rated and actual current drawn by the load per EWRB Teaching Guidelines for the installation concerned"],
a:0,exp:"Every cable and piece of equipment has some natural leakage to earth through cable capacitance and insulation. In a large installation, the sum of all load leakage currents can be significant. If total load leakage approaches the RCD IΔn (e.g. a 30mA RCD with 15mA total load leakage), nuisance tripping may occur. For large circuits: select a higher IΔn RCD, split circuits across multiple RCDs, or use time-delayed RCDs for discrimination."},

// ── PHASE REVERSAL RELAY ──
{t:"Motors & Starters",
q:"What is a phase reversal relay and where is it used?",
opts:["A relay that detects incorrect phase sequence and prevents motor starting — used on cranes, hoists, lifts, and conveyors where reversed rotation would be dangerous","A relay that reverses the motor direction automatically every hour as per Electricity (Safety) Regulations 2010","A relay that protects against phase-to-phase faults as required by AS/NZS 3000 per the EWRB requirements","A relay that prevents starting when supply voltage is too low under standard NZ conditions for all supply voltages"],
a:0,exp:"Phase reversal relay: monitors phase sequence (order of phases). If phases are connected in wrong sequence (e.g. RST instead of RYB), a 3-phase motor reverses. On a crane or hoist: reversed rotation = raise command lowers the load = catastrophic. The phase reversal relay checks phase sequence BEFORE allowing contactor to close — if sequence is wrong, motor cannot start. Also detects single-phasing."},

// ── NVR RELAY ──
{t:"Motors & Starters",
q:"What is a No Volt Release (NVR) coil and why is it used in motor starters?",
opts:["A contactor coil that drops out (opens) when supply voltage is lost or falls too low — preventing automatic motor restart when supply is restored, which could be dangerous","A relay that limits motor speed to prevent over-voltage per EWRB Teaching Guidelines for all supply voltages","A component that reduces starting current by lowering voltage for registered electricians in NZ when correctly installed","A relay that monitors the neutral conductor for voltage in standard electrical practice — this approach is acceptable"],
a:0,exp:"NVR (No Volt Release): the main contactor coil IS the NVR. When supply voltage drops below the coil's drop-out voltage (typically 50-75% of rated), the contactor OPENS and the motor stops. When supply is restored, the motor does NOT automatically restart — the operator must press Start again. Without NVR: power outage → motor stops → power returns → motor restarts automatically → dangerous if operator is near moving machinery."},

// ── NEUTRAL CURRENT CALCULATION ──
{t:"Calculations",
q:"A three-phase star-connected load: R-phase 10A, W-phase 8A, B-phase 6A (all resistive, at 120° apart). Calculate the neutral current using the formula for unbalanced 3-phase loads.",
opts:["I_N = sqrt(I_R² + I_W² + I_B² - I_R·I_W - I_W·I_B - I_B·I_R) = sqrt(100+64+36-80-48-60) = sqrt(12) = 3.46A","I_N = (10+8+6)/3 = 8A per EWRB Teaching Guidelines — this is the correct NZ practice","I_N = 10-6 = 4A (difference between largest and smallest) for registered electricians in NZ","I_N = 0A because the load is star connected in standard electrical practice"],
a:0,exp:"For unbalanced star load (resistive, 120° phase displacement): I_N = sqrt(I_R²+I_W²+I_B²-I_R·I_W-I_W·I_B-I_B·I_R). = sqrt(100+64+36-80-48-60) = sqrt(12) = 3.46A. For balanced loads (all equal): I_N=0. The more unbalanced the load, the larger the neutral current. For purely unbalanced single-phase loads on each phase, neutral carries the vector sum.",calc:true},

{t:"Calculations",
q:"A balanced three-phase star load draws 10A per phase. What is the neutral current?",
opts:["0A — in a balanced 3-phase star load, the three phase currents are equal and 120° apart, cancelling completely in the neutral","10A — the neutral carries the full load current as per Electricity (Safety) Regulations 2010","30A — the neutral carries the sum of all three phase currents as required by AS/NZS 3000","5.77A — the neutral carries 1/√3 of phase current under standard NZ conditions"],
a:0,exp:"In a perfectly balanced 3-phase star load (equal currents, 120° apart): the three phasor currents add to zero. I_N = 0A. This is why balanced 3-phase loads are preferred — the neutral carries no current, saving conductor cost. Any imbalance between phases causes neutral current. Harmonics (especially 3rd order) are additive in the neutral and can cause it to carry more current than phases.",calc:true},

q:"What unique electrical safety hazard do photovoltaic (PV) solar arrays present that is different from other electrical installations?",
opts:["PV arrays cannot be isolated by switching off — they continue generating DC voltage whenever light falls on them, including diffuse daylight and emergency lighting. Working on a PV array is always working on a live system","PV arrays are ELV (<50V) so they present no electrical hazard as per Electricity (Safety) Regulations 2010 as tested and verified on site","PV arrays only generate dangerous voltage in direct sunlight, not on cloudy days as required by AS/NZS 3000 to comply with the regulations","PV arrays automatically de-energise when the AC grid is disconnected under standard NZ conditions in all electrical installations"],
a:0,exp:"PV panels are always generating electricity when light strikes them — they cannot be 'switched off'. Even emergency services lighting, diffuse daylight, or reflected light can maintain dangerous DC voltages (systems can be 600V DC or higher). This means: (1) DC arc faults are harder to extinguish than AC. (2) Rooftop panels expose firefighters and workers to live DC even at night (moonlight, torchlight). AS/NZS 5033 and AS 4777 govern PV installations. Rapid Shutdown systems (in newer standards) can reduce this hazard."},

// ── SWIMMING POOLS ──
{t:"Personal Safety & Isolation",
q:"Under AS/NZS 3000, within what distance of a swimming pool edge is ALL electrical wiring and equipment prohibited (unless specifically permitted)?",
opts:["Within 1.25m horizontally and 2.5m vertically from the water surface — this is the restricted zone where only specially permitted equipment is allowed","Within 0.5m — standard outdoor clearances apply beyond this per EWRB Teaching Guidelines","Within 3m — no electrical equipment of any kind is permitted for registered electricians in NZ","There are no distance restrictions for earthed equipment near pools in standard electrical practice"],
a:0,exp:"AS/NZS 3000 swimming pool zones: the restricted zone extends 1.25m horizontally from the pool edge and 2.5m vertically. In this zone: no switches, socket outlets, or luminaires are permitted (except submersible pool lights rated ELV, SELV, or specially approved). Outside the zone but within 2.5m: RCD protection required for all circuits. Bonding of all metal within and around the pool structure is required (pool shell, metal fittings, ladders)."},
