// ── Player & Leaderboard ──
// -- Shared Leaderboard via JSONBin --
const BIN_URL = 'https://api.jsonbin.io/v3/b/6a2284f3f5f4af5e29bc9a63';
const BIN_KEY = '$2a$10$bo1ZVlWbCGTidHXyez0lyOm0VAke9fezS/NTRAu0lmDqOngFwJa4W';
let lbCache = [];
let lbAll = {};
let currentPlayer = JSON.parse(localStorage.getItem('ewrb_player')||'null');

async function fetchLB(){
  try{
    const r = await fetch(BIN_URL+'/latest', {
      headers:{'X-Master-Key': BIN_KEY, 'X-Bin-Meta': 'false'}
    });
    const data = await r.json();
    // Store all lengths, display current
    lbAll = (data && typeof data === 'object' && !Array.isArray(data) && !data.scores) ? data : {};
    lbCache = lbAll[String(examLen)] || [];
  } catch(e){
    const local = JSON.parse(localStorage.getItem('ewrb_lb_local')||'{}');
    lbAll = local;
    lbCache = local[String(examLen)] || [];
  }
  renderLB();
}

async function pushLB(lb){
  lbAll[String(examLen)] = lb;
  try{
    await fetch(BIN_URL, {
      method: 'PUT',
      headers:{'Content-Type':'application/json','X-Master-Key': BIN_KEY},
      body: JSON.stringify(lbAll)
    });
  } catch(e){
    localStorage.setItem('ewrb_lb_local', JSON.stringify(lbAll));
  }
}

async function saveScore(correct, total, pts){
  if(!currentPlayer) return;
  const pct = Math.round((correct/total)*100);
  await fetchLB();
  const lb = [...(lbAll[String(examLen)]||[])];
  const existing = lb.find(function(e){return e.name===currentPlayer.name;});
  const entry = {name:currentPlayer.name, avatar:currentPlayer.avatar, pct:pct, score:correct, total:total, pts:pts||0};
  if(existing){
    if((pts||0)>existing.pts||(pts===existing.pts&&pct>existing.pct)){
      Object.assign(existing, entry);
    }
  } else {
    lb.push(entry);
  }
  lb.sort(function(a,b){return b.pts!==a.pts?b.pts-a.pts:b.pct-a.pct;});
  lbCache = lb.slice(0,20);
  await pushLB(lbCache);
  renderLB();
}

function renderLB(){
  const lb = lbCache;
  const el = document.getElementById('lb-list');
  if(!el) return;
  const modeEl = document.getElementById('lb-mode');
  if(modeEl) modeEl.textContent = examLen+'Q leaderboard — ranked by points';
  if(!lb||lb.length===0){
    el.innerHTML='<div class="lb-loading">No scores yet — be the first!</div>';
    return;
  }
  const medals = ['🥇','🥈','🥉'];
  el.innerHTML = lb.slice(0,10).map(function(e,i){
    const isYou = currentPlayer && e.name===currentPlayer.name;
    return '<div class="lb-row'+(isYou?' lb-you':'')+'">'+
      '<span class="lb-rank">'+(medals[i]||(i+1))+'</span>'+
      '<span class="lb-av">'+e.avatar+'</span>'+
      '<span class="lb-name">'+e.name+(isYou?' (you)':'')+'</span>'+
      '<span class="lb-score lb-pts">'+(e.pts||0)+' pts</span>'+
      '<span class="lb-pct">'+e.pct+'% · '+e.score+'/'+e.total+'</span>'+
    '</div>';
  }).join('');
}

function toggleHint(btn){
  var box=btn.nextElementSibling;
  var on=box.classList.toggle('on');
  btn.textContent=on?'📔 Hide formula':'📔 Show formula';
}
function toggleFlag(i){
  if(flagged.includes(i))flagged=flagged.filter(x=>x!==i);else flagged.push(i);
  const b=document.getElementById('flgbtn');
  if(b){b.textContent=flagged.includes(i)?'\u2605 Flagged':'\u2606 Flag';
  b.classList.toggle('on',flagged.includes(i));}
}

function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}

function toggle(t,btn){
  if(t==='__all__'){
    selTop.clear();
    selTop.add('__all__');
    document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
  } else {
    selTop.delete('__all__');
    document.querySelector('[data-topic="__all__"]').classList.remove('on');
    if(selTop.has(t)){selTop.delete(t);btn.classList.remove('on');}
    else{selTop.add(t);btn.classList.add('on');}
    if(selTop.size===0){selTop.add('__all__'); document.querySelector('[data-topic="__all__"]').classList.add('on');}
  }
}

function setLen(btn,n){
  examLen=n;
  document.querySelectorAll('.lbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  lbCache = lbAll[String(n)] || [];
  renderLB();
}

function pickAv(btn){
  document.querySelectorAll('.av-btn').forEach(function(b){b.classList.remove('selected');});
  btn.classList.add('selected');
}

// -- Multi-part question system --
function renderMP(q,qIdx){
  var parts=q.parts;
  var h='<div class="mp-container">';
  h+='<div class="mp-title">&#9889; '+q.title+'</div>';
  if(q.diagram) h+='<div class="qdiagram">'+q.diagram+'</div>';
  h+='<div class="mp-score-bar" id="mp-dots-'+qIdx+'">';
  for(var d=0;d<parts.length;d++) h+='<div class="mp-dot" id="mp-dot-'+qIdx+'-'+d+'"></div>';
  h+='<span style="font-size:11px;color:#e8a000;margin-left:6px;font-weight:700" id="mp-bl-'+qIdx+'"></span>';
  h+='</div>';
  for(var pi=0;pi<parts.length;pi++){
    var p=parts[pi];
    var locked=pi>0?' mp-locked':'';
    h+='<div class="mp-part'+locked+'" id="mp-part-'+qIdx+'-'+pi+'">';
    h+='<div class="mp-part-label">Part '+(pi+1)+' of '+parts.length+'</div>';
    h+='<div class="mp-part-q">'+p.q+'</div>';
    h+='<div class="mp-opts">';
    var order=shuffle([0,1,2,3]);
    var cn=order.indexOf(p.a);
    order.forEach(function(oi,ni){
      h+='<button class="mp-opt" id="mp-opt-'+qIdx+'-'+pi+'-'+ni+'"';
      h+=' onclick="answerMP('+qIdx+','+pi+','+ni+','+cn+')">'+String.fromCharCode(65+ni)+'.  '+p.opts[oi]+'</button>';
    });
    h+='</div>';
    h+='<div class="mp-exp" id="mp-exp-'+qIdx+'-'+pi+'">&#128161; '+p.exp+'</div>';
    h+='</div>';
  }
  h+='</div>';
  return h;
}

var mpState={};

function answerMP(qIdx,partIdx,chosen,cn){
  var q=examQs[qIdx];
  var parts=q.parts;
  var key=qIdx+'-'+partIdx;
  if(mpState[key]) return;
  mpState[key]=true;
  var ok=chosen===cn;
  document.querySelectorAll('[id^="mp-opt-'+qIdx+'-'+partIdx+'-"]').forEach(function(b){b.disabled=true;b.onclick=null;});
  var cb=document.getElementById('mp-opt-'+qIdx+'-'+partIdx+'-'+chosen);
  var rb=document.getElementById('mp-opt-'+qIdx+'-'+partIdx+'-'+cn);
  if(cb) cb.classList.add(ok?'mp-ok':'mp-bad');
  if(!ok&&rb) rb.classList.add('mp-show');
  var exp=document.getElementById('mp-exp-'+qIdx+'-'+partIdx);
  if(exp) exp.classList.add('on');
  var dot=document.getElementById('mp-dot-'+qIdx+'-'+partIdx);
  if(dot) dot.classList.add(ok?'got':'wrong');
  if(!q._r) q._r=[];
  q._r[partIdx]=ok;
  var pts=calcPoints(true,false,Date.now()-qStartTime);
  if(ok){score++;sessionPoints+=pts;if(tStats[q.t])tStats[q.t].c++;}
  else{if(tStats[q.t])tStats[q.t].w++;}
  answers.push({q:q,ok:ok,pts:ok?pts:0,timeTaken:Date.now()-qStartTime});
  var ql=document.getElementById('qlive');
  if(ql) ql.textContent='Score: '+score+'/'+answers.length+' · '+sessionPoints+'pts';
  qStartTime=Date.now();
  var next=partIdx+1;
  if(next<parts.length){
    setTimeout(function(){
      var el=document.getElementById('mp-part-'+qIdx+'-'+next);
      if(el){el.classList.remove('mp-locked');el.scrollIntoView({behavior:'smooth',block:'nearest'});}
    },500);
  } else {
    var allOk=q._r&&q._r.length===parts.length&&q._r.every(function(r){return r;});
    if(allOk){
      var bonus=parts.length*15;
      sessionPoints+=bonus;
      var bl=document.getElementById('mp-bl-'+qIdx);
      if(bl) bl.textContent='&#127775; Perfect! +'+bonus+' bonus pts';
    }
    var isLast=qIdx===examQs.length-1;
    setTimeout(function(){
      var nb=document.getElementById('nbtn');var fb=document.getElementById('fbtn');
      if(isLast){if(fb){fb.style.display='inline-block';fb.onclick=showResults;}}
      else{if(nb){nb.style.display='inline-block';nb.onclick=nextQ;}}
    },700);
  }
}

function init(){
  show('s-home');
  showPlayerInfo();
  fetchLB();
  const grid=document.getElementById('topic-grid');
  const ab=document.createElement('button');
  ab.className='tbtn on'; ab.dataset.topic='__all__';
  ab.innerHTML='<div class="tlabel">All topics</div><div class="tcount">'+QS.length+' questions</div>';
  ab.onclick=function(){toggle('__all__',ab);};
  grid.appendChild(ab);
  ALL_TOPICS.forEach(function(t){
    const qs=QS.filter(function(q){return q.t===t;});
    const nc=qs.filter(function(q){return q.calc;}).length;
    const effQs=qs.reduce(function(n,q){return n+(q.parts?q.parts.length:1);},0);
    const b=document.createElement('button');
    b.className='tbtn'; b.dataset.topic=t;
    b.innerHTML='<div class="tlabel">'+t+'</div><div class="tcount">'+effQs+' Qs'+(nc?' ('+nc+' 🔢)':'')+'</div>';
    b.onclick=function(){toggle(t,b);};
    grid.appendChild(b);
  });
}

init();
