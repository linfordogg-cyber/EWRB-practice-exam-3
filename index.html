// ══ NEW QUESTIONS — additional exam coverage ══

// ── CABLE SIZING REAL EXAM STYLE ──
{t:"Cables & Switchboards",q:"An electrician is installing a 230V single-phase circuit to supply a 4kW water heater. The cable run is 25m each way, enclosed in conduit. The diversity factor is 1.0. Calculate the minimum cable CSA needed if voltage drop must not exceed 5%.",opts:["2.5mm² — at 4kW/230V the load current is 17.4A, the 5% voltage drop limit is 11.5V, and 2.5mm² TPS at 25m each way gives a drop within limits","1.5mm² — this is sufficient for any domestic water heater circuit in standard NZ practice","4mm² — always required for water heaters regardless of current per AS/NZS 3000","6mm² — to allow for future load increases on the circuit under normal operating conditions"],a:0,exp:"IL = P/V = 4000/230 = 17.4A. Max V_drop = 5% × 230 = 11.5V. R_cable = V_drop/I = 11.5/17.4 = 0.66Ω for loop (50m). R per metre = 0.66/50 = 0.0132Ω/m. 2.5mm² Cu = 0.0073Ω/m (one-way) × 2 = 0.0146Ω/m loop ≈ 0.73Ω → drop = 17.4×0.73 = 12.7V — borderline. In practice 4mm² would be selected.",calc:true},

{t:"Cables & Switchboards",q:"Why must the neutral conductor in a TPS cable be the same CSA as the phase conductor for circuits up to 16mm²?",opts:["The neutral may carry the full load current — on a single-phase circuit it carries the same current as the phase, and on unbalanced 3-phase it may carry significant current","The neutral is always smaller than the phase conductor to save cost as required by regulations in standard NZ electrical practice","The neutral only carries current during fault conditions for all LV installations as required by AS/NZS 3000","The neutral size is determined by the fuse rating, not the load current per EWRB requirements under the Electricity (Safety) Regulations 2010"],a:0,exp:"On single-phase circuits: neutral current = phase current. On unbalanced 3-phase circuits: the neutral carries the difference between phase currents. AS/NZS 3000 requires neutral CSA ≥ phase CSA for conductors up to 16mm² to handle these currents safely without overheating."},

// ── ADDITIONAL PROTECTION QUESTIONS ──
{t:"Electrical Protection",q:"An MCB is described as 'Type B 32A'. What does 'Type B' mean?",opts:["The MCB trips instantaneously when current reaches 3–5 times the rated current — suitable for resistive loads like heaters and lighting with low inrush current","Type B means it trips at 2× rated current instantaneously in standard NZ practice per EWRB requirements","Type B is rated for use in bathrooms only per AS/NZS 3000 for all registered electricians in NZ","Type B has a time delay before tripping at any current level under normal operating conditions under normal operating conditions"],a:0,exp:"MCB trip characteristics: Type B = instantaneous trip at 3–5× In (for resistive loads, lighting). Type C = instantaneous trip at 5–10× In (for motors, transformers with moderate inrush). Type D = instantaneous trip at 10–20× In (for heavy inductive loads, large transformers). Type B is the most common for domestic wiring."},

{t:"Electrical Protection",q:"What is the difference between 'overload' protection and 'short-circuit' protection?",opts:["Overload: sustained current slightly above rated value (1.1–6× In) — slow to develop, thermal device adequate. Short-circuit: sudden massive current (10–100× In) — must clear in milliseconds, requires HRC fuse or MCB magnetic trip","They are the same thing — both cause the protective device to operate as required by regulations in standard NZ electrical practice","Overload is for AC circuits only; short-circuit protection is for DC circuits for all LV installations as required by AS/NZS 3000","Short-circuit protection is only required on circuits above 32A per EWRB requirements under the Electricity (Safety) Regulations 2010"],a:0,exp:"Overload: current exceeds rated value but not by large factor — caused by too many loads on a circuit. Heat builds slowly. Thermal devices (bimetal strip in MCB, thermal overload relay) provide this protection. Short-circuit: near-zero impedance fault causes enormous current instantly — arc flash hazard. Magnetic trip in MCB or HRC fuse provides instantaneous clearance."},

// ── ADDITIONAL NZ SUPPLY ──
{t:"NZ Supply & MEN",q:"What is the purpose of the main earthing conductor connecting the main earth bar to the earth electrode?",opts:["To provide a continuous low-impedance metallic path from the installation earthing system to the mass of earth — ensuring fault currents have a reliable return path and establishing the earth reference potential","To carry the neutral return current back to the supply transformer in standard NZ practice per EWRB requirements","To provide a second neutral path in case the main neutral fails per AS/NZS 3000 for all registered electricians in NZ","To protect the main switchboard from lightning strikes under normal operating conditions under normal operating conditions"],a:0,exp:"The main earthing conductor (earth electrode conductor): connects the main earth bar at the switchboard to the earth electrode(s) buried in the ground. Its purpose: (1) Establishes the earth reference (earth potential) for the entire installation. (2) Provides fault current return path via the mass of earth. (3) Part of the MEN system — it is the physical link between the installation and earth potential. Minimum size: 6mm² Cu for most domestic installations."},

// ── ADDITIONAL MOTORS ──
{t:"Motors & Starters",q:"A 3-phase induction motor takes 5 seconds to accelerate from standstill to full speed on DOL starting. During this period, what current is approximately flowing?",opts:["6–8 times full-load current (FLC) — the locked-rotor current as back-EMF builds from zero to full value during acceleration","Full-load current only — the motor draws rated current throughout starting","2 times full-load current — the star-delta starting reduces it","The starting current starts at zero and gradually rises to FLC"],a:0,exp:"During DOL starting: initially the rotor is stationary, back-EMF = 0, so the motor draws locked-rotor current (LRC) = 6–8× FLC. As the motor accelerates and back-EMF builds, current decreases. By full speed, current is at FLC. This high starting current causes voltage dips on the supply and is why star-delta/auto-transformer starters are used for large motors."},

{t:"Motors & Starters",q:"State the purpose of the overload heater elements in a thermal overload relay.",opts:["They carry the motor current and heat up proportionally — if the motor is overloaded for too long the heaters trip the relay contacts, disconnecting the motor before winding insulation is damaged","They provide heating for the motor windings during cold start conditions as required by regulations in standard NZ electrical practice","They are resistors that reduce the starting current of the motor for all LV installations as required by AS/NZS 3000","They are fuses that blow when the motor overloads per EWRB requirements under the Electricity (Safety) Regulations 2010"],a:0,exp:"Thermal overload relay: the heater elements carry the motor current (via CTs or directly). The heat produced is proportional to I²R. If overload current persists, the heaters warm a bimetallic strip which deflects, eventually tripping the NC contact in the control circuit — dropping out the main contactor. The relay has a manual or automatic reset. The inverse time characteristic means small overloads take longer to trip than large ones."},

// ── ADDITIONAL TESTING ──
{t:"Testing & Inspection",q:"During polarity testing of a new installation, what fault is being checked for?",opts:["That all single-pole switches and protective devices are in the phase conductor and not the neutral — an incorrectly wired switch in the neutral leaves the load permanently live even when switched off","That the supply voltage is within tolerance (±6% of 230V) in standard NZ practice per EWRB requirements","That the RCD trips within 300ms at rated current per AS/NZS 3000 for all registered electricians in NZ","That the earth continuity resistance is below 1Ω under normal operating conditions under normal operating conditions"],a:0,exp:"Polarity test: verifies that all single-pole devices (switches, fuses, MCBs) are in the PHASE conductor — not the neutral. A switch wired in the neutral breaks the neutral but leaves the load at phase voltage — dangerous shock hazard when working on 'switched off' equipment. Test: with supply off, check phase is connected to the correct terminals of all single-pole devices."},

{t:"Testing & Inspection",q:"What is the minimum insulation resistance value acceptable for a newly installed LV circuit before connecting to the supply (no equipment connected)?",opts:["Minimum 1MΩ measured at 500V DC between all live conductors and earth","Minimum 0.5MΩ at 250V DC as required by regulations","Minimum 10MΩ — new wiring should have very high IR","Minimum 100kΩ is sufficient for a new circuit"],a:0,exp:"AS/NZS 3000 Section 8: minimum IR for a new installation = 1MΩ, tested at 500V DC. This is the minimum — new wiring typically reads 100MΩ+ (effectively infinite on good Megger). The 1MΩ minimum is the acceptance threshold. Below 1MΩ indicates damaged insulation, contamination, or incorrect wiring. With MIMS elements connected: 0.01MΩ (10kΩ) minimum."},

// ── ADDITIONAL HEALTH & SAFETY ──
{t:"Health & Safety (HSWA 2015)",q:"An electrician is working in a roof space on a hot day. The temperature reaches 45°C. Under HSWA, what hazard does this create and what controls apply?",opts:["Heat stress — a significant health hazard. Controls: monitor for symptoms (dizziness, nausea, confusion), take regular breaks in cool areas, drink water frequently, work during cooler","Heat is not a health hazard for electricians — only electrical hazards are relevant for all LV installations in standard NZ electrical practice","Working in heat requires a WorkSafe permit to work only per EWRB requirements as required by AS/NZS 3000","Heat only becomes a hazard above 60°C — 45°C requires no special controls in standard NZ practice under the Electricity (Safety) Regulations 2010"],a:0,exp:"Heat stress under HSWA: excessive heat is a recognised workplace hazard. PCBU must manage it 'so far as is reasonably practicable.' Controls (hierarchy): engineering (ventilation, scheduling work in cool periods), administrative (buddy system, regular breaks, hydration, acclimatisation), PPE (cooling vests). Symptoms requiring immediate rest: dizziness, confusion, cessation of sweating, nausea. Roof spaces in NZ summer can reach 60°C+."},

{t:"Health & Safety (HSWA 2015)",q:"What does a 'Permit to Work' (PTW) system provide and when is it used for electrical work?",opts:["A formal documented authorisation that specific hazardous work may proceed — used for live electrical work, confined space entry, work near overhead lines, and","A permit issued by WorkSafe for any electrical work above 230V per AS/NZS 3000 per EWRB requirements","A certificate issued by the EWRB for each job performed under normal operating conditions for all registered electricians in NZ","A document replacing the need for Danger Tags on isolated equipment as required by regulations under normal operating conditions"],a:0,exp:"Permit to Work: a formal written system where a designated authorising person confirms that: (1) hazards have been identified, (2) controls are in place, (3) the work can safely proceed. Used for: live electrical work, confined spaces, work near overhead lines, work on HV systems. The PTW does NOT replace Danger Tags — both are required. It creates a formal record of hazard assessment and control sign-off."},

// ── ADDITIONAL REGULATIONS ──
{t:"Electricity Act & Regulations NZ",q:"What is the maximum time allowed between completing prescribed electrical work and providing the Certificate of Compliance and Electrical Safety Certificate to the contracting person?",opts:["20 working days from when the work is connected to the power supply","30 calendar days from completion of the work","7 working days — always for all LV installations","5 working days for commercial work, 20 for domestic"],a:0,exp:"Electricity (Safety) Regulations 2010, Regulations 65 and 74A: both the CoC and ESC must be provided to the contracting person as soon as practicable, and in any case no later than 20 WORKING DAYS after the work is connected to the power supply. Note: 'working days' excludes weekends and public holidays. Failure to provide within 20 working days is a disciplinary offence."},

{t:"Electricity Act & Regulations NZ",q:"Under the Electricity (Safety) Regulations 2010, who is responsible for issuing the Electrical Safety Certificate for prescribed electrical work?",opts:["The registered electrical worker who carried out or supervised the work — they certify it has been tested and is electrically safe","The supply authority, after their inspector approves the work per EWRB requirements","The EWRB, after receiving the Certificate of Compliance in standard NZ practice","The homeowner or building owner, after accepting the work per AS/NZS 3000"],a:0,exp:"The ESC must be issued by the REGISTERED ELECTRICAL WORKER who carried out the work (or the supervising registered electrician if a trainee did the work). By signing the ESC, the registered electrician certifies that: the work has been tested, it is electrically safe, and it will not adversely affect other parts of the installation. No one else can issue an ESC."},

// ── SCENARIO NEW ──
{t:"Scenarios",q:"SCENARIO: You arrive on a job to install a new circuit. You notice the existing main switchboard has a main switch that is cracked and appears to have been subject to a fault. The homeowner says 'it still works fine.' What must you do?",opts:["Advise the homeowner in writing that the switchboard has a defect that must be repaired — you must not knowingly connect new work to unsafe equipment. Document your advice and do not proceed until the defect is rectified","Proceed with the installation — the switchboard is the homeowner's responsibility under normal operating conditions in standard NZ electrical practice","Install the new circuit and note the cracked switch in your job notes as required by regulations as required by AS/NZS 3000","Only report the defect if the homeowner specifically asks you to check the board for all LV installations under the Electricity (Safety) Regulations 2010"],a:0,exp:"An electrician who knowingly connects new work to unsafe existing equipment may be liable. Under the Electricity (Safety) Regulations and HSWA: (1) Advise the homeowner in writing of the defect. (2) Do not connect new work to the unsafe switchboard. (3) Recommend immediate repair/replacement by a registered electrician. (4) Keep a record of the advice given. If the homeowner refuses, the electrician should not proceed with the new work."},

{t:"Scenarios",q:"SCENARIO: While testing a 230V final subcircuit, your earth fault loop impedance tester reads 'OL' (overload/infinite). What does this indicate and what action should you take?",opts:["The earth fault loop is OPEN — there is no complete earth return path. Check earth continuity of the circuit — likely a broken or missing earth conductor, poor connection, or failed earth bond. Do not energise until repaired","The circuit has too many loads — reduce the number of outlets and retest per EWRB requirements per EWRB requirements","The test instrument battery is flat — replace and retest in standard NZ practice for all registered electricians in NZ","The supply voltage is too low for the test — wait for normal supply conditions per AS/NZS 3000 under normal operating conditions"],a:0,exp:"'OL' on a loop impedance tester = infinite or unmeasurably high impedance = the loop is OPEN. This means: there is no complete earth fault path from the phase conductor at the test point, through a fault, back via the earthing system to the transformer. Causes: open earth conductor, missing MEN link, failed earth connection, disconnected earth electrode. The circuit MUST NOT be used until the fault is found and repaired — a phase-to-earth fault would leave equipment live with no fault current to operate protection."},

// ══ VERY HARD QUESTIONS — Advanced competency from EWRB Teaching Guidelines ══
// All marked hard:true — base 20pts, up to 60-80pts with speed multiplier

// ── ADVANCED TRANSFORMER CALCULATIONS ──
{t:"Transformers",
q:"A 3-phase delta-star transformer: 11kV primary (delta), turns ratio 47.83:1, rated 250kVA. Under full load the secondary terminal voltage drops from 415V to 398V. Calculate: (a) percentage voltage regulation, (b) full-load secondary line current, (c) full-load primary line current.",
opts:["(a) 4.1%, (b) 347.9A, (c) 7.28A — regulation=(415-398)/415×100; IL_sec=250000/(√3×398); IL_pri=IL_sec/47.83×(1/√3)","(a) 4.1%, (b) 361A, (c) 13.1A — these are the no-load values only","(a) 8.2%, (b) 174A, (c) 3.64A — half-values due to delta primary","(a) 2.0%, (b) 695A, (c) 14.5A — these use incorrect voltage base"],
a:0,exp:"(a) %Reg=(V_NL-V_FL)/V_NL×100=(415-398)/415×100=4.1%. (b) IL_sec=kVA/(√3×V_FL)=250000/(1.732×398)=250000/689.3=362.7A≈347.9A. (c) IL_pri=kVA/(√3×V_pri)=250000/(1.732×11000)=250000/19052=13.1A. Primary is delta: Iph_pri=IL_pri/√3=13.1/1.732=7.56A.",calc:true,hard:true},

{t:"Transformers",
q:"Two single-phase transformers are to be connected in parallel: Transformer A: 100kVA, 11000/230V, %Z=4%. Transformer B: 50kVA, 11000/230V, %Z=5%. If the combined load is 120kVA at unity pf, calculate the load shared by each transformer and state whether either unit is overloaded.",
opts:["TA shares 80kVA, TB shares 40kVA — load divides inversely proportional to %Z×kVA. TA: 80/100=80% loaded (OK). TB: 40/50=80% loaded (OK)","TA shares 60kVA, TB shares 60kVA — equal sharing regardless of rating — this is the correct approach","TA shares 96kVA, TB shares 24kVA — TA takes 80% of all loads under NZ electrical standards","TA shares 100kVA, TB shares 20kVA — limited by transformer A rating per AS/NZS 3000 requirements"],
a:0,exp:"Load sharing in parallel transformers is inversely proportional to per-unit impedance. TA per-unit Z = 0.04/100kVA = 0.0004. TB per-unit Z = 0.05/50kVA = 0.001. TA share = 120 × (0.001/(0.0004+0.001)) = 120×0.714 = 85.7kVA. TB share = 120×0.286 = 34.3kVA. TA: 85.7/100=85.7% (OK). TB: 34.3/50=68.6% (OK). Neither overloaded.",calc:true,hard:true},

// ── ADVANCED PROTECTION — DISCRIMINATION ──
{t:"Electrical Protection",
q:"A distribution system has: Main fuse 200A HRC (I²t let-through = 5×10⁶ A²s), Sub-main fuse 100A HRC (pre-arcing I²t = 8×10⁵ A²s), Final circuit MCB 32A Type C. At a fault level of 3kA, explain whether full discrimination is achieved between all three devices.",
opts:["Full discrimination exists if the let-through I²t of each downstream device is less than the pre-arcing I²t of the upstream device. At 3kA: 32A MCB let-through I²t < 100A fuse pre-arcing I²t ✓. 100A fuse total I²t < 200A fuse pre-arcing I²t — must be verified from manufacturer curves","Discrimination is always achieved when fuse ratings are in a 2:1 ratio as required by the EWRB — verify from manufacturer data sheets — this method does not comply with NZ regulations — this approach gives an incorrect result","Discrimination only matters on circuits above 100A for all registered electricians — this is not standard NZ practice — not applicable under AS/NZS 3000 — this calculation uses the wrong formula","Type C MCBs always discriminate with HRC fuses at any fault level in standard NZ practice — this approach does not comply — this does not meet the required standard — this is not permitted under the Electricity Act"],
a:0,exp:"Discrimination (selectivity) requires that at maximum fault current, the let-through energy (I²t) of the downstream device does not exceed the pre-arcing I²t of the upstream device. If it does, both devices operate simultaneously — loss of selectivity. At 3kA: check 32A MCB let-through I²t vs 100A fuse pre-arcing I²t from manufacturer curves. Rule: downstream I²t < upstream pre-arcing I²t at all fault levels up to the prospective short-circuit current.",hard:true},

{t:"Electrical Protection",
q:"A 400V 3-phase installation has a measured PSCC of 8kA at the main switchboard. The supply cable to a sub-board is 50m of 16mm² copper. Calculate the PSCC at the sub-board and determine the minimum required rupturing capacity of the sub-board's protective devices.",
opts:["Zs_cable = 2×50×0.00115 = 0.115Ω (loop). Z_total = V/PSCC_main + Z_cable = 0.029+0.115 = 0.144Ω. PSCC_sub = 230/0.144 = 1597A ≈ 1.6kA. Minimum rupturing capacity = 1.6kA","PSCC at sub-board equals PSCC at main board — cable impedance has no effect — this is the correct approach — this calculation is incorrect","PSCC = 8kA/50 = 160A — divides by cable length under NZ electrical standards — not applicable in this scenario","PSCC = 8kA × 16mm² = 128kA — increases with cable CSA per AS/NZS 3000 requirements — this does not meet AS/NZS 3000"],
a:0,exp:"Z at main = V/PSCC = 230/8000 = 0.029Ω. Cable loop resistance (16mm² Cu, 2 conductors): R = ρ×L/A×2 = 0.00115Ω/m×50×2 = 0.115Ω. Z_total = 0.029+0.115 = 0.144Ω. PSCC_sub = 230/0.144 = 1597A. All devices at sub-board must have rupturing capacity ≥ 1.6kA. In practice select next standard value ≥ 1.6kA.",calc:true,hard:true},

// ── ADVANCED MOTOR — VSD AND STARTING ──
{t:"Motors & Starters",
q:"A 400V 3-phase induction motor: FLC=45A, LRC=6.5×FLC, efficiency=91%, pf=0.86, star-delta starter used. During the star-to-delta transition, explain the electrical event that occurs and how the star-delta transition relay minimises it.",
opts:["At transition, the motor is momentarily disconnected from supply. The rotor continues spinning but motor EMF decays. If reconnected in delta before EMF decays, a high transient current spike occurs as the decaying motor EMF is out of phase with supply. The transition timer must allow sufficient time (typically 50-100ms) for the motor EMF to decay before delta contactors close","No electrical event occurs — star-delta transition is seamless with no current spike as required by the EWRB — verify from manufacturer data sheets — this would fail the commissioning test — incorrect application of Ohm's Law here","The star contactor and delta contactor are interlocked so they can never both close simultaneously — preventing any transient for all registered electricians — this is not standard NZ practice — this method does not comply with NZ regulations — this approach gives an incorrect result","The transition spike only occurs if the timer is set too long — shorter timer prevents it in standard NZ practice — this approach does not comply — not applicable under AS/NZS 3000 — this calculation uses the wrong formula"],
a:0,exp:"Star-delta transition transient: when star contactor opens, the motor is isolated but still spinning — it acts as a generator with its own EMF. If delta contactor closes before this EMF decays and phase-aligns with supply, a current transient can occur (potentially exceeding LRC). The transition relay delay (50-100ms typical) allows rotor EMF to decay to safe level. Some advanced starters use a closed transition (resistor bridge) to eliminate the transient entirely.",hard:true},

{t:"Motors & Starters",
q:"A Variable Speed Drive (VSD) is installed on a 400V 3-phase 22kW pump motor. The pump engineer specifies 'square law' torque-speed characteristic. At 50% speed, what percentage of full-speed power does the pump consume, and what is the significance for energy saving?",
opts:["At 50% speed: power = (0.5)³ × full power = 12.5% of full power. A centrifugal pump/fan following square law torque consumes power proportional to speed cubed. Running at 50% speed saves 87.5% of energy vs running at full speed with a throttle valve","At 50% speed: power = 50% of full power — linear relationship — this is the correct approach — this calculation is incorrect — this does not meet the required standard","At 50% speed: power = (0.5)² = 25% of full power — square relationship under NZ electrical standards — not applicable in this scenario — this is not permitted under the Electricity Act","At 50% speed: power = same as full speed — pumps always consume rated power per AS/NZS 3000 requirements — this does not meet AS/NZS 3000 — this would fail the commissioning test"],
a:0,exp:"Centrifugal pumps/fans follow the affinity laws: Torque ∝ N², Power ∝ N³. At 50% speed: P = (0.5)³ × P_full = 0.125 × P_full = 12.5%. For a 22kW motor: P at 50% speed = 2.75kW vs 22kW at full speed. This is why VSDs are so effective on pumps — halving speed uses only 12.5% of full-speed power. Compare with throttle valve (wastes energy as pressure drop).",calc:true,hard:true},

// ── ADVANCED EARTHING CALCULATIONS ──
{t:"NZ Supply & MEN",
q:"A substation earth grid is designed for a fault current of 5kA for 0.5 seconds. The soil resistivity is 100Ω·m. Calculate the step voltage at 1 metre from the earth electrode during the fault, and state whether it is within the safe limit of 116V for 0.5s.",
opts:["Step voltage = ρ×If/(2π) × (1/r₁ - 1/r₂) = 100×5000/(2π) × (1/1 - 1/2) = 79,577 × 0.5 = 39,789V — far exceeds 116V safe limit. Earth grid required to reduce gradient","Step voltage = 5000 × 0.023 = 115V — just within the 116V limit as required by the EWRB","Step voltage = 100/5000 = 0.02V — well within safe limits for all registered electricians","Step voltage cannot be calculated without knowing electrode dimensions in standard NZ practice"],
a:0,exp:"Step voltage (1m step, 1m from electrode): Vs = ρ×I/(2π) × (1/r₁ - 1/r₂) = 100×5000/(6.283) × (1/1 - 1/2) = 79,577 × 0.5 = 39,789V. This massively exceeds the safe limit of 116V for 0.5s contact. This is why substations require extensive earth grids, equipotential matting, and concrete paving — to reduce the surface voltage gradient to safe levels.",calc:true,hard:true},

// ── ADVANCED REGULATIONS ──
{t:"Electricity Act & Regulations NZ",
q:"An electrician discovers that prescribed electrical work they completed 6 months ago has a defect that could cause serious harm. They did not notice it at the time of testing. Under the Electricity Act 1992 and HSWA 2015, what are their obligations?",
opts:["Under HSWA: must take all practicable steps to eliminate/minimise the risk immediately — notify the owner/occupier, arrange repair, and consider whether WorkSafe notification is required. Under the Electricity Act: the original ESC may have been incorrectly issued — EWRB notification may be required if the defect indicates the testing was inadequate","No obligation — the work was certified at the time and the electrician has no further liability — this is the correct approach — verify from manufacturer data sheets — incorrect application of Ohm's Law here — this method does not comply with NZ regulations","Only notify if someone has been injured — no proactive duty to report discovered defects under NZ electrical standards — this is not standard NZ practice — this approach gives an incorrect result — not applicable under AS/NZS 3000","File a new ESC covering the defect — no further action required per AS/NZS 3000 requirements — this approach does not comply — this calculation uses the wrong formula — this does not meet the required standard"],
a:0,exp:"Dual obligations: (1) HSWA Section 36-38 (PCBU duty): must manage the risk 'so far as reasonably practicable' — notify the owner, arrange repair urgently. If the risk is serious and imminent, may need to advise de-energisation. (2) Electricity Act/Regulations: if the original testing was inadequate, the ESC was potentially incorrectly issued — a disciplinary matter under Section 143. If a notifiable event (serious risk to health/safety existed), WorkSafe may need notification.",hard:true},

{t:"Electricity Act & Regulations NZ",
q:"A building owner wants to install their own electrical switchboard in their building. They are not a registered electrical worker. Under the Electricity (Safety) Regulations 2010, can they legally perform this work, and if not, what are the consequences?",

// ── ADVANCED AC THEORY ──
{t:"AC Theory & Waveforms",
q:"A 230V 50Hz single-phase circuit has: R=8Ω, L=25.5mH, C=199μF all in series. Calculate: (a) XL, (b) XC, (c) Z, (d) current, (e) power factor, and state whether the circuit is inductive or capacitive.",
opts:["XL=8Ω, XC=16Ω, net X=8Ω capacitive, Z=√(8²+8²)=11.31Ω, I=230/11.31=20.3A, pf=R/Z=8/11.31=0.707 leading (capacitive)","XL=8Ω, XC=8Ω, Z=8Ω (resonance), I=28.75A, pf=1.0 — this is the correct approach","XL=16Ω, XC=8Ω, Z=11.31Ω, I=20.3A, pf=0.707 lagging (inductive) under NZ electrical standards","XL=8Ω, XC=16Ω, Z=16Ω, I=14.4A, pf=0.5 leading per AS/NZS 3000 requirements"],
a:0,exp:"XL=2πfL=2π×50×0.0255=8Ω. XC=1/(2πfC)=1/(2π×50×0.000199)=16Ω. Net X=XL-XC=8-16=-8Ω (capacitive, since XC>XL). Z=√(R²+X²)=√(64+64)=√128=11.31Ω. I=V/Z=230/11.31=20.34A. pf=R/Z=8/11.31=0.707 leading (capacitive circuit since XC>XL).",calc:true,hard:true},

{t:"AC Theory & Waveforms",
q:"Explain why a 3-phase system with heavy non-linear single-phase loads (computers, LED drivers) can have a neutral current GREATER than any of the three phase currents, and calculate the neutral current if each phase carries a fundamental of 20A plus a 3rd harmonic of 15A.",
opts:["Fundamental currents cancel in neutral (balanced). 3rd harmonics are all in phase — they ADD in neutral. Neutral 3rd harmonic = 3×15A = 45A. Fundamental contribution to neutral ≈ 0 (balanced). Total neutral ≈ 45A > 20A phase fundamental — exceeds phase current","Neutral current = average of three phase currents = 20A as required by the EWRB — verify from manufacturer data sheets — this calculation uses the wrong formula — this does not meet the required standard","Neutral current = zero because the system is three-phase for all registered electricians — this is not standard NZ practice — this is not permitted under the Electricity Act","Neutral carries 3rd harmonic only when circuits are unbalanced in standard NZ practice — this approach does not comply — this would fail the commissioning test — incorrect application of Ohm's Law here"],
a:0,exp:"In balanced 3-phase: fundamental (and 5th, 7th harmonics) cancel in neutral. BUT triple-order harmonics (3rd, 6th, 9th) are in phase in all three phases — they do NOT cancel, they ADD. Neutral 3rd harmonic = 3 × 15A = 45A. Fundamental neutral ≈ 0 (balanced). Neutral current ≈ 45A while phase fundamental = 20A. This is why heavily loaded computer room neutrals must be oversized — typically 1.73× phase conductor CSA.",calc:true,hard:true},

// ── ADVANCED TESTING ──
{t:"Testing & Inspection",
q:"During commissioning of a new 3-phase 400V installation, the earth fault loop impedance at the furthest point of a 32A final subcircuit measures 0.87Ω. A Type B MCB protects the circuit. Calculate the fault current, verify disconnection time meets AS/NZS 3000, and state the maximum Zs permitted for this circuit.",
opts:["IF=230/0.87=264A. Type B 32A MCB requires 5×32=160A for instantaneous trip. 264A>160A so MCB trips instantaneously (<<0.4s) ✓. Max Zs for 32A Type B = 230/(5×32) = 1.44Ω. Actual 0.87Ω < 1.44Ω ✓ — PASS","IF=400/0.87=460A — use line voltage for calculation — this is the correct approach — this calculation is incorrect","IF=264A but Type B requires 10× so 320A — FAIL under NZ electrical standards — not applicable in this scenario","Max Zs = 0.87Ω — the measured value is always the maximum per AS/NZS 3000 requirements — this does not meet AS/NZS 3000"],
a:0,exp:"IF=V/Zs=230/0.87=264A. Type B MCB: instantaneous trip at 5×In=5×32=160A. Since 264A>160A, MCB trips instantaneously — disconnection time <0.01s, well within 0.4s AS/NZS 3000 requirement. Maximum permitted Zs: Zs_max = V/(5×In) = 230/160 = 1.44Ω. Actual 0.87Ω < 1.44Ω — satisfactory. Always use 230V (phase-to-neutral) for loop impedance calculations.",calc:true,hard:true},

// ── ADVANCED SCENARIO — COMPLEX FAULT FINDING ──
{t:"Scenarios",
q:"SCENARIO: A 400V 3-phase DOL motor (22kW, FLC=42A) repeatedly trips the 50A thermal overload relay after 8-12 minutes of running. The motor runs normally and is not mechanically overloaded. IR test: 80MΩ (good). Supply voltages measured: R=402V, W=398V, B=241V. What is the fault and what action is required?",
opts:["B phase has severely reduced voltage (241V vs expected ~400V) — likely a blown HV fuse on the B phase at the supply transformer, or a high-resistance connection on B phase. This causes the motor to run effectively single-phased or with severe voltage unbalance — B phase winding","The thermal overload is set too low — increase to 60A setting — this is the correct approach — this approach does not comply — this method does not comply with NZ regulations — this approach gives an incorrect result","The motor's insulation is degrading — the 80MΩ IR is below minimum under NZ electrical standards — this calculation is incorrect — not applicable under AS/NZS 3000 — this calculation uses the wrong formula","The motor bearings are worn — causing mechanical overload despite good IR per AS/NZS 3000 requirements — not applicable in this scenario — this does not meet the required standard — this is not permitted under the Electricity Act"],
a:0,exp:"B phase = 241V vs 402/398V on other phases — severe voltage unbalance. A 3-phase motor with unbalanced supply: the phase with low voltage draws higher current to maintain torque; the other phases also experience increased current. Even a 5% voltage unbalance can cause 25%+ current increase in one winding. 241V on B phase (60% of normal) = dangerous unbalance. Cause: blown upstream fuse, poor connection, or HV supply fault on B phase. Critical: do not restart until supply is corrected.",hard:true},

// ══ ATOMIC STRUCTURE & ELECTRICAL THEORY ══

// ── Atomic structure basics ──
{t:"Electrical Theory — Atomic",
q:"An atom consists of a nucleus containing protons and neutrons, surrounded by electrons in shells. What is the electrical charge of a proton, neutron, and electron respectively?",
opts:["Proton: positive (+), Neutron: neutral (no charge), Electron: negative (−)","Proton: negative, Neutron: positive, Electron: neutral","Proton: neutral, Neutron: positive, Electron: negative","Proton: positive, Neutron: positive, Electron: neutral"],
a:0,exp:"Proton: positive charge (+1). Neutron: no charge (neutral). Electron: negative charge (−1). In a neutral atom the number of protons equals the number of electrons — charges balance. Electric current is the flow of electrons (negative charges) through a conductor."},

{t:"Electrical Theory — Atomic",
q:"What is the 'valence shell' of an atom and why is it significant in electrical theory?",
opts:["The outermost electron shell of an atom — its electrons are most loosely bound and determine whether the material conducts electricity, insulates, or semiconducts","The innermost shell closest to the nucleus — tightly bound electrons that carry current — this is incorrect atomic theory","The middle shell that balances positive and negative charges — this does not reflect electron behaviour","The shell that holds neutrons and determines atomic mass — this misrepresents the valence shell"],
a:0,exp:"The valence shell is the outermost electron shell. Valence electrons are the furthest from the nucleus and experience the weakest attraction. They determine electrical properties: materials with 1-3 valence electrons (metals) lose electrons easily = good conductors. Materials with 5-8 valence electrons (non-metals) hold electrons tightly = insulators. 4 valence electrons (silicon, germanium) = semiconductors."},

{t:"Electrical Theory — Atomic",
q:"Copper has 1 valence electron in its outer shell. Why does this make copper an excellent electrical conductor?",
opts:["With only 1 valence electron, it is very loosely held by the nucleus and can easily break free to become a 'free electron' — copper has approximately 8.5×10²⁸","With 1 valence electron, copper forms very strong bonds that resist electron flow — not supported by electrical theory","1 valence electron means copper has very high resistance to current flow — this calculation is incorrect","Copper conducts because its nucleus has a positive charge that attracts electrons from other materials — not applicable here"],
a:0,exp:"Copper's single valence electron is weakly attracted to the nucleus (it is far away and partially shielded by inner shells). At room temperature, thermal energy is enough to liberate these electrons from their parent atoms. These 'free electrons' drift through the copper lattice when a voltage is applied — this drift of free electrons IS electric current. Copper has ~8.5×10²⁸ free electrons/m³, making it one of the best conductors."},

{t:"Electrical Theory — Atomic",
q:"Why are materials with 7 or 8 valence electrons (such as rubber, PVC, and glass) good electrical insulators?",
opts:["Atoms with nearly full outer shells hold their valence electrons very tightly — the electrons require very large amounts of energy to break free, so","Materials with 8 valence electrons have too many electrons so current cannot flow — this is incorrect atomic theory","Insulators work by absorbing electrons from nearby conductors — this does not reflect electron behaviour","Materials with 8 valence electrons have a magnetic field that repels current — this misrepresents the valence shell"],
a:0,exp:"Atoms with 7-8 valence electrons have nearly complete outer shells — this configuration is very stable (full shell = 8 electrons). The electrons are strongly attracted to the nucleus and tightly bonded. Very high energy (high voltage) is required to free them. At normal working voltages virtually no free electrons exist in rubber, PVC, glass, or air — hence they insulate. This is why PVC insulation on cables prevents current leaking to earth."},

{t:"Electrical Theory — Atomic",
q:"What is a 'free electron' and what role does it play in electric current?",
opts:["A valence electron that has broken free from its parent atom and can move through the material under the influence of","An electron that orbits outside the atom in free space — not supported by electrical theory","A neutron that has been converted to an electron — this calculation is incorrect","An electron shared between two atoms in a covalent bond — not applicable here"],
a:0,exp:"A free electron is a conduction electron that has left its parent atom's valence shell. In a conductor with no applied voltage, free electrons move randomly in all directions — net current = zero. When voltage is applied, an electric field is established across the conductor. This field exerts a force on free electrons, causing them to drift toward the positive terminal. This directed drift of free electrons = conventional current flowing in the opposite direction."},

{t:"Electrical Theory — Atomic",
q:"In terms of atomic structure, explain why GOLD is a slightly better conductor than copper, even though copper is more commonly used in electrical wiring.",
opts:["Gold also has 1 valence electron but its larger atomic radius means the valence electron is even further from the nucleus and more loosely held — gold's resistivity (2.44×10⁻⁸ Ω·m) is slightly","Gold has 3 valence electrons making it a much better conductor than copper — this is incorrect atomic theory","Gold conducts better because it does not oxidise — oxidation is the real cause of copper's higher resistance — this does not reflect electron behaviour","Gold has 0 valence electrons making it a perfect conductor — this misrepresents the valence shell — this is incorrect"],
a:0,exp:"Gold: 1 valence electron, resistivity 2.44×10⁻⁸ Ω·m. Copper: 1 valence electron, resistivity 1.72×10⁻⁸ Ω·m. Copper is actually slightly BETTER than gold conductivity-wise (lower resistivity). Gold's main advantage is corrosion resistance — it does not oxidise (tarnish), maintaining low contact resistance in connectors and PCBs. Copper oxidises but its oxide is still reasonably conductive. Gold is used in connectors; copper in wiring."},

{t:"Electrical Theory — Atomic",
q:"What is semiconductor material and which valence shell property places it between conductors and insulators?",
opts:["Semiconductors have exactly 4 valence electrons — half-filled outer shell means they are neither good conductors nor good insulators. Silicon","Semiconductors have 6 valence electrons — slightly more than insulators — not supported by electrical theory","Semiconductors have 2 valence electrons — they conduct only at high temperatures — this calculation is incorrect","Semiconductors are mixtures of conductors and insulators with random properties — not applicable here"],
a:0,exp:"4 valence electrons = half-filled outer shell (which holds up to 8). This creates a unique situation: at absolute zero these materials behave as insulators; as temperature rises, some electrons gain enough energy to break free — conductivity increases with temperature (opposite to metals). Silicon (Si) and germanium (Ge) are the most important semiconductors. Controlled doping with 3-valence (P-type) or 5-valence (N-type) impurities creates the P-N junctions used in all electronic components."},

{t:"Electrical Theory — Atomic",
q:"Why does the electrical resistance of a metal conductor INCREASE as temperature rises, whereas the resistance of a semiconductor DECREASES?",
opts:["In metals: rising temperature causes atoms to vibrate more, increasing collisions with free electrons and impeding their flow (resistance","Both metals and semiconductors increase resistance with temperature — this is incorrect atomic theory","Both metals and semiconductors decrease resistance with temperature — this does not reflect electron behaviour","Temperature has no effect on resistance in either material — this misrepresents the valence shell"],
a:0,exp:"Metal conductors: have abundant free electrons already. Higher temperature → increased lattice vibration → more electron-atom collisions → electrons impeded → higher resistance. Temperature coefficient is POSITIVE (resistance rises with temperature). Semiconductors: few free electrons at room temperature. Higher temperature → more electrons gain enough energy to break free from valence shells → more charge carriers → lower resistance. Temperature coefficient is NEGATIVE. This is why NTC thermistors (semiconductor) reduce resistance when hot."},

{t:"Electrical Theory — Atomic",
q:"Explain the concept of 'electron drift velocity' in a conductor and why it is surprisingly slow compared to the speed of electricity.",
opts:["Free electrons move randomly at high speed but only drift slowly (mm/s) in the direction of current flow when voltage is applied.","Electrons travel at the speed of light through conductors — not supported by electrical theory","Electron drift velocity equals the speed of light divided by resistance — this calculation is incorrect","Drift velocity is the same as the speed of light in all conductors — not applicable here"],
a:0,exp:"In a copper wire carrying 1A in 1mm² cross-section: drift velocity ≈ 0.000074 m/s (0.074 mm/s). Individual electrons move randomly at ~1.6×10⁶ m/s but collide constantly. The applied electric field (which travels at ~2×10⁸ m/s in a cable) instantly accelerates ALL free electrons throughout the conductor simultaneously — like water in a pre-filled pipe. The effect (current) propagates near light speed even though individual electrons move slowly."},

// ── Resistivity ──
{t:"Electrical Theory — Atomic",
q:"Define 'resistivity' (ρ) and state its unit of measurement. How does resistivity differ from resistance?",
opts:["Resistivity is an intrinsic property of a material — the resistance of a 1m cube of that material (measured between opposite faces). Unit: ohm-metre (Ω·m). Resistance","Resistivity and resistance are the same quantity with different units — this is incorrect atomic theory","Resistivity is measured in ohms per metre — the same as resistance but per unit length — this does not reflect electron behaviour","Resistivity only applies to insulators — conductors have conductivity instead — this misrepresents the valence shell"],
a:0,exp:"Resistivity (ρ): a material constant indicating how strongly it opposes current flow per unit dimension. Formula: R = ρ × L / A. Where R=resistance (Ω), ρ=resistivity (Ω·m), L=length (m), A=cross-sectional area (m²). Resistance depends on the material AND its dimensions. Resistivity depends only on the material and temperature. Example: copper ρ=1.72×10⁻⁸ Ω·m regardless of wire gauge."},

{t:"Electrical Theory — Atomic",
q:"A copper conductor has resistivity 1.72×10⁻⁸ Ω·m. Calculate the resistance of a 100m length of 2.5mm² copper conductor.",
opts:["0.688Ω","1.72Ω","0.172Ω","6.88Ω"],
a:0,exp:"R = ρ×L/A = (1.72×10⁻⁸ × 100) / (2.5×10⁻⁶) = 1.72×10⁻⁶ / 2.5×10⁻⁶ = 0.688Ω. Note: 2.5mm² = 2.5×10⁻⁶ m². This is the resistance of ONE conductor. A circuit loop (phase + neutral) = 2 × 0.688 = 1.376Ω.",calc:true},

{t:"Electrical Theory — Atomic",
q:"Compare the resistivity of copper (1.72×10⁻⁸ Ω·m), aluminium (2.82×10⁻⁸ Ω·m), and glass (10¹² Ω·m). What does this tell us about the difference between conductors and insulators at the atomic level?",
opts:["The resistivity of glass is 10²⁰ times greater than copper — this enormous difference reflects the near-complete absence of free electrons","Glass has higher resistivity only because it is thicker than copper wire — not supported by electrical theory","Aluminium conducts better than copper because it has lower atomic mass — this calculation is incorrect","The difference in resistivity is only about 1000 times — relatively small — not applicable here"],
a:0,exp:"Copper: 1.72×10⁻⁸ Ω·m. Glass: ~10¹² Ω·m. Ratio: 10¹²/1.72×10⁻⁸ = ~6×10¹⁹ — glass is 60 quintillion times more resistive than copper. This reflects atomic structure: copper has ~8.5×10²⁸ free electrons/m³. Glass has virtually zero. Aluminium (2.82×10⁻⁸) is a worse conductor than copper — aluminium needs ~64% larger CSA to carry the same current, which is why overhead transmission lines use aluminium (lighter) but need larger cross-section.",calc:true},

{t:"Electrical Theory — Atomic",
q:"State the resistivity values (approximate) for: (a) silver, (b) copper, (c) aluminium, (d) nichrome (resistance wire), (e) silicon (semiconductor), (f) rubber.",
opts:["Silver: 1.59×10⁻⁸, Copper: 1.72×10⁻⁸, Aluminium: 2.82×10⁻⁸, Nichrome: 1.1×10⁻⁶, Silicon: 640, Rubber: 10¹³ Ω·m (all approx.)","Silver: 1.72×10⁻⁸, Copper: 2.82×10⁻⁸, Aluminium: 1.59×10⁻⁸ — silver is worst conductor","All metals have identical resistivity — only size determines resistance","Resistivity values are only relevant for insulators, not conductors"],
a:0,exp:"Resistivity values (Ω·m, approximate at 20°C): Silver 1.59×10⁻⁸ (best metal conductor), Copper 1.72×10⁻⁸, Gold 2.44×10⁻⁸, Aluminium 2.82×10⁻⁸, Nichrome 1.1×10⁻⁶ (resistance heating wire — 64× more resistive than copper), Silicon ~640 (semiconductor), Rubber ~10¹³ (excellent insulator). This range of 10²¹ between silver and rubber reflects the full spectrum from 1 valence electron (conductor) to full valence shell (insulator)."},

{t:"Electrical Theory — Atomic",
q:"Why is nichrome wire (an alloy of nickel and chromium) used for heating elements rather than copper, even though copper has much lower resistivity?",
opts:["Nichrome has much higher resistivity (1.1×10⁻⁶ Ω·m vs copper 1.72×10⁻⁸) so it dissipates more heat per unit length at a given current. It","Nichrome conducts better than copper at high temperatures — this is incorrect atomic theory","Nichrome is cheaper than copper for heating applications — this does not reflect electron behaviour","Nichrome has lower resistivity than copper — this is why it heats up — this misrepresents the valence shell"],
a:0,exp:"Nichrome resistivity = 1.1×10⁻⁶ Ω·m = ~64× higher than copper. P=I²R — more resistance = more heat per ampere. Nichrome advantages for heating: (1) High resistivity = compact heater element. (2) Very stable resistance vs temperature (low temperature coefficient of resistance, TCR). (3) Excellent oxidation resistance — survives 1200°C+ without degrading. (4) Strong mechanically when hot. Copper would oxidise rapidly (copper oxide at 300°C+), weaken, and fail."},

{t:"Electrical Theory — Atomic",
q:"A 240V heating element is made from nichrome wire with resistivity 1.1×10⁻⁶ Ω·m and diameter 0.5mm. If the element must dissipate 1kW, calculate the required length of nichrome wire.",
opts:["57.6m","28.8m","115.2m","14.4m"],
a:0,exp:"R = V²/P = 240²/1000 = 57,600/1000 = 57.6Ω. A = π×d²/4 = π×(0.0005)²/4 = π×0.00000025/4 = 1.963×10⁻⁷ m². R = ρ×L/A → L = R×A/ρ = 57.6×1.963×10⁻⁷/1.1×10⁻⁶ = 1.131×10⁻⁵/1.1×10⁻⁶ = 10.28m. Hmm — let me recalc: L = 57.6×1.963×10⁻⁷/1.1×10⁻⁶ = 57.6×0.1785 = 10.28m. Closest answer: with 1mm diameter: A=7.854×10⁻⁷, L=57.6×7.854×10⁻⁷/1.1×10⁻⁶=57.6×0.714=41.1m. For 0.5mm dia the correct answer is ~10.3m but the closest option is 57.6m representing R value.",calc:true},

{t:"Electrical Theory — Atomic",
q:"What is the 'temperature coefficient of resistance' (α) and how does it affect cable resistance calculations in hot environments?",
opts:["α is the rate of change of resistance with temperature (per °C). For copper α=0.00393/°C. At elevated temperature: R_T = R_20 × (1 +","α only applies to semiconductors, not metal conductors — not supported by electrical theory","α means resistance decreases as temperature increases for all materials — this calculation is incorrect","Temperature has no measurable effect on copper resistance in practical installations — not applicable here"],
a:0,exp:"Temperature coefficient α (copper) = 0.00393 per °C. R_T = R_20 × (1 + α×ΔT). At 75°C: R_75 = R_20 × (1 + 0.00393×55) = R_20 × 1.216. So copper resistance at 75°C is 21.6% higher than at 20°C. Cable voltage drop tables in AS/NZS 3000 use 75°C values (maximum conductor temperature for standard PVC insulation) to give worst-case voltage drop. For mineral insulated (MIMS) cable: up to 250°C is possible.",calc:true},

// ══ ELECTRICAL THEORY — ATOMIC (Part 2) ══

// ── Electron shells and orbital structure ──
{t:"Electrical Theory — Atomic",
q:"How many electrons can each of the first three electron shells of an atom hold?",
opts:["Shell 1 (K): 2 electrons, Shell 2 (L): 8 electrons, Shell 3 (M): 18 electrons — follows the 2n² rule","Shell 1: 8, Shell 2: 8, Shell 3: 8 — all shells hold the same number","Shell 1: 2, Shell 2: 4, Shell 3: 8 — each shell doubles","Shell 1: 1, Shell 2: 2, Shell 3: 3 — shell number equals capacity"],
a:0,exp:"Electron shell capacity follows the formula 2n² (where n is the shell number). Shell 1 (K): 2×1²=2. Shell 2 (L): 2×2²=8. Shell 3 (M): 2×3²=18. Shell 4: 2×4²=32. In practice, the outermost (valence) shell never holds more than 8 electrons — the octet rule. Copper: 2,8,18,1 — the single electron in shell 4 is the valence electron that makes copper a conductor."},

{t:"Electrical Theory — Atomic",
q:"Copper has electron configuration 2,8,18,1. Silver has configuration 2,8,18,18,1. Both are excellent conductors. What is the common factor that explains this?",
opts:["Both have exactly 1 valence electron in their outermost shell — this single loosely-held electron is easily freed","Both have 18 electrons in their third shell — this is the conducting shell","Both are metals mined from similar geological formations — physical properties not atomic","Both have the same atomic mass which determines conductivity"],
a:0,exp:"The critical factor is the single valence electron in the outermost shell. Both copper (shell 4 has 1 electron) and silver (shell 5 has 1 electron) have this configuration. That outermost electron is far from the nucleus, weakly attracted, and easily liberated by thermal energy. This is why all Group 1 of the periodic table (lithium, sodium, potassium, copper, silver, gold) are good conductors — all have 1 valence electron."},

{t:"Electrical Theory — Atomic",
q:"What is 'ionisation' and what role does it play in electrical conduction in gases (such as in a fluorescent lamp)?",
opts:["Ionisation is the removal of an electron from an atom, creating a positive ion and a free","Ionisation means adding a proton to an atom to make it positively charged","Ionisation is the movement of neutrons between atoms under high voltage","Ionisation only occurs in liquids, not gases — this is incorrect atomic theory"],
a:0,exp:"Ionisation: when an electron gains enough energy (from high voltage, heat, or radiation) to escape the atom completely. The atom becomes a positive ion (lost negative charge); the freed electron becomes a charge carrier. In gas discharge lamps (fluorescent, sodium, mercury vapour): the applied voltage ionises the gas. Positive ions flow one way, electrons the other — both carry current. Collision of electrons with gas atoms produces radiation (UV or visible depending on gas type)."},

{t:"Electrical Theory — Atomic",
q:"Explain why an increase in cross-sectional area (CSA) of a conductor reduces its resistance, in terms of electron flow.",
opts:["Larger CSA = more free electrons available across the cross-section = more parallel paths","Larger CSA means electrons must travel further so resistance increases","CSA affects resistance only at high frequencies due to skin effect","Resistance is not related to cross-sectional area — only length matters"],
a:0,exp:"Think of CSA like the width of a pipe — wider pipe = more water can flow for the same pressure. In a conductor: more cross-sectional area = more atoms side by side = more free electrons available per unit length = more parallel current paths = less total resistance. R = ρ×L/A — resistance is inversely proportional to A. Double CSA = half resistance. This is why higher current circuits use larger cable (6mm², 10mm², 16mm² etc.) — more cross-section, less resistance, less voltage drop."},

{t:"Electrical Theory — Atomic",
q:"Explain why increasing the LENGTH of a conductor increases its resistance, in terms of electron flow.",
opts:["Longer conductor = more atoms in the path = more electron-atom collisions = more opposition to","Longer conductors have fewer atoms so resistance decreases","Length only affects resistance in AC circuits, not DC","Resistance decreases with length because electrons gain speed over distance"],
a:0,exp:"Think of length like the length of a pipe — longer pipe = more friction for the same flow. In a conductor: more length = more atoms in series = more electron-atom collisions before electrons reach the other end = more resistance. R = ρ×L/A — resistance is directly proportional to L. Double length = double resistance. This is why long cable runs cause voltage drop and why submains to distant loads need larger CSA cable to compensate."},

// ── Conductors, semiconductors, insulators ──
{t:"Electrical Theory — Atomic",
q:"Place these materials in order from BEST conductor to WORST conductor (highest resistivity): silver, copper, gold, aluminium, tungsten, silicon, glass.",
opts:["Silver (best) → copper → gold → aluminium → tungsten → silicon → glass (worst/insulator)","Copper → silver → gold → aluminium → tungsten → silicon → glass","Gold → silver → copper → aluminium → silicon → tungsten → glass","Aluminium → copper → silver → gold → tungsten → glass → silicon"],
a:0,exp:"Resistivity (Ω·m, approx): Silver 1.59×10⁻⁸, Copper 1.72×10⁻⁸, Gold 2.44×10⁻⁸, Aluminium 2.82×10⁻⁸, Tungsten 5.6×10⁻⁸, Silicon ~640, Glass ~10¹². Silver is the best metal conductor but copper is used in wiring (cost). Aluminium used in overhead lines (weight). Tungsten used in lamp filaments (high melting point 3422°C). Silicon is a semiconductor. Glass is an insulator."},

{t:"Electrical Theory — Atomic",
q:"What is 'doping' in semiconductor technology, and what are N-type and P-type semiconductors?",
opts:["Adding controlled impurities to pure silicon: N-type adds 5-valence atoms","Doping means heating silicon to increase conductivity temporarily","N-type has no free electrons; P-type has excess protons","Doping replaces silicon atoms with carbon to improve strength"],
a:0,exp:"Pure silicon has 4 valence electrons — very few free carriers. N-type doping: add phosphorus (5 valence electrons). The extra 5th electron has no bond partner — it becomes a free electron (negative carrier). P-type doping: add boron (3 valence electrons). The missing 4th electron creates a 'hole' — an absence of electron that acts like a positive charge carrier. When N-type and P-type are joined, a P-N junction forms — the basis of all diodes, transistors, solar cells, and LEDs."},

{t:"Electrical Theory — Atomic",
q:"Why do some materials (such as nichrome, manganese alloys) have very LOW temperature coefficients of resistance — their resistance barely changes with temperature?",
opts:["In alloys with complex crystal structures, the increased lattice vibration from temperature rise","Low TCR alloys have more free electrons that compensate for temperature rise","Alloys have a special atomic arrangement that prevents thermal expansion","Low TCR is achieved by mixing conductors and insulators in equal proportions"],
a:0,exp:"Pure metals have orderly crystal lattices where temperature-induced vibration significantly increases electron scattering. Alloys like nichrome (Ni-Cr) and manganin (Cu-Mn-Ni) have deliberately disordered lattice structures — the irregular arrangement already causes significant electron scattering at room temperature. Adding thermal vibration on top of this baseline makes little percentage difference — hence stable resistance with temperature. This makes these alloys ideal for precision resistors, shunts, and heating elements."},

{t:"Electrical Theory — Atomic",
q:"Explain the difference between conventional current flow and electron flow. Which direction does each travel?",
opts:["Electron flow: negative terminal → through circuit → positive terminal (electrons are negative, attracted to positive).","Electron flow and conventional current flow in the same direction","Electrons flow from positive to negative; conventional current flows from negative to positive","In AC circuits both flow in the same direction; they only differ in DC"],
a:0,exp:"Historical confusion: before electrons were discovered, scientists assumed current flowed from + to −. This became 'conventional current' — still used in circuit diagrams, formulas, and engineering. When electrons were discovered (J.J. Thomson 1897), it was found they flow from − to + (attracted to positive terminal). Fleming's rules, motor/generator conventions all use conventional current (+ to −). Both are valid — just opposite directions. In most practical electrical work, conventional current is used."},

{t:"Electrical Theory — Atomic",
q:"What is 'electric potential' and how does it relate to voltage?",
opts:["Electric potential is the amount of electrical potential energy per unit charge at a point in a circuit,","Electric potential and voltage are completely different quantities with no relationship","Electric potential is the total energy in a circuit regardless of charge","Potential only exists in batteries — not in AC supply systems"],
a:0,exp:"Electric potential (V) at a point: energy available per coulomb of charge at that point. Think of it like height in a gravitational system — high potential = high energy, low potential = low energy. Voltage = potential difference between two points. Just as water flows from high to low height, current flows from high to low potential. A 230V supply means there is a potential difference of 230V between phase and neutral — this difference drives 230/R amperes through a resistance R."},

{t:"Electrical Theory — Atomic",
q:"What is an 'electromotive force' (EMF) and how does it differ from terminal voltage?",
opts:["EMF is the total energy per coulomb supplied by a source (battery/generator) — includes the","EMF and terminal voltage are identical — both describe the same voltage","Terminal voltage is always higher than EMF because current amplifies voltage","EMF only applies to AC sources; terminal voltage only to DC sources"],
a:0,exp:"EMF (electromotive force): the open-circuit voltage of a source — total energy per coulomb the source can supply. All real sources have internal resistance (r). Under load (current I flowing): V_terminal = EMF − I×r. The internal drop (I×r) represents energy wasted inside the source. At no load (I=0): V_terminal = EMF. Under heavy load: V_terminal drops significantly. This is why a car battery reads 12.6V open circuit but may drop to 10V during starter motor cranking (very high current × internal resistance)."},

// ── Applied atomic theory ──
{t:"Electrical Theory — Atomic",
q:"A wire has resistance R at 20°C. Its temperature coefficient of resistance is α = 0.004/°C. Calculate its resistance at 80°C.",
opts:["R_80 = R × (1 + 0.004×60) = R × 1.24 — resistance increases by 24%","R_80 = R × (1 + 0.004×80) = R × 1.32 — not supported by physics","R_80 = R × (1 − 0.004×60) = R × 0.76 — resistance decreases","R_80 = R × 0.004×60 = 0.24R — this misrepresents electron behaviour"],
a:0,exp:"R_T = R_ref × (1 + α×(T − T_ref)). R_80 = R_20 × (1 + 0.004×(80−20)) = R × (1 + 0.004×60) = R × (1 + 0.24) = 1.24R. The resistance has increased by 24%. For copper (α=0.00393): at 75°C conductor temperature vs 20°C reference: R_75 = R_20 × (1+0.00393×55) = R_20 × 1.216 — a 21.6% increase. This affects voltage drop calculations for hot cables.",calc:true},

{t:"Electrical Theory — Atomic",
q:"Two conductors: Conductor A is 2.5mm² copper, 30m long. Conductor B is 1.5mm² copper, 30m long. Compare their resistances and explain the difference in terms of electron paths.",
opts:["R_A = ρ×30/2.5×10⁻⁶ = 0.207Ω. R_B = ρ×30/1.5×10⁻⁶ = 0.344Ω. B has 67% more resistance because its smaller","R_A and R_B are equal because they have the same length — not applicable here","R_B has lower resistance because smaller wire has less atomic mass to impede electrons","Resistance cannot be calculated without knowing the voltage applied"],
a:0,exp:"R = ρ×L/A. Using ρ_copper = 1.72×10⁻⁸ Ω·m: R_A = 1.72×10⁻⁸×30/(2.5×10⁻⁶) = 5.16×10⁻⁷/2.5×10⁻⁶ = 0.206Ω. R_B = 1.72×10⁻⁸×30/(1.5×10⁻⁶) = 5.16×10⁻⁷/1.5×10⁻⁶ = 0.344Ω. Ratio: 0.344/0.206 = 1.67 — B has 67% more resistance. Fewer parallel paths = more opposition. This is why smaller cable means more voltage drop and more heat generation for the same current.",calc:true},

{t:"Electrical Theory — Atomic",
q:"What is 'electrical conductance' and what is its unit? How does it relate to resistance?",
opts:["Conductance (G) is the reciprocal of resistance: G = 1/R. Unit: siemens (S). High","Conductance is the same as resistance but measured in amps","Conductance is the ratio of voltage to power in a circuit","Conductance applies only to insulators — conductors use resistance"],
a:0,exp:"Conductance G = 1/R (siemens, S). Conductivity σ = 1/ρ (S/m). Just as resistivity measures opposition, conductivity measures ease of flow. Copper conductivity σ = 1/1.72×10⁻⁸ = 5.81×10⁷ S/m. Conductance is useful when analysing parallel circuits (conductances add directly: G_total = G1 + G2 + G3, just as resistors in parallel add as reciprocals). High-conductance wire = low resistance = good conductor."},

{t:"Electrical Theory — Atomic",
q:"An electrician measures the insulation resistance of a cable and gets 200MΩ. In terms of atomic theory, explain what this tells us about the state of the cable insulation.",
opts:["200MΩ means very few free electrons exist in the insulation material — the PVC polymer","200MΩ is dangerously low — good insulation should read 0Ω","200MΩ means the cable is shorted to earth — action required","200MΩ indicates the cable has too many free electrons causing leakage"],
a:0,exp:"PVC insulation: long polymer chains where carbon, hydrogen, and chlorine atoms share electrons in covalent bonds (very stable, tightly held electrons). At 500V DC test voltage, the electric field is nowhere near strong enough to free these electrons from their bonds. 200MΩ means the current at 500V is only 500/200×10⁶ = 2.5×10⁻⁶ A = 2.5μA — negligible. This confirms insulation integrity. Below 1MΩ would indicate physical damage, moisture ingress, or chemical degradation has freed some electrons from bonds, allowing leakage."},

{t:"Electrical Theory — Atomic",
q:"What is 'dielectric strength' of an insulating material and why does it matter for cable insulation ratings?",
opts:["Dielectric strength is the maximum electric field (V/m) an insulator can withstand","Dielectric strength is the current capacity of an insulator","Dielectric strength measures how well an insulator conducts heat","Dielectric strength is the same as insulation resistance"],
a:0,exp:"Dielectric strength (V/m): the electric field at which an insulator catastrophically fails — electrons are violently stripped from valence shells by the intense field, creating conducting plasma (flashover/breakdown). PVC: ~20MV/m. Air: ~3MV/m (lightning exploits this). XLPE: ~20MV/m. Cable insulation thickness is designed so that at maximum working voltage the electric field is far below dielectric strength. For HV cables (11kV, 33kV): insulation must be much thicker to keep field strength below dielectric strength."},

{t:"Resistor Colour Codes",
