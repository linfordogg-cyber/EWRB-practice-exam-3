// ── CABLE SIZING REAL EXAM STYLE ──
{t:"Cables & Switchboards",q:"An electrician is installing a 230V single-phase circuit to supply a 4kW water heater. The cable run is 25m each way, enclosed in conduit. The diversity factor is 1.0. Calculate the minimum cable CSA needed if voltage drop must not exceed 5%.",opts:["2.5mm² — at 4kW/230V the load current is 17.4A, the 5% voltage drop limit is 11.5V, and 2.5mm² TPS at 25m each way gives a drop within limits","1.5mm² — this is sufficient for any domestic water heater circuit in standard NZ practice","4mm² — always required for water heaters regardless of current per AS/NZS 3000","6mm² — to allow for future load increases on the circuit under normal operating conditions"],a:0,exp:"IL = P/V = 4000/230 = 17.4A. Max V_drop = 5% × 230 = 11.5V. R_cable = V_drop/I = 11.5/17.4 = 0.66Ω for loop (50m). R per metre = 0.66/50 = 0.0132Ω/m. 2.5mm² Cu = 0.0073Ω/m (one-way) × 2 = 0.0146Ω/m loop ≈ 0.73Ω → drop = 17.4×0.73 = 12.7V — borderline. In practice 4mm² would be selected.",calc:true},

{t:"Cables & Switchboards",q:"Why must the neutral conductor in a TPS cable be the same CSA as the phase conductor for circuits up to 16mm²?",opts:["The neutral may carry the full load current — on a single-phase circuit it carries the same current as the phase, and on unbalanced 3-phase it may carry significant current","The neutral is always smaller than the phase conductor to save cost as required by regulations in standard NZ electrical practice","The neutral only carries current during fault conditions for all LV installations as required by AS/NZS 3000","The neutral size is determined by the fuse rating, not the load current per EWRB requirements under the Electricity (Safety) Regulations 2010"],a:0,exp:"On single-phase circuits: neutral current = phase current. On unbalanced 3-phase circuits: the neutral carries the difference between phase currents. AS/NZS 3000 requires neutral CSA ≥ phase CSA for conductors up to 16mm² to handle these currents safely without overheating."},

// ── ADDITIONAL PROTECTION QUESTIONS ──
{t:"Electrical Protection",q:"An MCB is described as 'Type B 32A'. What does 'Type B' mean?",opts:["The MCB trips instantaneously when current reaches 3–5 times the rated current — suitable for resistive loads like heaters and lighting with low inrush current","Type B means it trips at 2× rated current instantaneously in standard NZ practice per EWRB requirements","Type B is rated for use in bathrooms only per AS/NZS 3000 for all registered electricians in NZ","Type B has a time delay before tripping at any current level under normal operating conditions under normal operating conditions"],a:0,exp:"MCB trip characteristics: Type B = instantaneous trip at 3–5× In (for resistive loads, lighting). Type C = instantaneous trip at 5–10× In (for motors, transformers with moderate inrush). Type D = instantaneous trip at 10–20× In (for heavy inductive loads, large transformers). Type B is the most common for domestic wiring."},

{t:"Electrical Protection",q:"What is the difference between 'overload' protection and 'short-circuit' protection?",opts:["Overload: sustained current slightly above rated value (1.1–6× In) — slow to develop, thermal device adequate. Short-circuit: sudden massive current (10–100× In) — must clear in milliseconds, requires HRC fuse or MCB magnetic trip","They are the same thing — both cause the protective device to operate as required by regulations in standard NZ electrical practice","Overload is for AC circuits only; short-circuit protection is for DC circuits for all LV installations as required by AS/NZS 3000","Short-circuit protection is only required on circuits above 32A per EWRB requirements under the Electricity (Safety) Regulations 2010"],a:0,exp:"Overload: current exceeds rated value but not by large factor — caused by too many loads on a circuit. Heat builds slowly. Thermal devices (bimetal strip in MCB, thermal overload relay) provide this protection. Short-circuit: near-zero impedance fault causes enormous current instantly — arc flash hazard. Magnetic trip in MCB or HRC fuse provides instantaneous clearance."},

// ── ADDITIONAL NZ SUPPLY ──
{t:"NZ Supply & MEN",q:"What is the purpose of the main earthing conductor connecting the main earth bar to the earth electrode?",opts:["To provide a continuous low-impedance metallic path from the installation earthing system to the mass of earth — ensuring fault currents have a reliable return path and establishing the earth reference potential","To carry the neutral return current back to the supply transformer in standard NZ practice per EWRB requirements","To provide a second neutral path in case the main neutral fails per AS/NZS 3000 for all registered electricians in NZ","To protect the main switchboard from lightning strikes under normal operating conditions under normal operating conditions"],a:0,exp:"The main earthing conductor (earth electrode conductor): connects the main earth bar at the switchboard to the earth electrode(s) buried in the ground. Its purpose: (1) Establishes the earth reference (earth potential) for the entire installation. (2) Provides fault current return path via the mass of earth. (3) Part of the MEN system — it is the physical link between the installation and earth potential. Minimum size: 6mm² Cu for most domestic installations."},

// ── ADDITIONAL MOTORS ──
{t:"Motors & Starters",q:"A 3-phase induction motor takes 5 seconds to accelerate from standstill to full speed on DOL starting. During this period, what current is approximately flowing?",opts:["6–8 times full-load current (FLC) — the locked-rotor current as back-EMF builds from zero to full value during acceleration","Full-load current only — the motor draws rated current throughout starting","2 times full-load current — the star-delta starting reduces it","The starting current starts at zero and gradually rises to FLC"],a:0,exp:"During DOL starting: initially the rotor is stationary, back-EMF = 0, so the motor draws locked-rotor current (LRC) = 6–8× FLC. As the motor accelerates and back-EMF builds, current decreases. By full speed, current is at FLC. This high starting current causes voltage dips on the supply and is why star-delta/auto-transformer starters are used for large motors."},

{t:"Motors & Starters",q:"State the purpose of the overload heater elements in a thermal overload relay.",opts:["They carry the motor current and heat up proportionally — if the motor is overloaded for too long the heaters trip the relay contacts, disconnecting the motor before winding insulation is damaged","They provide heating for the motor windings during cold start conditions as required by regulations in standard NZ electrical practice","They are resistors that reduce the starting current of the motor for all LV installations as required by AS/NZS 3000","They are fuses that blow when the motor overloads per EWRB requirements under the Electricity (Safety) Regulations 2010"],a:0,exp:"Thermal overload relay: the heater elements carry the motor current (via CTs or directly). The heat produced is proportional to I²R. If overload current persists, the heaters warm a bimetallic strip which deflects, eventually tripping the NC contact in the control circuit — dropping out the main contactor. The relay has a manual or automatic reset. The inverse time characteristic means small overloads take longer to trip than large ones."},

// ── ADDITIONAL TESTING ──
{t:"Testing & Inspection",q:"During polarity testing of a new installation, what fault is being checked for?",opts:["That all single-pole switches and protective devices are in the phase conductor and not the neutral — an incorrectly wired switch in the neutral leaves the load permanently live even when switched off","That the supply voltage is within tolerance (±6% of 230V) in standard NZ practice per EWRB requirements","That the RCD trips within 300ms at rated current per AS/NZS 3000 for all registered electricians in NZ","That the earth continuity resistance is below 1Ω under normal operating conditions under normal operating conditions"],a:0,exp:"Polarity test: verifies that all single-pole devices (switches, fuses, MCBs) are in the PHASE conductor — not the neutral. A switch wired in the neutral breaks the neutral but leaves the load at phase voltage — dangerous shock hazard when working on 'switched off' equipment. Test: with supply off, check phase is connected to the correct terminals of all single-pole devices."},

{t:"Testing & Inspection",q:"What is the minimum insulation resistance value acceptable for a newly installed LV circuit before connecting to the supply (no equipment connected)?",opts:["Minimum 1MΩ measured at 500V DC between all live conductors and earth","Minimum 0.5MΩ at 250V DC as required by regulations","Minimum 10MΩ — new wiring should have very high IR","Minimum 100kΩ is sufficient for a new circuit"],a:0,exp:"AS/NZS 3000 Section 8: minimum IR for a new installation = 1MΩ, tested at 500V DC. This is the minimum — new wiring typically reads 100MΩ+ (effectively infinite on good Megger). The 1MΩ minimum is the acceptance threshold. Below 1MΩ indicates damaged insulation, contamination, or incorrect wiring. With MIMS elements connected: 0.01MΩ (10kΩ) minimum."},

// ── ADDITIONAL HEALTH & SAFETY ──
{t:"Health & Safety (HSWA 2015)",q:"An electrician is working in a roof space on a hot day. The temperature reaches 45°C. Under HSWA, what hazard does this create and what controls apply?",opts:["Heat stress — a significant health hazard. Controls: monitor for symptoms (dizziness, nausea, confusion), take regular breaks in cool areas, drink water frequently, work during cooler","Heat is not a health hazard for electricians — only electrical hazards are relevant for all LV installations in standard NZ electrical practice","Working in heat requires a WorkSafe permit to work only per EWRB requirements as required by AS/NZS 3000","Heat only becomes a hazard above 60°C — 45°C requires no special controls in standard NZ practice under the Electricity (Safety) Regulations 2010"],a:0,exp:"Heat stress under HSWA: excessive heat is a recognised workplace hazard. PCBU must manage it 'so far as is reasonably practicable.' Controls (hierarchy): engineering (ventilation, scheduling work in cool periods), administrative (buddy system, regular breaks, hydration, acclimatisation), PPE (cooling vests). Symptoms requiring immediate rest: dizziness, confusion, cessation of sweating, nausea. Roof spaces in NZ summer can reach 60°C+."},

{t:"Health & Safety (HSWA 2015)",q:"What does a 'Permit to Work' (PTW) system provide and when is it used for electrical work?",opts:["A formal documented authorisation that specific hazardous work may proceed — used for live electrical work, confined space entry, work near overhead lines, and","A permit issued by WorkSafe for any electrical work above 230V per AS/NZS 3000 per EWRB requirements","A certificate issued by the EWRB for each job performed under normal operating conditions for all registered electricians in NZ","A document replacing the need for Danger Tags on isolated equipment as required by regulations under normal operating conditions"],a:0,exp:"Permit to Work: a formal written system where a designated authorising person confirms that: (1) hazards have been identified, (2) controls are in place, (3) the work can safely proceed. Used for: live electrical work, confined spaces, work near overhead lines, work on HV systems. The PTW does NOT replace Danger Tags — both are required. It creates a formal record of hazard assessment and control sign-off."},

// ── ADDITIONAL REGULATIONS ──
{t:"Electricity Act & Regulations NZ",q:"What is the maximum time allowed between completing prescribed electrical work and providing the Certificate of Compliance and Electrical Safety Certificate to the contracting person?",opts:["20 working days from when the work is connected to the power supply","30 calendar days from completion of the work","7 working days — always for all LV installations","5 working days for commercial work, 20 for domestic"],a:0,exp:"Electricity (Safety) Regulations 2010, Regulations 65 and 74A: both the CoC and ESC must be provided to the contracting person as soon as practicable, and in any case no later than 20 WORKING DAYS after the work is connected to the power supply. Note: 'working days' excludes weekends and public holidays. Failure to provide within 20 working days is a disciplinary offence."},

{t:"Electricity Act & Regulations NZ",q:"Under the Electricity (Safety) Regulations 2010, who is responsible for issuing the Electrical Safety Certificate for prescribed electrical work?",opts:["The registered electrical worker who carried out or supervised the work — they certify it has been tested and is electrically safe","The supply authority, after their inspector approves the work per EWRB requirements","The EWRB, after receiving the Certificate of Compliance in standard NZ practice","The homeowner or building owner, after accepting the work per AS/NZS 3000"],a:0,exp:"The ESC must be issued by the REGISTERED ELECTRICAL WORKER who carried out the work (or the supervising registered electrician if a trainee did the work). By signing the ESC, the registered electrician certifies that: the work has been tested, it is electrically safe, and it will not adversely affect other parts of the installation. No one else can issue an ESC."},

// ── SCENARIO NEW ──
{t:"Scenarios",q:"SCENARIO: You arrive on a job to install a new circuit. You notice the existing main switchboard has a main switch that is cracked and appears to have been subject to a fault. The homeowner says 'it still works fine.' What must you do?",opts:["Advise the homeowner in writing that the switchboard has a defect that must be repaired — you must not knowingly connect new work to unsafe equipment. Document your advice and do not proceed until the defect is rectified","Proceed with the installation — the switchboard is the homeowner's responsibility under normal operating conditions in standard NZ electrical practice","Install the new circuit and note the cracked switch in your job notes as required by regulations as required by AS/NZS 3000","Only report the defect if the homeowner specifically asks you to check the board for all LV installations under the Electricity (Safety) Regulations 2010"],a:0,exp:"An electrician who knowingly connects new work to unsafe existing equipment may be liable. Under the Electricity (Safety) Regulations and HSWA: (1) Advise the homeowner in writing of the defect. (2) Do not connect new work to the unsafe switchboard. (3) Recommend immediate repair/replacement by a registered electrician. (4) Keep a record of the advice given. If the homeowner refuses, the electrician should not proceed with the new work."},

{t:"Scenarios",q:"SCENARIO: While testing a 230V final subcircuit, your earth fault loop impedance tester reads 'OL' (overload/infinite). What does this indicate and what action should you take?",opts:["The earth fault loop is OPEN — there is no complete earth return path. Check earth continuity of the circuit — likely a broken or missing earth conductor, poor connection, or failed earth bond. Do not energise until repaired","The circuit has too many loads — reduce the number of outlets and retest per EWRB requirements per EWRB requirements","The test instrument battery is flat — replace and retest in standard NZ practice for all registered electricians in NZ","The supply voltage is too low for the test — wait for normal supply conditions per AS/NZS 3000 under normal operating conditions"],a:0,exp:"'OL' on a loop impedance tester = infinite or unmeasurably high impedance = the loop is OPEN. This means: there is no complete earth fault path from the phase conductor at the test point, through a fault, back via the earthing system to the transformer. Causes: open earth conductor, missing MEN link, failed earth connection, disconnected earth electrode. The circuit MUST NOT be used until the fault is found and repaired — a phase-to-earth fault would leave equipment live with no fault current to operate protection."},

  {re:/parallel.*R1.*R2|R1.*R2.*parallel|total resistance.*parallel|parallel.*total|product.over.sum/i, f:'Parallel: 1/Rt = 1/R1 + 1/R2 + 1/R3\nTwo resistors: Rt = (R1 \u00d7 R2)/(R1+R2)\nCurrent divider: I_R1 = It \u00d7 R2/(R1+R2)'},
  {re:/series.parallel|parallel.series|R2.*parallel.*series|series.*parallel.*R/i, f:'Step 1: R_parallel = (Ra \u00d7 Rb)/(Ra+Rb)\nStep 2: Rt = Rs + R_parallel\nStep 3: It = V/Rt  then  V_parallel = It \u00d7 R_parallel'},
  {re:/voltage drop.*cable|cable.*voltage drop|V_drop|terminal volt|internal resist/i, f:'V_drop = I \u00d7 R\nV_load = V_supply - V_drop\nTerminal V = EMF - (I \u00d7 r_internal)'},
  {re:/power.*resistor|resistor.*power|dissipat/i, f:'P = V \u00d7 I  |  P = I\u00b2 \u00d7 R  |  P = V\u00b2/R'},
  {re:/resistivity|rho.*length|R = .*rho/i, f:'R = (\u03c1 \u00d7 L) / A\n\u03c1 copper = 1.72 \u00d7 10\u207b\u2078 ohm.m'},
  {re:/current divider|current.*split.*parallel/i, f:'Current divider: I_R1 = It \u00d7 R2/(R1+R2)\nMore current flows through LOWER resistance'},
  {re:/voltage divider|voltage.*split|V across R[12]/i, f:'Voltage divider: V_Rx = V \u00d7 Rx/Rt\nMore voltage drops across HIGHER resistance'},

  {re:/HP.*kW|horsepower|746|convert.*HP|HP.*watts/i, f:'HP \u00d7 746 = Watts\n1 HP = 746 W = 0.746 kW\nPin = Pout / \u03b7'},
  {re:/input power|efficiency.*input|Pin =|Pout.*efficiency/i, f:'Pin = Pout / \u03b7     |\u03b7 = Pout / Pin \u00d7 100'},
  {re:/torque.*power|power.*torque|\bNm\b.*rpm|rpm.*\bNm\b|P = 2/i, f:'P = 2\u03c0 \u00d7 N \u00d7 T / 60\nT = P \u00d7 60 / (2\u03c0 \u00d7 N)\nWhere: P=watts, N=rpm, T=Nm'},
  // Transformer
  {re:/turns ratio|Np.*Ns|secondary.*voltage.*transformer|transformer.*secondary.*voltage/i, f:'Vp / Vs = Np / Ns = Is / Ip\nkVA = \u221a3 \u00d7 VL \u00d7 IL (3-phase)'},
  {re:/kVA.*transformer|transformer.*kVA|kVA rating/i, f:'kVA = \u221a3 \u00d7 VL \u00d7 IL  (3-phase)\nkVA = V \u00d7 I  (1-phase)'},
  {re:/secondary line current|full load.*secondary|IL.*secondary/i, f:'IL = kVA / (\u221a3 \u00d7 VL)'},
  {re:/primary line current|full load.*primary|IL.*primary/i, f:'IL = kVA / (\u221a3 \u00d7 VL)'},
  {re:/percentage.*regulation|voltage regulation/i, f:'% Reg = (V_NL - V_FL) / V_NL \u00d7 100'},
  {re:/\bCT\b.*ratio|current transformer.*read|ammeter.*read.*CT/i, f:'Is = Ip \u00d7 (Ns / Np)\nIp = Is \u00d7 (Np / Ns)'},
  // Protection
  {re:/fault current|IF =|loop impedance.*fault/i, f:'IF = V / Zs\nPSCC = V / Zs'},
  {re:/power factor.*single.phase|single.phase.*power factor/i, f:'pf = P / (V \u00d7 I)'},
  {re:/power factor.*three.phase|three.phase.*power factor|pf.*VL.*IL/i, f:'pf = P / (\u221a3 \u00d7 VL \u00d7 IL)'},
  {re:/true power.*3.phase|3-phase.*kW|P = .*sqrt|three.phase.*true power/i, f:'P = \u221a3 \u00d7 VL \u00d7 IL \u00d7 pf'},
  {re:/apparent power|kVA of the|total kVA.*installation/i, f:'S = \u221a(kW\u00b2 + kVAr\u00b2)\nS = V \u00d7 I (1-ph)  |  S = \u221a3 \u00d7 VL \u00d7 IL (3-ph)'},
  {re:/reactive power|kVAr of|VAr of|kVAr.*Load/i, f:'Q = \u221a(S\u00b2 - P\u00b2)\nQ = V \u00d7 I \u00d7 sin\u03c6\nS = \u221a(P\u00b2 + Q\u00b2)'},
  {re:/impedance.*R.*X|Z =|series.*RL|series.*RC/i, f:'Z = \u221a(R\u00b2 + X\u00b2)\nXL = 2\u03c0fL  |  XC = 1/(2\u03c0fC)'},
  {re:/insulation resistance.*length|IR.*500 m|IR.*length/i, f:'R\u2082 = R\u2081 \u00d7 L\u2081 / L\u2082\n(IR is inversely proportional to cable length)'},
  {re:/heater.*power.*voltage.*drop|voltage drop.*heater|5%.*power/i, f:'P = V\u00b2 / R   (R stays constant)\nP\u2082 = P\u2081 \u00d7 (V\u2082 / V\u2081)\u00b2'},
  {re:/VL.*star|star.*VL|phase voltage.*star|line voltage.*star/i, f:'VL = \u221a3 \u00d7 Vph   |   Vph = VL / \u221a3'},
  {re:/IL.*delta|delta.*line current|phase current.*delta/i, f:'IL = \u221a3 \u00d7 Iph   |   Iph = IL / \u221a3'},

  // AC theory
  {re:/Vrms.*peak|peak.*Vrms|RMS.*peak|peak.*RMS/i, f:'Vrms = Vpeak / \u221a2 = Vpeak \u00d7 0.7071\nVpeak = Vrms \u00d7 \u221a2 = Vrms \u00d7 1.4142\nVavg = 0.6366 \u00d7 Vpeak'},
  {re:/form factor|average.*voltage|RMS.*average/i, f:'Form factor = Vrms / Vavg = 1.11\nVavg = 0.6366 \u00d7 Vpeak\nVrms = 0.7071 \u00d7 Vpeak'},
  {re:/XL|inductive reactance/i, f:'XL = 2\u03c0fL  (ohms)\nXC = 1 / (2\u03c0fC)  (ohms)\nZ = \u221a(R\u00b2 + X\u00b2)'},

  // Lighting
  {re:/illuminan|lux.*m|candela.*dist|inverse square.*light/i, f:'Illuminance: E = I / d\u00b2  (lux)\nWhere I = intensity (candela), d = distance (m)\nDouble distance \u2192 1/4 illuminance'},

  {re:/turns.*secondary|how many.*turns|Ns =/i, f:'Ns = Np \u00d7 (Vs / Vp)\nVp/Vs = Np/Ns = Is/Ip'},

function getHint(q) {
  if (!q.calc) return null;
  for (const h of HINTS) { if (h.re.test(q.q)) return h.f; }
  return 'Formula sheet: P=VI | P=I²R | V=IR | Ns=120f/P | IF=V/Zs | Vp/Vs=Np/Ns | P=√3×VL×IL×pf';
}

function calcPoints(isCalc, timeTakenMs){
  const base=10;
  const window=isCalc?45000:15000;
  const maxMult=isCalc?3.0:2.0;
  const t=Math.min(timeTakenMs, window);
  const mult=maxMult - (maxMult-1.0)*(t/window);
  return Math.round(base*mult);
}

function startExam(){
  if(!selTop.size){alert('Select at least one topic.');return;}
  let pool=QS.filter(q=>selTop.has('__all__')||selTop.has(q.t));
  if(pool.length<examLen){alert('Not enough questions for selected topics.');return;}
  examQs=shuffle([...pool]).slice(0,examLen);
  qIdx=0; score=0; answers=[]; flagged=[]; sessionPoints=0;
  tStats={};
  ALL_TOPICS.forEach(t=>{tStats[t]={c:0,w:0};});
  show('s-exam');
  renderQ();
}

function renderQ(){
  qAnswered=false;
  qStartTime=Date.now();
  const q=examQs[qIdx];
  const pct=Math.round((qIdx/examQs.length)*100);
  document.getElementById('pfill').style.width=pct+'%';
  document.getElementById('qcnt').textContent='Question '+(qIdx+1)+' of '+examQs.length;
  document.getElementById('qlive').textContent='Score: '+score+'/'+qIdx+(sessionPoints?' · '+sessionPoints+'pts':'');
  const nb=document.getElementById('nbtn');
  const fb=document.getElementById('fbtn');
  if(nb){nb.style.display='none'; nb.onclick=null;}
  if(fb){fb.style.display='none'; fb.onclick=null;}

  const order=shuffle([0,1,2,3]);
  const correctNew=order.indexOf(q.a);

  const fl=flagged.includes(qIdx);
  let h='<div class="qcard">';
  h+='<button class="flg'+(fl?' on':'')+'\" onclick="toggleFlag('+qIdx+')" id="flgbtn">'+(fl?'★ Flagged':'☆ Flag')+'</button>';
  h+='<span class="qtag">'+q.t+'</span>';
  if(q.calc) h+='<span class="calctag">&#128290; Calculation</span>';

  // Timer display
  const window=q.calc?45:15;
  h+='<div class="qtimer" id="qtimer"><span id="qtime-bar-wrap"><span id="qtime-bar" style="width:100%"></span></span><span id="qtime-label">'+window+'s</span></div>';

  const hint=getHint(q);
  if(hint){
    h+='<div style="margin-bottom:8px">';
    h+='<button class="hint-btn" onclick="toggleHint(this)">&#128214; Show formula</button>';
    h+='<div class="hint-box">'+hint+'</div>';
    h+='</div>';
  }
  const hasHTML=q.q.includes('<');
  h+='<div class="qtext'+(hasHTML?' scenario':'')+'">'+(!hasHTML?'Q'+(qIdx+1)+'. ':'')+q.q+'</div>';
  order.forEach((origIdx,newIdx)=>{
    h+='<button class="opt" id="opt-'+newIdx+'" onclick="answer('+newIdx+','+correctNew+')">'+String.fromCharCode(65+newIdx)+'.  '+q.opts[origIdx]+'</button>';
  });
  h+='<div class="exp" id="expbox">&#128161; '+q.exp+'</div></div>';
  document.getElementById('qarea').innerHTML=h;

  // Start the visual timer
  startQTimer(window, q.calc);
}

// ── Visual timer ──
let timerInterval=null;
function startQTimer(seconds, isCalc){
  if(timerInterval) clearInterval(timerInterval);
  const bar=document.getElementById('qtime-bar');
  const label=document.getElementById('qtime-label');
  const total=seconds*1000;
  const tick=100;
  let elapsed=0;
  timerInterval=setInterval(function(){
    if(qAnswered){clearInterval(timerInterval);return;}
    elapsed+=tick;
    const pct=Math.max(0,100-(elapsed/total*100));
    if(bar) bar.style.width=pct+'%';
    const sLeft=Math.max(0,Math.ceil((total-elapsed)/1000));
    if(label) label.textContent=sLeft+'s';
    if(elapsed>=total){
      clearInterval(timerInterval);
      if(bar) bar.style.background='#da3633';
    }
  },tick);
}

function answer(chosen, correctNew){
  if(qAnswered) return;
  qAnswered=true;
  if(timerInterval){clearInterval(timerInterval); timerInterval=null;}

  // Immediately block all options
  const allOpts=document.querySelectorAll('.opt');
  allOpts.forEach(b=>{b.disabled=true; b.onclick=null; b.style.pointerEvents='none';});

  const ok=chosen===correctNew;
  const chosenBtn=document.getElementById('opt-'+chosen);
  const correctBtn=document.getElementById('opt-'+correctNew);
  if(chosenBtn) chosenBtn.classList.add(ok?'ok':'bad');
  if(!ok&&correctBtn) correctBtn.classList.add('show');
  const expbox=document.getElementById('expbox');
  if(expbox) expbox.classList.add('on');

  const q=examQs[qIdx];
  const timeTaken=Date.now()-qStartTime;
  let pts=0;
  if(ok){
    score++;
    if(tStats[q.t]) tStats[q.t].c++;
    pts=calcPoints(!!q.calc, timeTaken);
    sessionPoints+=pts;
  } else {
    if(tStats[q.t]) tStats[q.t].w++;
  }
  answers.push({q, ok, pts, timeTaken});

  // Show points flash if correct
  if(ok && pts){
    const qcard=document.querySelector('.qcard');
    if(qcard){
      const flash=document.createElement('div');
      flash.className='pts-flash';
      flash.textContent='+'+pts+' pts'+(pts>10?' ⚡':'');
      qcard.appendChild(flash);
      setTimeout(()=>flash.remove(), 1800);
    }
  }

  // Update live score display
  document.getElementById('qlive').textContent='Score: '+score+'/'+answers.length+(sessionPoints?' · '+sessionPoints+'pts':'');

  // Reliable button reveal with double-check
  const isLast=qIdx===examQs.length-1;
  setTimeout(function(){
    const nb=document.getElementById('nbtn');
    const fb=document.getElementById('fbtn');
    if(isLast){
      if(fb){fb.style.display='inline-block'; fb.onclick=showResults;}
    } else {
      if(nb){nb.style.display='inline-block'; nb.onclick=nextQ;}
    }
  },80);
}

function nextQ(){
  const nb=document.getElementById('nbtn');
  if(nb){nb.style.display='none'; nb.onclick=null;}
  qIdx++;
  renderQ();
}



function showResults(){
  if(timerInterval){clearInterval(timerInterval); timerInterval=null;}
  saveScore(score, examQs.length, sessionPoints);
  show('s-results');
  const pct=Math.round((score/examQs.length)*100);
  const col=pct>=70?'#27500A':pct>=50?'#BA7517':'#A32D2D';
  const el_rpct=document.getElementById('rpct');
  const el_rco=document.getElementById('rco');
  const el_rwr=document.getElementById('rwr');
  const el_rverd=document.getElementById('rverd');
  if(el_rpct) el_rpct.textContent=pct+'%';
  if(el_rco) el_rco.textContent=score;
  if(el_rwr) el_rwr.textContent=examQs.length-score;
  if(el_rverd) el_rverd.innerHTML=
    '<div style="text-align:center;margin:12px 0">'+
    '<span style="font-size:22px;font-weight:800;color:'+col+'">'+
    (pct>=70?'&#10003; Pass standard met':'&#10007; Below pass standard (70%)')+
    '</span><br><span style="color:#e8a000;font-weight:700;font-size:17px">'+
    sessionPoints+' pts <span style="font-size:13px;color:#888">('+pct+'% · '+score+'/'+examQs.length+')</span></span></div>';
  let bk='';
  Object.entries(tStats).forEach(function(entry){
    const t=entry[0], s=entry[1];
    const tot=s.c+s.w; if(!tot)return;
    const tp=Math.round((s.c/tot)*100);
    const col2=tp>=75?'#27500A':tp>=50?'#BA7517':'#A32D2D';
    bk+='<div class="rbar"><span class="rbl">'+t+'</span><div class="rbt"><div class="rbf" style="width:'+tp+'%;background:'+col2+'"></div></div><span class="rbv">'+s.c+'/'+tot+'</span></div>';
  });
  const el_tbk=document.getElementById('tbk');
  if(el_tbk) el_tbk.innerHTML=bk;
}

function reviewWrong(){
  show('s-review');
  const wrong=answers.filter(a=>!a.ok);
  if(!wrong.length){document.getElementById('rarea').innerHTML='<p style="padding:1rem">No wrong answers — perfect score!</p>';return;}
  let h='';
  wrong.forEach((a,i)=>{
    h+='<div class="rc"><span class="qtag">'+a.q.t+'</span>';
    if(a.q.calc) h+='<span class="calctag">🔢 Calculation</span>';
    const hasHTML2 = a.q.q.includes('<');
    h+='<div class="qtext'+(hasHTML2?' scenario':'')+'">'+(!hasHTML2?'Q'+(i+1)+'. ':'')+a.q.q+'</div>';
    // show in original order for review
    a.q.opts.forEach((o,j)=>{
      const c=j===a.q.a?'show':'';
      h+='<button class="opt '+c+'" disabled>'+String.fromCharCode(65+j)+'.  '+o+'</button>';
    });
    h+='<div class="exp on">💡 '+a.q.exp+'</div></div>';
  });
  document.getElementById('rarea').innerHTML=h;
}

function goHome(){show('s-home'); renderLB();}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}





// ── Player & Leaderboard ──
const LB_KEY = 'ewrb_lb_v2';
let currentPlayer = JSON.parse(localStorage.getItem('ewrb_player')||'null');

function pickAv(btn){
  document.querySelectorAll('.av-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
}

function savePlayer(){
  const name = document.getElementById('player-name').value.trim();
  if(!name){ alert('Enter your name first!'); return; }
  const av = (document.querySelector('.av-btn.selected')||{}).dataset||{};
  const avatar = av.av || '⚡';
  currentPlayer = {name, avatar};
  localStorage.setItem('ewrb_player', JSON.stringify(currentPlayer));
  showPlayerInfo();
}

function changePlayer(){
  document.getElementById('player-setup').style.display='';
  document.getElementById('player-info').style.display='none';
}

function showPlayerInfo(){
  const pi = document.getElementById('player-info');
  const ps = document.getElementById('player-setup');
  if(!currentPlayer){ ps.style.display=''; pi.style.display='none'; return; }
  document.getElementById('player-display').textContent = currentPlayer.avatar+' '+currentPlayer.name;
  ps.style.display='none'; pi.style.display='flex';
}

function saveScore(correct, total, pts){
  if(!currentPlayer) return;
  const pct=Math.round((correct/total)*100);
  const lb=JSON.parse(localStorage.getItem(LB_KEY)||'[]');
  const existing=lb.find(e=>e.name===currentPlayer.name);
  const entry={name:currentPlayer.name, avatar:currentPlayer.avatar, pct, score:correct, total, pts:pts||0};
  if(existing){
    // Update if better score OR same score with more points
    if(pct>existing.pct||(pct===existing.pct&&(pts||0)>existing.pts)){
      Object.assign(existing, entry);
    }
  } else {
    lb.push(entry);
  }
  lb.sort((a,b)=>b.pts!==a.pts?b.pts-a.pts:b.pct-a.pct);
  localStorage.setItem(LB_KEY, JSON.stringify(lb.slice(0,20)));
  renderLB();
}

function renderLB(){
  const lb = JSON.parse(localStorage.getItem(LB_KEY)||'[]');
  const el = document.getElementById('lb-list');
  if(!el) return;
  if(lb.length===0){ el.innerHTML='<div class="lb-loading">No scores yet — be the first!</div>'; return; }
  const medals = ['🥇','🥈','🥉'];
  el.innerHTML = lb.slice(0,10).map((e,i)=>{
    const isYou = currentPlayer && e.name===currentPlayer.name;
    return '<div class="lb-row'+(isYou?' lb-you':'')+'">'+
      '<span class="lb-rank">'+(medals[i]||(i+1))+'</span>'+
      '<span class="lb-av">'+e.avatar+'</span>'+
      '<span class="lb-name">'+e.name+(isYou?' (you)':'')+'</span>'+
      '<span class="lb-score lb-pts">'+(e.pts||0)+' pts</span>'+
      '<span class="lb-pct">'+e.pct+'% · '+e.score+'/'+e.total+'</span>'+
    '</div>';
  }).join('');
}

function toggleHint(btn){
  var box=btn.nextElementSibling;
  var on=box.classList.toggle('on');
  btn.textContent=on?'📔 Hide formula':'📔 Show formula';
}
function toggleFlag(i){
  if(flagged.includes(i))flagged=flagged.filter(x=>x!==i);else flagged.push(i);
  const b=document.getElementById('flgbtn');
  if(b){b.textContent=flagged.includes(i)?'\u2605 Flagged':'\u2606 Flag';
  b.classList.toggle('on',flagged.includes(i));}
}

function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}

function toggle(t,btn){
  if(t==='__all__'){
    selTop.clear();
    selTop.add('__all__');
    document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
  } else {
    selTop.delete('__all__');
    document.querySelector('[data-topic="__all__"]').classList.remove('on');
    if(selTop.has(t)){selTop.delete(t);btn.classList.remove('on');}
    else{selTop.add(t);btn.classList.add('on');}
    if(selTop.size===0){selTop.add('__all__'); document.querySelector('[data-topic="__all__"]').classList.add('on');}
  }
}

function setLen(btn,n){
  examLen=n;
  document.querySelectorAll('.lbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}

function init(){
  show('s-home');
  showPlayerInfo();
  renderLB();
  const grid=document.getElementById('topic-grid');
  const ab=document.createElement('button');
  ab.className='tbtn on'; ab.dataset.topic='__all__';
  ab.innerHTML='<div class="tlabel">All topics</div><div class="tcount">'+QS.length+' questions</div>';
  ab.onclick=function(){toggle('__all__',ab);};
  grid.appendChild(ab);
  ALL_TOPICS.forEach(function(t){
    const qs=QS.filter(function(q){return q.t===t;});
    const nc=qs.filter(function(q){return q.calc;}).length;
    const b=document.createElement('button');
    b.className='tbtn'; b.dataset.topic=t;
    b.innerHTML='<div class="tlabel">'+t+'</div><div class="tcount">'+qs.length+' Qs'+(nc?' ('+nc+' 🔢)':'')+'</div>';
    b.onclick=function(){toggle(t,b);};
    grid.appendChild(b);
  });
}

init();
</script>
