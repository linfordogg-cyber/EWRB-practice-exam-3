// ══ SEMICONDUCTOR & ELECTRONIC COMPONENTS ══

{t:"Electronics & Semiconductors",
q:"What is a P-N junction diode and what is its primary function in a circuit?",
opts:["A semiconductor device that allows current to flow in ONE direction only (forward biased) and blocks it in the reverse","A device that amplifies small signals into larger ones — used in amplifier circuits","A device that stores electrical charge — similar to a capacitor but semiconductor-based","A device that controls current using a magnetic field — the semiconductor version of a relay"],
a:0,exp:"A P-N junction diode: P-type semiconductor joined to N-type. Forward biased (P positive, N negative): the depletion region narrows, current flows. Reverse biased (P negative, N positive): depletion region widens, virtually no current flows. Forward voltage drop: silicon ~0.6-0.7V, germanium ~0.2-0.3V. Uses: rectifier circuits, flyback protection, signal clipping, LED lighting, solar cells."},

{t:"Electronics & Semiconductors",
q:"In a half-wave rectifier circuit using a single diode, what is the output waveform when a 230V AC 50Hz sinewave is applied to the input?",
opts:["Pulsating DC — only the positive half-cycles pass through the diode. The output","Full DC with no ripple — the diode converts AC perfectly","Negative pulses only — the diode blocks positive half-cycles","Unmodified AC — the diode has no effect on the waveform"],
a:0,exp:"Half-wave rectifier: diode conducts on positive half-cycles, blocks on negative. Output: positive half-sinewave pulses at 50Hz. Peak output ≈ Vpeak − V_diode_drop = 325 − 0.7 = 324.3V. Average output = 0.318 × Vpeak = 0.318 × 325 = 103.4V. Ripple frequency = 50Hz (same as supply). A smoothing capacitor reduces the ripple. Used in simple power supplies."},

{t:"Electronics & Semiconductors",
q:"What are the THREE terminals of a bipolar junction transistor (BJT) and what is the transistor's function in a circuit?",
opts:["Base, Collector, Emitter — a small current into the Base controls a much larger current flowing from Collector to Emitter — used","Gate, Drain, Source — a voltage on the Gate controls current flow — used for high-power switching","Anode, Cathode, Grid — used only in vacuum tube circuits — wrong approach","Input, Output, Ground — the three connection points of any electronic component"],
a:0,exp:"BJT terminals: Base (B), Collector (C), Emitter (E). Operation: a small base current (μA to mA) controls a much larger collector current (mA to A) — current gain (hFE or β) typically 20-500. Two types: NPN (conventional current flows into base and collector, out of emitter) and PNP (opposite). Uses: audio amplifiers, signal switching, motor drivers, logic gates. The BJT was the first practical transistor (Bell Labs 1947)."},

{t:"Electronics & Semiconductors",
q:"What is a MOSFET and how does it differ from a BJT transistor?",
opts:["Metal-Oxide-Semiconductor Field Effect Transistor — a VOLTAGE-controlled device (Gate voltage controls Drain-Source","MOSFET is an older technology than BJT — BJTs are always preferred for modern circuits","MOSFET stands for Motor Operating Semiconductor for Electronic Timing","MOSFET and BJT are identical — just different names for the same component"],
a:0,exp:"MOSFET (Gate, Drain, Source): the Gate is insulated from the channel by a thin oxide layer — virtually zero gate current flows. Gate voltage creates an electric field that controls channel conductivity. Types: N-channel (NMOS) and P-channel (PMOS). Advantages over BJT: higher switching speed, lower on-resistance for same chip size, easy parallel operation, no secondary breakdown. Used in: VSD inverters, switch-mode power supplies, digital logic, microcontrollers, motor drives."},

{t:"Electronics & Semiconductors",
q:"What is a thyristor (SCR — Silicon Controlled Rectifier) and where is it used in electrical installations?",
opts:["A four-layer PNPN semiconductor device with three terminals (Anode, Cathode, Gate) — once","A type of transistor used only in radio frequency circuits","A high-power diode used exclusively in welding equipment","A semiconductor fuse that permanently fails when overcurrent occurs"],
a:0,exp:"Thyristor (SCR): 4-layer PNPN structure. Triggering: gate pulse turns it ON; it then latches ON regardless of gate signal. Turn-off: current must fall below holding current (in AC circuits: happens naturally at each zero crossing). Used in: light dimmers (phase-angle control), motor speed controllers, soft starters, UPS systems, high-current rectifiers. The TRIAC is a bidirectional thyristor (two SCRs in antiparallel) used for AC power control."},

{t:"Electronics & Semiconductors",
q:"What is the purpose of a flyback (freewheeling) diode connected across a relay coil or DC motor in a control circuit?",
opts:["When the coil/motor is de-energised, it generates a large reverse voltage spike (back-EMF) as its","The diode increases the speed at which the relay operates","The diode reduces the current consumption of the coil during normal operation","The diode prevents AC current from flowing through the DC coil"],
a:0,exp:"Inductive kick (back-EMF): when current through an inductor is suddenly interrupted, V = L×di/dt produces a very large voltage spike (potentially hundreds of volts) in the opposite polarity. Without protection this destroys transistors, ICs, and MCBs. Flyback diode: connected reverse-biased during normal operation (no current flows). When coil is switched off: back-EMF forward-biases the diode, providing a low-resistance path for the inductor current to circulate until it dissipates. Spike is clamped to 0.7V."},

{t:"Electronics & Semiconductors",
q:"What is a Light Emitting Diode (LED) and what determines the colour of light it produces?",
opts:["A P-N junction diode made from specific semiconductor compounds — when forward biased, electrons and holes recombine at the junction","LED colour is determined by the plastic lens colour only — the semiconductor is the same for all colours","LEDs produce white light that is filtered to different colours by internal prisms","LED colour depends on the forward current — more current means higher frequency (bluer) light"],
a:0,exp:"LED operation: forward-biased P-N junction. Electrons cross from N to P side and recombine with holes, releasing energy as photons. Photon energy (and thus colour/frequency) = semiconductor band gap energy. Red: GaAsP (~1.8eV, ~700nm). Green: GaP (~2.2eV, ~560nm). Blue: InGaN (~2.7eV, ~460nm). White: blue LED + phosphor coating. Forward voltage varies by colour: red ~1.8V, green ~2.1V, blue ~3.2V. LEDs are current-controlled devices — always need a series resistor."},

{t:"Electronics & Semiconductors",
q:"A 5V supply must drive a red LED (forward voltage 1.8V, maximum current 20mA). Calculate the required series resistor value.",
opts:["160Ω — R = (V_supply − V_LED) / I_LED = (5 − 1.8) / 0.02 =","250Ω — R = V_supply / I_LED = 5 / 0.02 = 250Ω","320Ω — R = (V_supply + V_LED) / I_LED","90Ω — R = V_LED / I_LED = 1.8 / 0.02"],
a:0,exp:"Series resistor limits LED current to safe level. Voltage across resistor = V_supply − V_LED = 5 − 1.8 = 3.2V. R = V_R / I = 3.2 / 0.02 = 160Ω. In practice use next standard value: 180Ω (slightly less than 20mA — safe). Never connect an LED directly to a voltage source without a series resistor — forward resistance is very low and current would destroy it instantly.",calc:true},

{t:"Electronics & Semiconductors",
q:"What is a Zener diode and how is it connected to function as a voltage regulator?",
opts:["A diode designed to operate in reverse breakdown at a precise voltage (Vz) — connected reverse","A diode connected in forward bias to regulate voltage by its forward drop","A diode that only conducts in one direction like a standard rectifier","A diode used exclusively in high-frequency RF circuits"],
a:0,exp:"Zener diode: specially doped to have a precise, stable reverse breakdown voltage (Vz). Unlike normal diodes (destructive breakdown), Zener diodes operate continuously at Vz. Circuit: series resistor from supply to junction; Zener from junction to earth (reverse biased). Zener conducts if V > Vz, pulling output down to Vz. Doesn't conduct if V < Vz. Output = stable Vz. Common values: 3.3V, 5.1V, 5.6V, 6.2V, 9.1V, 12V. Power rating important — Zener dissipates (V_supply − Vz) × I_Zener as heat."},

// ══ MOTOR CONSTRUCTION ══

{t:"Motor Construction",
q:"Name the main constructional components of a 3-phase squirrel cage induction motor and state the function of each.",
opts:["Stator (3-phase windings in laminated iron core — creates rotating magnetic field), Rotor (aluminium/copper bars in laminated core — induced currents create torque), Shaft","Armature (rotating coil), Commutator (reverses current), Brushes (contact commutator), Field coils (static magnets), Frame, Shaft","Stator (permanent magnets), Rotor (electromagnet coils), Slip rings (connect rotor to supply), Brushes, Bearings, Frame","Primary winding (supply), Secondary winding (output), Iron core, Laminations, Terminal box, Cooling fins"],
a:0,exp:"Squirrel cage induction motor construction: STATOR: 3-phase windings embedded in slots of a laminated silicon steel core. 3-phase AC creates a rotating magnetic field (RMF). ROTOR: aluminium (or copper in high-efficiency motors) bars short-circuited by end rings — resembles a squirrel cage. RMF induces currents in rotor bars which interact with RMF to produce torque. LAMINATIONS: thin silicon steel sheets insulated from each other — reduce eddy current losses. No brushes, slip rings, or external rotor connections needed — very robust and low maintenance."},

{t:"Motor Construction",
q:"Why are the stator and rotor cores of an induction motor made from LAMINATED silicon steel rather than solid iron?",
opts:["Laminations reduce eddy current losses — thin insulated sheets force eddy currents to flow in small","Laminations increase the motor's magnetic flux — more iron = more flux = more torque","Laminated cores are cheaper to manufacture than solid iron blocks","Laminations reduce the weight of the motor without affecting performance"],
a:0,exp:"Two types of core loss: (1) Eddy current loss: the changing magnetic flux induces circulating currents in the iron. Solid iron = large loops, low resistance, high eddy currents = high losses. Laminations = small isolated loops, high resistance, low eddy currents. (2) Hysteresis loss: energy lost reversing magnetic domains with each cycle. Silicon steel (typically 3-4% silicon) has narrow hysteresis loop = lower hysteresis loss. Both losses appear as heat: reduce efficiency, increase operating temperature, require larger frames."},

{t:"Motor Construction",
q:"Explain the construction difference between a squirrel cage rotor and a wound rotor (slip-ring rotor) induction motor.",
opts:["Squirrel cage: aluminium/copper bars in rotor slots, short-circuited by end rings — simple,","Squirrel cage uses permanent magnets; wound rotor uses electromagnets","Squirrel cage rotor is stationary; wound rotor rotates — they are opposite","Both have identical rotors — the difference is in the stator winding only"],
a:0,exp:"Squirrel cage rotor: cast aluminium (or fabricated copper) bars in rotor core slots, connected at each end by aluminium/copper end rings. Simple, rugged, zero maintenance, low cost. Cannot connect external resistance. Used for most industrial motors. Wound rotor: full 3-phase winding in rotor slots, star-connected, with three terminals brought to external slip rings. Brushes on slip rings allow external resistance connection. Higher starting torque, speed control capability, but higher cost and maintenance. Used for heavy starting loads (crushers, hoists, mills)."},

{t:"Motor Construction",
q:"What is the air gap in an induction motor and why must it be kept as small as possible?",
opts:["The physical gap between the stator bore and the rotor surface — it must be small (typically 0.3-1mm for small motors) because the","The air gap is the space between windings inside the stator — it provides insulation","The air gap is the clearance between the rotor shaft and the end shields — needed for thermal expansion","The air gap must be large (5-10mm) to prevent mechanical contact between stator and rotor"],
a:0,exp:"Air gap (0.3-1mm small motors, up to 2-3mm large motors): magnetic flux must cross from stator to rotor across this gap. Air has much higher reluctance than iron — a larger gap requires much more magnetising current (reactive current) to drive the same flux. High magnetising current = poor power factor (typically 0.1-0.4 at no load). A very small air gap is preferred but requires precise manufacturing — if too small, rotor may rub stator during thermal expansion or bearing wear. The air gap explains why induction motors have naturally poor power factor at light loads."},

{t:"Motor Construction",
q:"What is a DC motor's COMMUTATOR and how does it work?",
opts:["A cylindrical assembly of copper segments on the rotor shaft, each connected to armature coil ends.","The commutator is a type of relay that reverses supply polarity automatically","The commutator stores magnetic energy during motor starting","The commutator is a centrifugal switch that disconnects the start winding"],
a:0,exp:"DC motor commutator: each copper segment is connected to one end of an armature coil. Carbon brushes (held stationary) press on the rotating commutator. As a coil passes through the neutral plane (where it would produce zero or reversed torque), the commutator segments slide from one brush to the next — reversing current direction in that coil. This keeps ALL armature conductors producing torque in the same direction regardless of armature position. The commutator is the key difference between DC and AC motors — it enables unidirectional torque from DC supply."},

{t:"Motor Construction",
q:"What are carbon brushes in a DC motor or generator, what are they made of, and why does the material matter?",
opts:["Carbon brushes press against the commutator to conduct current between the static external circuit and","Brushes are made of copper wire — same as the armature windings","Brushes are aluminium contacts that press against slip rings only in AC motors","Brushes are permanent magnets that interact with the armature current"],
a:0,exp:"Carbon brush composition: typically carbon-graphite or electrographite, sometimes with copper powder for lower resistance. Properties that matter: (1) Self-lubricating: graphite flakes reduce friction on commutator. (2) Controlled wear: softer than copper commutator — brushes wear and are replaceable; commutator preserved. (3) Low contact resistance despite being in air. (4) Good current density capacity. (5) Handles arcing from commutation. Regular maintenance: inspect and replace brushes when worn to minimum length; clean commutator of carbon dust."},

{t:"Motor Construction",
q:"State the purpose of the centrifugal switch found in many single-phase induction motors.",
opts:["Disconnects the start capacitor and/or auxiliary starting winding from the circuit once the motor reaches","The centrifugal switch increases motor speed when load is applied","The centrifugal switch is a safety device that trips if the motor overheats","The centrifugal switch connects the start winding once the motor reaches full speed"],
a:0,exp:"Single-phase motors cannot self-start using only the main winding (single-phase field pulsates, doesn't rotate). The auxiliary start winding (with capacitor or resistance to create phase shift) provides starting torque. Once running at 70-80% synchronous speed: (1) Starting assistance is no longer needed. (2) The start winding/capacitor would overheat if left continuously connected (designed for short-time duty). The centrifugal switch: weights on the rotor shaft fly outward at running speed, mechanically opening the start winding circuit. Motor then runs on main winding alone."},

{t:"Motor Construction",
q:"What is the purpose of skewing the rotor bars in a squirrel cage induction motor?",
opts:["Rotor bars are twisted slightly along the rotor length — this reduces cogging (irregular","Skewing increases the motor's starting torque significantly","Skewing allows the motor to run in both directions equally","Skewing is done to increase the air gap flux and improve power factor"],
a:0,exp:"Skewing (typically 1-2 slot pitches): rotor bars run at a slight angle to the shaft axis rather than perfectly parallel. Without skewing: as rotor slots align with stator slots during rotation, the reluctance changes periodically, causing cogging torque pulsations, noise, and vibration. Skewing ensures that at any instant, each rotor bar is aligned with slightly different stator slot positions — averaging out the reluctance variation. Result: smooth, quiet running. Also reduces harmonic voltages in the rotor. Used in virtually all squirrel cage motors above fractional horsepower."},

,

// ══ TRUE OR FALSE QUESTIONS ══

// ── NZ Supply & MEN ──
{t:"True or False",q:"TRUE or FALSE: In New Zealand's MEN system, the neutral conductor is connected to earth at the main switchboard of every installation.",opts:["TRUE — the MEN (Multiple Earth Neutral) link bonds neutral to earth at every installation's main switchboard, and also at","FALSE — the neutral is only earthed at the supply transformer, not at individual installations","FALSE — the neutral must remain isolated from earth throughout the entire distribution network","FALSE — only industrial installations are required to have a MEN link"],a:0,exp:"TRUE. MEN = Multiple Earth Neutral. The neutral is earthed at the supply transformer star point AND at every consumer installation's main switchboard via the MEN link (the N-E bond). This provides the low-impedance fault return path essential for protective device operation."},

{t:"True or False",q:"TRUE or FALSE: The line voltage in a three-phase star system equals the phase voltage multiplied by √3.",opts:["TRUE — VL = √3 × Vph. At 230V phase voltage: VL = 1.732 × 230 = 398V ≈ 400V — this is the","FALSE — VL = 3 × Vph in a star system — this is incorrect","FALSE — VL = Vph in a star system — line and phase voltages are identical","FALSE — VL = Vph / √3 in a star system — not applicable"],a:0,exp:"TRUE. In a star (wye) system: VL = √3 × Vph. The 30° angular relationship between line and phase voltage phasors gives the √3 factor. NZ example: 230V phase × 1.732 = 398.4V ≈ 400V line voltage.",calc:true},

{t:"True or False",q:"TRUE or FALSE: In a balanced three-phase star system the neutral conductor carries zero current.",opts:["TRUE — in a perfectly balanced load (equal currents, 120° apart) the three phase currents","FALSE — the neutral always carries current equal to the phase current","FALSE — the neutral carries the sum of all three phase currents","FALSE — neutral current equals one-third of the phase current"],a:0,exp:"TRUE. In a balanced 3-phase star load, the three phasor currents (equal magnitude, 120° apart) add vectorially to zero. Neutral current = 0. This is why balanced 3-phase systems are efficient — the neutral can be small or omitted. Unbalanced loads produce neutral current proportional to the imbalance."},

// ── Electrical Protection ──
{t:"True or False",q:"TRUE or FALSE: An HRC fuse can be reset after it has operated — you simply reset the mechanism like an MCB.",opts:["FALSE — HRC fuses are single-use devices. Once operated, the element is destroyed and the fuse must be replaced with a new","TRUE — HRC fuses have a reset button on the side that restores them after a fault","TRUE — the element can be replaced in the field using a fuse repair kit","FALSE — HRC fuses cannot be replaced once operated — the entire fuse holder must be replaced"],a:0,exp:"FALSE. HRC (High Rupturing Capacity) fuses are sacrificial devices — the element melts and the sand filler absorbs the arc energy. Once operated, the cartridge is destroyed and must be replaced with an identical new cartridge (same voltage, current, and type rating). This is a disadvantage vs MCBs which can be reset, but HRC fuses have much higher rupturing capacity."},

{t:"True or False",q:"TRUE or FALSE: A Type C MCB trips instantaneously at 5 to 10 times its rated current.",opts:["TRUE — Type C: instantaneous magnetic trip at 5–10× In. Designed for loads with","FALSE — Type C trips at 2–3× rated current instantaneously","FALSE — Type C has no instantaneous trip — it is thermal only","FALSE — Type C trips at 10–20× rated current, same as Type D"],a:0,exp:"TRUE. MCB instantaneous trip characteristics: Type B = 3–5× In (resistive loads, domestic). Type C = 5–10× In (motors, transformers, fluorescent). Type D = 10–20× In (heavy inductive loads, large transformers). The instantaneous trip responds to the magnetic effect of high fault current — below the trip threshold it relies on the slower thermal element."},

{t:"True or False",q:"TRUE or FALSE: The prospective short-circuit current (PSCC) increases as you move further away from the supply transformer along a cable.",opts:["FALSE — PSCC DECREASES with distance. More cable = more impedance = less fault current. PSCC is","TRUE — fault current builds up along long cable runs","TRUE — longer cables have more stored energy that increases fault current","FALSE — PSCC is constant throughout an installation regardless of distance"],a:0,exp:"FALSE. PSCC = V/Zs. As you move downstream: Zs increases (more cable resistance/reactance in the loop). More Zs = less fault current = lower PSCC. This is why: (1) Main switchboard devices need highest rupturing capacity. (2) Sub-boards and final circuits have lower PSCC. (3) Protection may be adequate at the main board but inadequate at extremities for rapid disconnection."},

// ── Transformers ──
{t:"True or False",q:"TRUE or FALSE: A transformer can operate on DC supply.",opts:["FALSE — transformers only work on AC. DC produces constant (non-changing)","TRUE — transformers work on both AC and DC supply","TRUE — but only if the DC is pulsating (ripple DC)","FALSE — only because DC has different colour-coded cables"],a:0,exp:"FALSE. Transformer action requires CHANGING magnetic flux (dΦ/dt). AC supply: flux changes continuously (50Hz) → EMF induced in secondary. DC supply: flux is constant after initial transient → dΦ/dt = 0 → no secondary EMF. The primary winding on DC is just a resistance — very high current flows (limited only by winding resistance, not inductive reactance) causing overheating and core saturation within seconds."},

{t:"True or False",q:"TRUE or FALSE: A transformer's kVA rating represents its maximum power output in kilowatts at unity power factor.",opts:["TRUE — at unity power factor (pf = 1.0), kVA = kW. The kVA rating is the maximum apparent","FALSE — kVA is always greater than kW regardless of power factor","FALSE — kVA rating is only relevant for single-phase transformers","FALSE — the kVA rating is the no-load rating and reduces under load"],a:0,exp:"TRUE (with qualification). kVA = maximum apparent power. kW = kVA × power factor. At pf=1.0: kW = kVA. At pf=0.8: kW = 0.8 × kVA. Transformers are rated in kVA (not kW) because their thermal losses (copper and iron) depend on voltage and current — NOT on power factor. A 100kVA transformer delivers the same current (and has the same losses) whether the load is resistive (pf=1) or inductive (pf=0.7)."},

{t:"True or False",q:"TRUE or FALSE: The secondary winding of a current transformer (CT) must never be left open-circuit while the primary carries current.",opts:["TRUE — with no secondary burden, all primary MMF drives core flux to saturation level, inducing dangerously","FALSE — it is safe to leave the CT secondary open when not in use","FALSE — the CT secondary can be left open as long as primary current is below 100A","FALSE — only applies to voltage transformers, not current transformers"],a:0,exp:"TRUE. Normal CT: secondary MMF nearly cancels primary MMF, keeping core flux low. Open secondary: no secondary current → no opposing MMF → primary MMF drives core into saturation. The flux changes produce very high induced voltage in the secondary (can be thousands of volts even with low primary current). This is a serious hazard. If removing CT secondary connections: ALWAYS short-circuit the secondary terminals first. Never open-circuit an energised CT."},

// ── Motors & Starters ──
{t:"True or False",q:"TRUE or FALSE: A star-delta starter reduces the starting current to one-third of the DOL starting current.",opts:["TRUE — in star, each winding sees VL/√3 (phase voltage). Starting current in star =","FALSE — star-delta reduces starting current to 1/√3 (58%) of DOL","FALSE — star-delta reduces starting current to half of DOL","TRUE — star-delta reduces current to 1/3 and torque to 2/3 of DOL"],a:0,exp:"TRUE. Star starting: each winding voltage = VL/√3. Current ∝ V², so: I_star = I_DOL × (1/√3)² = I_DOL/3. Similarly torque_star = torque_DOL/3. A DOL motor drawing 300A starting current will draw only 100A with star-delta. The trade-off: starting torque is also 1/3 — unsuitable for high-inertia or loaded starts."},

{t:"True or False",q:"TRUE or FALSE: An induction motor can achieve synchronous speed during normal operation.",opts:["FALSE — at synchronous speed, slip = 0, rotor conductors see no relative motion with respect to the rotating","TRUE — well-designed induction motors reach exactly synchronous speed at full load","TRUE — synchronous speed is the normal running speed of all AC induction motors","FALSE — induction motors always run above synchronous speed"],a:0,exp:"FALSE. Induction motor operation requires slip (the difference between synchronous and rotor speed). Slip creates relative motion between rotating field and rotor → induces rotor EMF → rotor current → torque. At synchronous speed: relative motion = 0 → no induced EMF → no current → no torque. The motor would slow down immediately under any load. Typical full-load slip: 2-8% (1500rpm motor runs at ~1440-1470rpm at full load)."},

{t:"True or False",q:"TRUE or FALSE: Reversing the rotation of a three-phase induction motor requires swapping any two of the three supply phase conductors.",opts:["TRUE — swapping any two phases reverses the phase sequence (RYB → RBY) which reverses the direction of","FALSE — all three phases must be swapped to reverse rotation","FALSE — rotation is reversed by changing the motor's internal connections only","FALSE — a three-phase motor cannot be reversed — it only runs in one direction"],a:0,exp:"TRUE. 3-phase induction motor rotation direction is determined by phase sequence. Swapping ANY two phases reverses the sequence (e.g. R-Y-B becomes R-B-Y) which reverses the direction of the rotating magnetic field, reversing rotor rotation. This is the standard method for reversing 3-phase motors. A reversing contactor does exactly this — it has two contactors, one for forward (direct connection) and one for reverse (two phases swapped), with mechanical and electrical interlocking."},

// ── RCDs ──
{t:"True or False",q:"TRUE or FALSE: An RCD will protect against electric shock if a person touches both the phase and neutral conductors simultaneously.",opts:["FALSE — an RCD detects IMBALANCE between phase and neutral current (earth leakage). If a person","TRUE — any current through a person will cause the RCD to trip immediately","TRUE — touching phase and neutral always creates earth leakage","FALSE — RCDs only protect against voltage surges, not electric shock"],a:0,exp:"FALSE. This is a critical safety point. RCD measures: I_phase − I_neutral. If both conductors are touched: current flows phase → person → neutral. The RCD sees equal current in both conductors (no imbalance) → does NOT trip. The person receives the full shock. RCDs only protect when current takes a PATH TO EARTH outside the normal neutral return. This is why RCDs do not replace the need for isolation before working on circuits."},

{t:"True or False",q:"TRUE or FALSE: A 30mA RCD provides complete protection against all electric shock situations.",opts:["FALSE — 30mA may still cause ventricular fibrillation in some individuals. It provides SIGNIFICANT but","TRUE — 30mA is internationally recognised as the threshold for complete safety","TRUE — 30mA RCDs are designed to prevent all electric shock injuries","FALSE — only 10mA RCDs provide any meaningful protection against shock"],a:0,exp:"FALSE. 30mA is below the ventricular fibrillation threshold for most adults (~50-100mA) but: (1) Some individuals (especially children, those with heart conditions) can fibrillate at lower currents. (2) Trip time is up to 300ms — long enough to cause significant injury. (3) Does not protect phase-to-neutral contact. (4) Does not prevent severe burns. 30mA is the STANDARD personal protection level — it significantly reduces risk but provides no absolute guarantee. 10mA is used in higher-risk areas."},

// ── Testing ──
{t:"True or False",q:"TRUE or FALSE: Insulation resistance testing should be carried out with all equipment connected to the circuit.",opts:["FALSE — equipment such as electronic devices, sensitive instruments, and MIMS elements should be disconnected","TRUE — equipment must remain connected for the test to be valid","TRUE — disconnecting equipment gives falsely high readings that are not representative","FALSE — IR testing cannot be done on circuits that have ever had equipment connected"],a:0,exp:"FALSE (with exception). General rule: disconnect all equipment before IR testing. Reason: 500V DC test voltage can damage electronic components (capacitors, transistors, ICs, LED drivers). However: MIMS (mineral insulated) heating elements can remain connected — their inherent IR is low by design, and the minimum acceptable result changes from 1MΩ to 0.01MΩ. Always check what is connected before applying the test voltage."},

{t:"True or False",q:"TRUE or FALSE: The earth fault loop impedance test at a socket outlet should be conducted with the circuit energised at normal supply voltage.",opts:["TRUE — the loop impedance tester injects a test current into the live circuit and measures","FALSE — the test is only possible with the circuit de-energised","FALSE — earth fault loop impedance is calculated from IR test results","TRUE — but only if the RCD has been bypassed first"],a:0,exp:"TRUE. Earth fault loop impedance testers work by applying a brief test current (typically at 50Hz) between phase and earth of the live circuit, measuring the voltage drop, and calculating Zs. The circuit MUST be energised. Safe working precautions apply: use insulated test leads, avoid contact with live parts, ensure test instrument is rated for the voltage. Most modern testers have built-in RCD detection to warn if an RCD is present (which would trip during the test)."},

// ── Health & Safety ──
{t:"True or False",q:"TRUE or FALSE: Under HSWA 2015, a worker has the right to refuse work they believe is unsafe, even if their employer directs them to proceed.",opts:["TRUE — Section 83 of HSWA gives workers the right to cease or refuse work if they believe it poses a serious risk","FALSE — workers must always follow employer instructions regardless of safety concerns","FALSE — only Health and Safety Representatives can refuse work on behalf of workers","TRUE — but only if the worker is also a PCBU — wrong theory"],a:0,exp:"TRUE. HSWA Section 83: a worker can cease or refuse to carry out work if they have reasonable cause to believe it would expose them or others to a serious risk to health or safety from an immediate or imminent hazard. Workers cannot be dismissed or disadvantaged for exercising this right in good faith. This is an important protection — an electrician can legally refuse to perform live work without adequate controls."},

{t:"True or False",q:"TRUE or FALSE: A Danger Tag can be removed by any competent person on site if the worker who placed it cannot be contacted.",opts:["FALSE — a Danger Tag is a personal tag. Only the person who placed the tag can","TRUE — any supervisor can remove a Danger Tag in an emergency","TRUE — Danger Tags can always be removed by the site foreman","FALSE — Danger Tags can only be removed by a WorkSafe inspector"],a:0,exp:"FALSE. The entire purpose of personal Danger Tags is that ONLY the person named on the tag can remove it — this guarantees they have personally confirmed they are clear of the equipment. Unauthorised removal could result in a worker being killed. Exception: formal documented management procedures exist for situations where a worker is incapacitated, has left site, or cannot be contacted — but these require documented authorisation, confirmation the worker is not on the equipment, and notification to the worker."},

{t:"True or False",q:"TRUE or FALSE: Under HSWA 2015, only large companies with more than 20 employees are required to have health and safety systems in place.",opts:["FALSE — ALL PCBUs (including sole traders and self-employed electricians) have health and safety duties","TRUE — small businesses under 20 employees are exempt from HSWA","TRUE — only companies with more than 5 employees need written H&S documentation","FALSE — HSWA only applies to registered companies, not sole traders"],a:0,exp:"FALSE. HSWA applies to ALL PCBUs — including self-employed sole traders. A self-employed electrician is a PCBU with duties to: themselves as a worker, other workers they engage (apprentices, subcontractors), and people affected by their work (homeowners, bystanders). Size affects WHAT is reasonably practicable (resources available) but not WHETHER duties apply. A self-employed electrician must still manage hazards, maintain tools safely, and have some form of H&S management."},

// ── Electricity Act & Regulations ──
{t:"True or False",q:"TRUE or FALSE: A homeowner can legally install a new power point (socket outlet) in their own home without being a registered electrical worker.",opts:["FALSE — installing a new socket outlet is general risk prescribed electrical work (PEW) under the Electricity","TRUE — homeowners can do any electrical work in their own home","TRUE — installing a power point is considered 'low risk' and anyone can do it","FALSE — homeowners must get council approval but do not need a registered electrician"],a:0,exp:"FALSE. Socket outlet installation = general risk PEW. Requires a registered electrician. Exceptions are very limited — the homeowner exemption covers only replacement of approved components (like-for-like replacement of fittings in the same location, no new circuits, no additional load). A new socket outlet in a new location = new wiring = PEW. Penalty for performing PEW without registration: fine up to $10,000 individual."},

{t:"True or False",q:"TRUE or FALSE: A Certificate of Compliance (CoC) is required for ALL prescribed electrical work, including replacing a faulty light switch.",opts:["FALSE — replacing a light switch is LOW RISK prescribed electrical work. It requires only an","TRUE — a CoC is always required for any PEW regardless of complexity","TRUE — all PEW requires both a CoC and an ESC without exception","FALSE — replacing a light switch does not require any documentation at all"],a:0,exp:"FALSE. PEW certification requirements: LOW RISK (replacement of existing fittings — same location, same load): ESC only. GENERAL RISK (new circuits, rewiring, new fitout): CoC + ESC. HIGH RISK (consumer substations, generating sets): RoI + CoC + ESC. Replacing a light switch is low risk → ESC only. This is one of the most commonly confused aspects of the Regulations."},

// ── AC Theory ──
{t:"True or False",q:"TRUE or FALSE: In a purely resistive AC circuit, voltage and current are in phase with each other.",opts:["TRUE — a pure resistor has no reactance. Ohm's Law applies instantaneously at all","FALSE — in all AC circuits current lags voltage by 90°","FALSE — current always leads voltage in resistive circuits by 45°","TRUE — but only if the frequency is exactly 50Hz"],a:0,exp:"TRUE. Pure resistance: no inductance (no magnetic field storage), no capacitance (no electric field storage). The resistor responds instantaneously to voltage — current is exactly proportional to voltage at every instant. Phase angle φ = 0°. Power factor = cos(0°) = 1.0. This is why heaters, incandescent lamps, and other purely resistive loads have unity power factor."},

{t:"True or False",q:"TRUE or FALSE: In a purely inductive circuit, current LAGS voltage by 90 degrees.",opts:["TRUE — an inductor stores energy in a magnetic field. When voltage is applied it takes time for current to","FALSE — in inductive circuits current LEADS voltage by 90°","FALSE — inductive circuits have a phase angle of 45° between voltage and current","TRUE — but only if the inductance is greater than 1 Henry"],a:0,exp:"TRUE. Pure inductor: V = L×dI/dt → the voltage leads the current (or current lags voltage) by exactly 90°. Memory aid: ELI the ICE man — in an inductive circuit (L), EMF (E) leads Current (I). In a capacitive circuit (C), Current (I) leads EMF (E). Purely inductive circuit: power factor = 0, no real power consumed — only reactive power (energy stored and returned each cycle)."},

{t:"True or False",q:"TRUE or FALSE: Adding power factor correction capacitors to an inductive load REDUCES the total current drawn from the supply.",opts:["TRUE — capacitors supply the reactive (magnetising) current locally. The supply only needs to provide","FALSE — capacitors increase total current because they draw their own current","FALSE — capacitors only affect voltage, not current","TRUE — but only if the capacitors are exactly matched to the load"],a:0,exp:"TRUE. Inductive loads draw lagging reactive current from the supply. Capacitors draw leading reactive current. These partially cancel in the supply conductors. The supply only needs to carry the remaining real power current plus any uncorrected reactive current. Example: 50kW load at pf 0.6 → supply current proportional to 83.3kVA. After correction to pf 0.95 → supply current proportional to 52.6kVA — 37% reduction. Cable losses (I²R) reduce by (37%)² = 60%."},

// ── Atomic Theory ──
{t:"True or False",q:"TRUE or FALSE: Copper has a lower resistivity than aluminium, which is why copper conductors of the same CSA carry more current than aluminium.",opts:["TRUE — copper resistivity 1.72×10⁻⁸ Ω·m vs aluminium 2.82×10⁻⁸ Ω·m. Copper is 64% more conductive.","FALSE — aluminium is more conductive than copper at higher temperatures","FALSE — both metals have identical resistivity — only physical size differs","TRUE — but only because copper is heavier than aluminium"],a:0,exp:"TRUE. Copper resistivity = 1.72×10⁻⁸ Ω·m. Aluminium = 2.82×10⁻⁸ Ω·m. Ratio = 2.82/1.72 = 1.64 — aluminium is 64% more resistive. For equivalent resistance: A_al = A_cu × 1.64. A 16mm² copper conductor is roughly equivalent to 25mm² aluminium. Overhead transmission lines use aluminium (ACSR — aluminium conductor steel reinforced) because the weight saving outweighs the larger cross-section needed."},

{t:"True or False",q:"TRUE or FALSE: The resistance of a copper conductor increases as its temperature rises.",opts:["TRUE — copper has a positive temperature coefficient of resistance (α = 0.00393/°C). Rising","FALSE — copper resistance decreases with temperature like a semiconductor","FALSE — copper resistance is constant regardless of temperature","TRUE — but only above 100°C, not at normal operating temperatures"],a:0,exp:"TRUE. Metals have POSITIVE temperature coefficient of resistance. As temperature rises: copper atoms vibrate more energetically → electrons collide with atoms more frequently → more resistance to electron flow. At 75°C (max conductor temp for standard PVC insulation): R₇₅ = R₂₀ × (1 + 0.00393×55) = R₂₀ × 1.216. This 21.6% increase is why AS/NZS 3000 cable tables specify resistance at 75°C for worst-case voltage drop calculations."},

// ── Motor Construction ──
{t:"True or False",q:"TRUE or FALSE: A squirrel cage induction motor has brushes that require regular replacement.",opts:["FALSE — squirrel cage induction motors have NO brushes, NO commutator, and NO slip rings. The","TRUE — brushes are required to supply current to the squirrel cage rotor","TRUE — but only in motors above 15kW output power","FALSE — squirrel cage motors have slip rings instead of brushes"],a:0,exp:"FALSE. This is one of the greatest advantages of squirrel cage induction motors. No brushes, no commutator, no slip rings — the rotor is completely self-contained. Rotor current is induced by the rotating magnetic field from the stator — no physical connection needed. Maintenance is limited to: bearing lubrication/replacement, visual inspection of windings, and checking terminal connections. Compare with DC motors or wound-rotor motors that require regular brush inspection and replacement."},

// ── Electronics ──
{t:"True or False",q:"TRUE or FALSE: An LED (Light Emitting Diode) can be connected directly across a 5V supply without any series resistor.",opts:["FALSE — an LED is a diode with very low forward resistance once conducting. Without a series resistor to","TRUE — LEDs are designed to connect directly to standard supply voltages","TRUE — if the supply voltage equals the LED forward voltage no resistor is needed","FALSE — LEDs require a capacitor in series, not a resistor"],a:0,exp:"FALSE. An LED's V-I characteristic is highly non-linear — above the forward voltage (1.8-3.5V depending on colour) its resistance drops dramatically. A 5V supply with no series resistor: the LED forward voltage is ~2V, leaving 3V across near-zero resistance → enormous current → instant destruction. Series resistor: R = (V_supply − V_f) / I_rated. For 5V, red LED (V_f=1.8V), 20mA: R = (5-1.8)/0.02 = 160Ω. Without this resistor the LED fails in milliseconds."},

{t:"True or False",q:"TRUE or FALSE: A thyristor (SCR) once triggered ON can be turned OFF by removing the gate signal.",opts:["FALSE — a thyristor LATCHES on once triggered. Removing the gate signal does NOT turn it off. It continues","TRUE — the gate signal controls both turn-on and turn-off of the SCR","TRUE — removing gate current always causes the SCR to return to blocking state","FALSE — thyristors can only be turned off by physically removing them from the circuit"],a:0,exp:"FALSE. SCR (Silicon Controlled Rectifier) operation: once triggered ON by a gate pulse, the PNPN structure latches — the device maintains a self-sustaining conducting path independent of the gate. Turn-off (commutation) requires: (1) AC circuit: natural commutation — current reversal at zero crossing extinguishes the arc. (2) DC circuit: forced commutation — an external circuit must force anode current below holding current. This latching property makes SCRs ideal for power control in AC circuits (light dimmers, motor controllers) where natural commutation occurs automatically."},

// ── Resistor Colour Codes ──
{t:"True or False",q:"TRUE or FALSE: A gold tolerance band on a resistor means the actual value is within ±5% of the marked value.",opts:["TRUE — Gold = ±5% tolerance. A 10kΩ ±5% resistor has an actual value between 9,500Ω and","FALSE — Gold means ±10% tolerance on resistors","FALSE — Gold indicates a multiplier of ×0.1 only, not a tolerance band","TRUE — but only for resistors manufactured after 2010"],a:0,exp:"TRUE. Tolerance band colours: Gold = ±5%, Silver = ±10%, None = ±20%. For a 10kΩ Gold resistor: min = 9,500Ω, max = 10,500Ω. Precision 5-band resistors: Brown = ±1% (most common precision resistors), Red = ±2%, Green = ±0.5%, Blue = ±0.25%, Violet = ±0.1%. Note: Gold and Silver are also used as multiplier bands in 4-band codes (Gold = ×0.1, Silver = ×0.01) for values below 10Ω."},

// ══ REGULATIONS & LEGISLATION — WHAT GOVERNS ELECTRICIANS ══

// ── The legislative framework ──
{t:"Regulations & Legislation",
q:"State the THREE pieces of primary legislation/regulation that govern the work of a registered electrician in New Zealand.",
opts:["Electricity Act 1992 (registration/licensing/offences), Electricity (Safety) Regulations 2010 (PEW, certification,","Building Act 2004, Resource Management Act 1991, and Health and Safety at Work Act 2015","AS/NZS 3000 Wiring Rules, Electricity Act 1992, and the Commerce Act","HSWA 2015, WorkSafe NZ Act, and the Employment Relations Act"],
a:0,exp:"The three pillars: (1) Electricity Act 1992 — establishes the EWRB, defines registration classes, licences, and disciplinary offences. (2) Electricity (Safety) Regulations 2010 — defines prescribed electrical work (PEW), risk categories, certification requirements (CoC, ESC), testing, and supervision. (3) HSWA 2015 — imposes duty of care on all PCBUs including electricians to manage health and safety risks."},

{t:"Regulations & Legislation",
q:"Under the Electricity Act 1992, what body is responsible for registering electrical workers and what are its main functions?",
opts:["The Electrical Workers Registration Board (EWRB) — registers and licenses electrical workers, sets examination requirements (via ASPEQ), investigates","The Ministry of Business, Innovation and Employment (MBIE) — directly registers all tradespeople including electricians","WorkSafe NZ — registers electrical workers and enforces safety standards on all worksites","The Energy Efficiency and Conservation Authority (EECA) — manages registration and sets efficiency standards"],
a:0,exp:"The EWRB (Electrical Workers Registration Board) is the statutory body established under the Electricity Act 1992. Functions: (1) Maintain the register of electrical workers. (2) Set examination requirements through ASPEQ. (3) Grant, renew, suspend, and cancel registration and practising licences. (4) Investigate complaints against registered workers. (5) Take disciplinary action under Section 143. (6) Promote competence and public safety."},

{t:"Regulations & Legislation",
q:"Under the Electricity (Safety) Regulations 2010, what is 'prescribed electrical work' (PEW) and name THREE examples.",
opts:["Electrical work on fixed wiring and electrical installations that must be done by a registered electrician — examples: installing new circuits,","Any work involving electricity including changing light bulbs, resetting MCBs, and replacing plug-top fuses","Only work on high-voltage systems above 1000V — low-voltage domestic work is not prescribed","Only work on commercial and industrial sites — domestic work is exempt from PEW requirements"],
a:0,exp:"PEW = work on electrical installations, fixed wiring, and connected equipment (Reg 4). Examples: installing new circuits or sub-boards, rewiring, connecting fixed appliances, installing/replacing switchboards, adding socket outlets, testing and certifying installations. NOT PEW: replacing plug-top fuses, changing light bulbs, resetting MCBs, or replacing approved fittings on a like-for-like basis in the same location by the owner."},

{t:"Regulations & Legislation",
q:"What are the THREE risk categories of prescribed electrical work under the Electricity (Safety) Regulations 2010, and what certification is required for each?",
opts:["Low risk: ESC only. General risk: CoC + ESC. High risk: Record of Inspection (RoI) + CoC + ESC","Low risk: no documentation. General risk: CoC only. High risk: CoC + ESC","All three categories require the same documentation: CoC and ESC","Low risk: verbal confirmation. General risk: ESC only. High risk: CoC only"],
a:0,exp:"Risk categories and certification: LOW RISK (replacement/repair of existing fittings in same location, no load increase): ESC only. GENERAL RISK (new circuits, rewiring, new fitout work): Certificate of Compliance (CoC) + Electrical Safety Certificate (ESC). HIGH RISK (consumer substations, generating sets, complex high-risk installations): Record of Inspection (RoI) + CoC + ESC. The ESC certifies the work is safe; the CoC certifies it complies with regulations."},

{t:"Regulations & Legislation",
q:"Under Regulation 74A, within what timeframe must an Electrical Safety Certificate (ESC) be provided to the person who contracted the work?",
opts:["As soon as practicable after the work is connected to supply, and no later than 20 WORKING DAYS after connection","Within 30 calendar days of completing the work — this is incorrect","Within 7 working days for commercial work and 30 days for domestic","Within 5 working days — failure to comply is not a disciplinary offence but may result in a fine"],
a:0,exp:"Regulation 74A: the ESC must be provided as soon as practicable and in any case no later than 20 WORKING DAYS after the work is connected to the power supply. Working days excludes weekends and public holidays. Failure to provide within 20 working days is a breach of the Regulations and a potential disciplinary offence under Section 143 of the Electricity Act 1992. The same 20-working-day rule applies to the CoC under Regulation 65."},

{t:"Regulations & Legislation",
q:"Under Regulation 65 of the Electricity (Safety) Regulations 2010, to whom must copies of the Certificate of Compliance be provided?",
opts:["To the person who contracted or authorised the work, as soon as practicable and","To WorkSafe NZ only — not applicable — this does not comply with NZ electrical regulations","To the EWRB for inclusion in the national compliance register","To the local council and the supply authority"],
a:0,exp:"Regulation 65: the CoC must be provided to the CONTRACTING PERSON (the person who engaged the electrician) as soon as practicable, and within 20 working days. If the contracting person cannot be contacted, it goes to the OWNER or OCCUPIER. The electrician keeps a copy. For non-consented small standalone dwellings, copies go to both contracting person AND owner/occupier. Records must be kept for the period specified in the Regulations."},

{t:"Regulations & Legislation",
q:"Section 143 of the Electricity Act 1992 sets out disciplinary offences. Name FOUR actions that could lead to EWRB disciplinary action against a registered electrician.",
opts:["Negligently creating risk of harm, carrying out PEW without authorisation, providing false/misleading","Only criminal convictions can lead to EWRB disciplinary action","Disciplinary action only applies to trainee electricians, not registered workers","Only a court can take disciplinary action — the EWRB has no power to discipline"],
a:0,exp:"Section 143 disciplinary grounds include: (a) conviction of offence reflecting adversely on fitness as an electrical worker, (b) negligently creating risk of serious harm, (c) incompetent performance of PEW, (d) failure to comply with EWRB lawful direction, (e) breach of the Act or Regulations, (f) providing false or misleading certification, (g) conduct likely to bring the profession into disrepute. Penalties: reprimand, fine, conditions on licence, suspension, or cancellation of registration."},

{t:"Regulations & Legislation",
q:"Under the Electricity Act 1992, what is the difference between 'registration' and a 'practising licence'?",
opts:["Registration is the permanent record on the EWRB register of your class and scope of work. A practising licence (renewed annually by paying the","Registration and practising licence are the same thing — just different terms","Registration is for full electricians only; practising licences are for trainees","A practising licence is only required for high-risk PEW — general and low-risk work only needs registration"],
a:0,exp:"Two separate requirements: REGISTRATION — entry in the EWRB register showing class (e.g. Electrician), scope of work, and conditions. Permanent until surrendered, suspended, or cancelled. PRACTISING LICENCE — annual authorisation to perform PEW. Requires payment of the annual levy. Without a current licence you CANNOT legally perform PEW even if registered. An analogy: driving licence (registration of competence) vs vehicle registration (annual permission to operate). Both required."},

{t:"Regulations & Legislation",
q:"A trainee electrician holds a Trainee Limited Certificate (TLC). Under the Regulations, what does 'direct supervision' require?",
opts:["The supervising registered electrician must be on the SAME SITE and readily available to give immediate assistance —","The supervisor only needs to be reachable by phone while the trainee works independently","The supervisor must be present at all times standing next to the trainee for every task","The trainee can work unsupervised after completing their first year of training"],
a:0,exp:"Direct supervision requirements (Regulation 74A(3)(f)): (1) Supervisor must be on the same site. (2) Readily available to give immediate assistance. (3) Responsible for the quality and safety of the trainee's work. (4) Must sign and date the ESC, including their EWRB registration number. The trainee cannot issue an ESC independently. The supervisor takes legal responsibility for the certified work. 'Same site' means the same building or project, not necessarily standing next to the trainee at every moment."},

{t:"Regulations & Legislation",
q:"What is the purpose of Schedule 2 of the Electricity (Safety) Regulations 2010 (Companion Standards)?",
opts:["It lists the specific standards (AS/NZS 3000, AS/NZS 3010, AS/NZS 2500 etc.) that are called up by the","It contains the fee schedule for EWRB registration and licence renewals","It defines the boundaries between low, general, and high risk PEW","It lists the qualifications required for each class of electrical worker registration"],
a:0,exp:"Schedule 2 (Companion Standards): lists the technical standards incorporated by reference into the Regulations. Key standards: AS/NZS 3000 (Wiring Rules), AS/NZS 3010 (Generating Sets), AS/NZS 3012 (Construction Sites), AS/NZS 2500 (Patient Care Areas), AS/NZS 3760 (In-service Safety Testing), NZECP 34 (Network Operators), NZECP 41, NZECP 46. These standards become legally binding because the Regulations require compliance with them. Non-compliance with AS/NZS 3000 = non-compliance with the Regulations."},

{t:"Regulations & Legislation",
q:"Under the Health and Safety at Work Act 2015, what is the PRIMARY DUTY OF CARE of a PCBU and how does it apply specifically to a self-employed electrician?",
opts:["A PCBU must ensure the health and safety of workers and others so far as is reasonably practicable. A self-employed electrician","The primary duty only applies to companies with employees — sole traders have no duty of care","The primary duty of care only covers physical injuries, not health risks like chemical exposure","A self-employed electrician is a worker only, not a PCBU, so the primary duty does not apply"],
a:0,exp:"HSWA Section 36: PCBU must ensure health and safety of workers and that others are not put at risk 'so far as is reasonably practicable.' A self-employed electrician IS a PCBU (Section 17 — a person conducting a business or undertaking, whether or not they employ others). Duties: to themselves as a worker, to any trainees/employees, to homeowners and bystanders affected by work. 'Reasonably practicable' considers: likelihood of harm, severity, knowledge of hazards, availability of controls, and cost."},

{t:"Regulations & Legislation",
q:"What does NZECP 34:2001 regulate and why is it relevant to electricians?",
opts:["Electrical Safe Distances — specifies minimum clearance distances between structures, trees,","NZECP 34 regulates the size of switchboards in commercial buildings","NZECP 34 sets the pass mark for the EWRB theory examination","NZECP 34 defines the maximum voltage allowed in domestic installations"],
a:0,exp:"NZECP 34:2001 (Network Operators Code of Practice): specifies safe working distances from overhead lines for workers, plant (cranes, excavators), scaffolding, and buildings. Relevant to electricians: when working on building sites near overhead lines, or installing aerial cables. Minimum distances vary by voltage: 230/400V lines require 1.0m clearance for untrained persons, greater for conductive materials. Violations can result in electrocution from flashover without direct contact. A key PCBU obligation."},

{t:"Regulations & Legislation",
q:"Under Regulation 24 of the Electricity (Safety) Regulations 2010, what are the requirements for RCDs used for personal protection?",
opts:["Maximum rated residual current of 30mA AND disconnection within 300ms at rated","Maximum 100mA and disconnection within 1 second at any current","Maximum 30mA but no specific disconnection time requirement","Maximum 10mA for all personal protection regardless of location"],
a:0,exp:"Regulation 24: personal protection RCDs must have: (1) IΔn ≤ 30mA. (2) Disconnection within 300ms at IΔn. (3) Disconnection within 40ms at 5×IΔn (150mA). (4) Type A (per NZ requirements) — must detect both sinusoidal AC and pulsating DC residual currents. This is verified with an RCD tester. The 300ms at rated current and 40ms at 5× rated are the compliance test parameters that RCD testers check."},

{t:"Regulations & Legislation",
q:"AS/NZS 3760 governs in-service safety testing of electrical equipment. State THREE situations that trigger mandatory testing under this standard.",
opts:["Before first use of new equipment, after repair or modification, after any incident (drop, impact,","Only when equipment is visually damaged — regular interval testing is optional","Only for equipment over 15 years old — wrong approach","Only for commercial equipment — domestic appliances are exempt"],
a:0,exp:"AS/NZS 3760 (In-Service Safety Testing): mandatory testing triggers include: (1) Before first use (new equipment). (2) After any repair or modification. (3) After any incident that may have caused damage (dropping, immersion, suspected fault, overheating). (4) At regular intervals — frequency depends on equipment type and environment: construction site portable equipment (Class I): every 3 months. Office equipment: every 5 years. High-risk environments: more frequent. Tests: visual inspection, earth continuity, insulation resistance, polarity."},

{t:"Regulations & Legislation",
q:"What is the role of WorkSafe NZ in relation to electrical work and how does it differ from the EWRB's role?",
opts:["WorkSafe NZ enforces the HSWA 2015 — investigates notifiable events, can issue improvement and prohibition","WorkSafe NZ and the EWRB are the same organisation with different names","WorkSafe NZ only regulates factories — the EWRB handles all electrical safety","EWRB regulates all workplace safety; WorkSafe only deals with electrical registration"],
a:0,exp:"Separate but overlapping jurisdictions: EWRB (under Electricity Act 1992): registration/licensing of electrical workers, setting competency standards, disciplinary action for professional misconduct, certification compliance. WorkSafe NZ (under HSWA 2015): workplace health and safety enforcement, notifiable event investigation, improvement/prohibition notices, prosecution of serious H&S breaches. A serious electrical incident may involve BOTH: WorkSafe investigates the H&S failure; EWRB investigates the professional conduct. Both can prosecute independently."},

// ── Scenario-based regulation questions from real exam papers ──
{t:"Regulations & Legislation",
q:"SCENARIO: An electrician completes rewiring of a commercial kitchen (general risk PEW). They connect and energise the installation on Tuesday. What certification must be issued, to whom, and by what deadline?",
opts:["CoC and ESC must both be provided to the person who contracted the work, as soon as practicable, and","ESC only — CoC is not required for commercial kitchens","CoC only — ESC is only required for domestic work — does not comply","Both documents must be provided within 5 working days for commercial premises"],
a:0,exp:"General risk PEW requires both CoC (Regulation 65) and ESC (Regulation 74A). Both must be provided to the contracting person as soon as practicable and within 20 WORKING DAYS from the date of energisation (Tuesday). 20 working days = approximately 4 calendar weeks (excluding weekends and public holidays). The electrician retains copies. If contracting person unavailable, provide to owner/occupier."},

{t:"Regulations & Legislation",
q:"SCENARIO: A registered electrician is asked to certify PEW completed by their unregistered brother who wired a new circuit without supervision. The electrician inspects the work and it appears correct. Can they issue the CoC and ESC?",
opts:["No — the CoC and ESC certify that the work was performed lawfully by or under the supervision of a registered electrician. Work","Yes — if the work passes testing the electrician can certify it regardless of who did it","Yes — retrospective supervision is acceptable if the electrician inspects and approves the work","No — but only because the brother is not on the EWRB register as a trainee"],
a:0,exp:"The CoC certifies the work was done LAWFULLY (Regulation 65). Unregistered PEW = unlawful. Certifying it = false/misleading certification = Section 143(f) disciplinary offence. The registered electrician would also be facilitating an offence under the Electricity Act. Correct action: advise that the work cannot be certified as-is, the unlawful work must be formally remediated (possibly by having a registered electrician redo or formally take over the work), and the owner advised of the situation."},

{t:"Regulations & Legislation",
q:"SCENARIO: A homeowner tells you they have replaced a faulty socket outlet themselves. They want you to sign the ESC for this work. What should you do?",
opts:["Decline to sign an ESC for work you did not perform or supervise. Explain that socket outlet replacement is PEW — it must be","Sign the ESC after testing the socket — if it passes, the work is safe regardless of who did it","Sign the ESC as a courtesy since the homeowner is the property owner","Refuse and report the homeowner to WorkSafe NZ immediately — not under these regulations"],
a:0,exp:"An ESC certifies that the registered electrician performed or supervised the PEW AND has tested it (Regulation 74A). You cannot sign an ESC for work you did not do or supervise — that is false certification (Section 143(f)). Options: (1) Inspect, test, and if defective, re-do the work yourself and issue a proper ESC. (2) If the work is actually correct and safe, you may be able to formally take responsibility, redo any remediation, test, and certify — but document everything. Simply signing without doing the work = professional misconduct."},

{t:"Regulations & Legislation",
q:"Under the Electricity (Safety) Regulations 2010, who is responsible for ensuring that all required testing is completed before issuing an ESC?",
opts:["The registered electrical worker who is issuing the ESC — they must personally ensure all required tests under","The supply authority must test all work before the electrician issues the ESC","The homeowner is responsible for arranging independent testing before the ESC is issued","The EWRB inspector must approve all testing before an ESC can be signed"],
a:0,exp:"The registered electrician issuing the ESC is personally responsible for ensuring testing is completed and satisfactory (Regulation 74A). Required tests per AS/NZS 3000 Section 8: insulation resistance (≥1MΩ), earth continuity (≤1Ω for appliances), polarity, earth fault loop impedance, RCD testing (where fitted). The ESC is a legal document — signing it without adequate testing is false certification. There is no independent testing authority — the responsibility lies entirely with the certifying electrician."},

{t:"Regulations & Legislation",
q:"What does AS/NZS 3000 'Section 8' govern and why is it legally significant?",
opts:["Section 8 specifies the inspection and testing requirements for electrical installations — it defines","Section 8 contains the cable sizing tables used for voltage drop calculations","Section 8 defines the requirements for switchboard construction only","Section 8 is optional guidance only — no legal requirement to follow it"],
a:0,exp:"AS/NZS 3000 Section 8 (Inspection and Testing): mandatory tests before connection: (1) Continuity of protective conductors and equipotential bonding. (2) Insulation resistance. (3) Polarity. (4) Earth fault loop impedance. (5) RCD operation testing (where fitted). Legal significance: the Electricity (Safety) Regulations 2010 Schedule 2 lists AS/NZS 3000 as a Companion Standard — non-compliance = regulatory breach = potential EWRB disciplinary action and inability to issue a valid ESC."},

{t:"Regulations & Legislation",
q:"What offence does Section 9 of the Electricity Act 1992 create, and what is the maximum penalty?",
opts:["Section 9 makes it an offence to connect or use an electrical installation that has not been inspected and certified as required","Section 9 makes it an offence to work as an electrician without registration — maximum $500 fine","Section 9 only creates a civil liability — no criminal offence or fine applies","Section 9 applies only to supply authorities, not individual electricians"],
a:0,exp:"Section 9 Electricity Act 1992: offence to connect or allow connection of an electrical installation to a supply network unless certified as required. Maximum penalties: individual $10,000, body corporate $50,000. Related offences: Section 10 (performing PEW without authorisation): individual $10,000. Section 143 disciplinary offences: EWRB disciplinary action including fines, suspension, cancellation. These penalties reflect the serious public safety implications of unsafe or uncertified electrical work."},

{t:"Regulations & Legislation",
q:"What is the purpose of the 'Record of Inspection' (RoI) required for high-risk PEW, and when must it be issued relative to the CoC?",
opts:["The RoI documents that the high-risk installation has been inspected and found to comply with","The RoI is issued after the CoC, as a follow-up inspection 30 days later","The RoI replaces the ESC for high-risk work — both are not required","The RoI is only required if the installation fails initial testing"],
a:0,exp:"High-risk PEW sequence: (1) Complete the installation. (2) Issue Record of Inspection (RoI) — certifies the installation has been inspected and complies with Regulations (BEFORE energisation/connection). (3) Issue CoC — requires a valid RoI first. (4) Energise the installation. (5) Complete testing and issue ESC. The RoI provides an additional layer of verification for complex, high-risk installations such as consumer substations and generating sets where errors could have severe consequences."},

{t:"Regulations & Legislation",
q:"Under the HSWA 2015, what must a PCBU do when they identify a hazard in their workplace that they cannot eliminate?",
opts:["Minimise the risk so far as is reasonably practicable, using the hierarchy of controls:","Document the hazard and wait until the next annual safety audit","Immediately close the workplace until the hazard is eliminated","Notify WorkSafe NZ and wait for their instruction before taking any action"],
a:0,exp:"HSWA Section 36 and 37: if elimination is not reasonably practicable, the PCBU must minimise risks using the hierarchy: (1) Substitution — replace hazardous process/material with something safer. (2) Isolation — physically separate workers from hazard. (3) Engineering controls — guards, ventilation, interlocks. (4) Administrative controls — procedures, training, rotation. (5) PPE — last resort. Controls must be reviewed when: work changes, incident occurs, or new hazard information is available."},

opts:["RT = 8Ω — R_parallel=(12×6)/(12+6)=4Ω, RT=R1+R_parallel=4+4=8Ω","RT = 22Ω — all resistors added in series","RT = 4Ω — only the parallel section counts","RT = 16Ω — R1 doubled plus parallel section"],
a:0,exp:"Step 1: Find parallel resistance. R_par = (R2×R3)/(R2+R3) = (12×6)/(12+6) = 72/18 = 4Ω. Step 2: Add series resistor. RT = R1 + R_par = 4 + 4 = 8Ω. This is the first of 5 sequential questions on Circuit A.",calc:true,seqBonus:true},

parts:[
  {q:"Calculate total resistance RT. (R1=4Ω series with R2=12Ω ∥ R3=6Ω, supply=24V.)",opts:["RT=8Ω — R_par=72/18=4Ω, RT=4+4=8Ω","RT=22Ω — adds all in series","RT=4Ω — parallel only","RT=6Ω — wrong method"],a:0,exp:"R_par=(12×6)/(12+6)=4Ω. RT=R1+R_par=4+4=8Ω."},

  {q:"R1=4Ω, R2=12Ω∥R3=6Ω, R4=4Ω, supply=60V. Calculate RT.",opts:["RT=12Ω — R_par=4Ω, RT=4+4+4=12Ω","RT=26Ω — all in series","RT=8Ω — omits R4","RT=4Ω — parallel only"],a:0,exp:"R_par=(12×6)/18=4Ω. RT=4+4+4=12Ω."},

function getHint(q) {
  if (!q.calc) return null;
  for (const h of HINTS) { if (h.re.test(q.q)) return h.f; }
  return 'Formula sheet: P=VI | P=I²R | V=IR | Ns=120f/P | IF=V/Zs | Vp/Vs=Np/Ns | P=√3×VL×IL×pf';
}


const ALL_TOPICS = [...new Set(QS.map(q=>q.t))];

// ── Exam state ──

let qAnswered=false;
let qStartTime=0;
let sessionPoints=0;

// ── Points system ──
function calcPoints(isCalc, isHard, timeTakenMs){
  const base = isHard ? 20 : 10;
  const window = isCalc ? 45000 : 15000;
  const maxMult = isHard ? (isCalc ? 4.0 : 3.0) : (isCalc ? 3.0 : 2.0);
  const t = Math.min(timeTakenMs, window);
  const mult = maxMult - (maxMult - 1.0) * (t / window);
  return Math.round(base * mult);
}

// ── Sequence bonus tracking ──
let seqTracker = {}; // {seqTag: {correct:0, total:0, indices:[]}}

function trackSeq(q, qIndex, ok){
  if(!q.seq) return;
  if(!seqTracker[q.seq]) seqTracker[q.seq]={correct:0,total:0,done:false,indices:[]};
  const s = seqTracker[q.seq];
  s.total++;
  if(ok) s.correct++;
  s.indices.push(qIndex);
  // Check if this completes the sequence
  const allInSeq = examQs.filter(q2=>q2.seq===q.seq).length;
  if(s.total===allInSeq && !s.done){
    s.done=true;
    if(s.correct===allInSeq){
      // Perfect sequence! Award bonus
      const bonus=Math.round(allInSeq*15);
      sessionPoints+=bonus;
      s.bonusAwarded=bonus;
      return bonus;
    }
  }
  return 0;
}

function startExam(){
  if(!selTop.size){alert('Select at least one topic.');return;}
  let pool=QS.filter(q=>selTop.has('__all__')||selTop.has(q.t));
  const effLen=pool.reduce((n,q)=>n+(q.parts?q.parts.length:1),0);
  if(effLen<examLen){alert('Only '+effLen+' questions available for the selected topic. Please choose a shorter exam length.');return;}
  examQs=shuffle([...pool]).slice(0,examLen);
  qIdx=0; score=0; answers=[]; flagged=[]; sessionPoints=0; seqTracker={}; mpState={};
  tStats={};
  QS.forEach(function(q){if(!tStats[q.t])tStats[q.t]={c:0,w:0};});
  show('s-exam');
  renderQ();
}

// ── Visual timer ──
let timerInterval=null;
function startQTimer(seconds, isCalc){
  if(timerInterval) clearInterval(timerInterval);
  const bar=document.getElementById('qtime-bar');
  const label=document.getElementById('qtime-label');
  const total=seconds*1000;
  const tick=100;
  let elapsed=0;
  timerInterval=setInterval(function(){
    if(qAnswered){clearInterval(timerInterval);return;}
    elapsed+=tick;
    const pct=Math.max(0,100-(elapsed/total*100));
    if(bar) bar.style.width=pct+'%';
    const sLeft=Math.max(0,Math.ceil((total-elapsed)/1000));
    if(label) label.textContent=sLeft+'s';
    if(elapsed>=total){
      clearInterval(timerInterval);
      if(bar) bar.style.background='#da3633';
    }
  },tick);
}

function answer(chosen, correctNew){
  if(qAnswered) return;
  qAnswered=true;
  if(timerInterval){clearInterval(timerInterval); timerInterval=null;}

  // Immediately block all options
  const allOpts=document.querySelectorAll('.opt');
  allOpts.forEach(b=>{b.disabled=true; b.onclick=null; b.style.pointerEvents='none';});

  const ok=chosen===correctNew;
  const chosenBtn=document.getElementById('opt-'+chosen);
  const correctBtn=document.getElementById('opt-'+correctNew);
  if(chosenBtn) chosenBtn.classList.add(ok?'ok':'bad');
  if(!ok&&correctBtn) correctBtn.classList.add('show');
  const expbox=document.getElementById('expbox');
  if(expbox) expbox.classList.add('on');

  const q=examQs[qIdx];
  const timeTaken=Date.now()-qStartTime;
  let pts=0;
  if(ok){
    score++;
    if(tStats[q.t]) tStats[q.t].c++;
    pts=calcPoints(!!q.calc, !!q.hard, timeTaken);
    sessionPoints+=pts;
  } else {
    if(tStats[q.t]) tStats[q.t].w++;
  }
  answers.push({q, ok, pts, timeTaken});

  // Track sequence and check for bonus
  const seqBonus = trackSeq(q, qIdx, ok);

  // Show points flash if correct
  if(ok && pts){
    const qcard=document.querySelector('.qcard');
    if(qcard){
      const flash=document.createElement('div');
      flash.className='pts-flash';
      flash.textContent='+'+pts+' pts'+(pts>10?' ⚡':'');
      qcard.appendChild(flash);
      setTimeout(()=>flash.remove(), 1800);
    }
  }
  // Show sequence bonus flash
  if(seqBonus>0){
    const qcard=document.querySelector('.qcard');
    if(qcard){
      const flash=document.createElement('div');
      flash.className='pts-flash seq-bonus-flash';
      flash.innerHTML='🔗 Sequence complete!<br>+'+seqBonus+' bonus pts';
      qcard.appendChild(flash);
      setTimeout(()=>flash.remove(), 2800);
    }
  }

  // Update live score display
  document.getElementById('qlive').textContent='Score: '+score+'/'+answers.length+(sessionPoints?' · '+sessionPoints+'pts':'');

  // Reliable button reveal with double-check
  const isLast=qIdx===examQs.length-1;
  setTimeout(function(){
    const nb=document.getElementById('nbtn');
    const fb=document.getElementById('fbtn');
    if(isLast){
      if(fb){fb.style.display='inline-block'; fb.onclick=showResults;}
    } else {
      if(nb){nb.style.display='inline-block'; nb.onclick=nextQ;}
    }
  },80);
}

function nextQ(){
  const nb=document.getElementById('nbtn');
  if(nb){nb.style.display='none'; nb.onclick=null;}
  qIdx++;
  renderQ();
}



function showResults(){
  if(timerInterval){clearInterval(timerInterval); timerInterval=null;}
  saveScore(score, examQs.length, sessionPoints);
  show('s-results');
  const pct=Math.round((score/examQs.length)*100);
  const col=pct>=70?'#27500A':pct>=50?'#BA7517':'#A32D2D';
  const el_rpct=document.getElementById('rpct');
  const el_rco=document.getElementById('rco');
  const el_rwr=document.getElementById('rwr');
  const el_rverd=document.getElementById('rverd');
  if(el_rpct) el_rpct.textContent=pct+'%';
  if(el_rco) el_rco.textContent=score;
  if(el_rwr) el_rwr.textContent=examQs.length-score;
  if(el_rverd) el_rverd.innerHTML=
    '<div style="text-align:center;margin:12px 0">'+
    '<span style="font-size:22px;font-weight:800;color:'+col+'">'+
    (pct>=70?'&#10003; Pass standard met':'&#10007; Below pass standard (70%)')+
    '</span><br><span style="color:#e8a000;font-weight:700;font-size:17px">'+
    sessionPoints+' pts <span style="font-size:13px;color:#888">('+pct+'% · '+score+'/'+examQs.length+')</span></span></div>';
  let bk='';
  Object.entries(tStats).forEach(function(entry){
    const t=entry[0], s=entry[1];
    const tot=s.c+s.w; if(!tot)return;
    const tp=Math.round((s.c/tot)*100);
    const col2=tp>=75?'#27500A':tp>=50?'#BA7517':'#A32D2D';
    bk+='<div class="rbar"><span class="rbl">'+t+'</span><div class="rbt"><div class="rbf" style="width:'+tp+'%;background:'+col2+'"></div></div><span class="rbv">'+s.c+'/'+tot+'</span></div>';
  });
  const el_tbk=document.getElementById('tbk');
  if(el_tbk) el_tbk.innerHTML=bk;
}

function reviewWrong(){
  show('s-review');
  const wrong=answers.filter(function(a){return !a.ok;});
  if(!wrong.length){document.getElementById('rarea').innerHTML='<p style="padding:1rem">No wrong answers!</p>';return;}
  let h='';
  wrong.forEach(function(a,i){
    const q=a.q;
    h+='<div class="rc"><span class="qtag">'+q.t+'</span>';
    // Multi-part question wrong answer
    if(q.parts){
      h+='<div class="qtext">'+q.title+'</div>';
      h+='<p style="font-size:12px;color:#888">One or more parts were answered incorrectly. Review the full circuit question in your next exam.</p>';
      h+='<div class="exp on">&#128161; '+a.q.exp+'</div>';
    } else {
      if(q.calc) h+='<span class="calctag">&#128290; Calculation</span>';
      const hasHTML=q.q.includes('<');
      h+='<div class="qtext'+(hasHTML?' scenario':'')+'">'+(!hasHTML?'Q'+(i+1)+'. ':'')+q.q+'</div>';
      q.opts.forEach(function(o,j){
        const c=j===q.a?'show':'';
        h+='<button class="opt '+c+'" disabled>'+String.fromCharCode(65+j)+'.  '+o+'</button>';
      });
      h+='<div class="exp on">&#128161; '+q.exp+'</div>';
    }
    h+='</div>';
  });
  document.getElementById('rarea').innerHTML=h;
}
