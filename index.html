// ══ AC THEORY — RMS, PEAK, AVERAGE, FORM FACTOR ══

{t:"AC Theory & Waveforms",q:"A sinusoidal AC voltage has a peak (maximum) value of 325V. Calculate the RMS value.",opts:["229.8V","325V","162.5V","459.6V"],a:0,exp:"Vrms = Vpeak / sqrt(2) = 325 / 1.4142 = 229.8V. The NZ standard supply is 230V RMS, which corresponds to a peak of 230 × 1.414 = 325.2V.",calc:true},

{t:"AC Theory & Waveforms",q:"The NZ standard supply is 230V RMS. Calculate the peak (maximum) voltage.",opts:["325.3V","230V","163V","460V"],a:0,exp:"Vpeak = Vrms × sqrt(2) = 230 × 1.4142 = 325.3V. This is the maximum instantaneous voltage reached by the 230V AC waveform.",calc:true},

{t:"AC Theory & Waveforms",q:"A sinusoidal current has a peak value of 14.14A. Calculate the RMS current.",opts:["10.0A","14.14A","7.07A","20.0A"],a:0,exp:"Irms = Ipeak / sqrt(2) = 14.14 / 1.4142 = 10.0A. RMS (Root Mean Square) current is the equivalent DC current that would produce the same heating effect.",calc:true},

{t:"AC Theory & Waveforms",q:"What is the relationship between RMS voltage and average voltage for a full-wave rectified sinusoidal waveform?",opts:["Vrms = 1.11 × Vavg (form factor = 1.11)","Vrms = Vavg under normal operating conditions","Vrms = 1.414 × Vavg","Vrms = 0.636 × Vpeak"],a:0,exp:"Form factor = Vrms/Vavg = 1.11 for a sinusoidal waveform. Vavg = 0.637 × Vpeak. Vrms = 0.707 × Vpeak. Therefore Vrms/Vavg = 0.707/0.637 = 1.11.",calc:true},

{t:"AC Theory & Waveforms",q:"A sinusoidal voltage has a peak value of 340V. Calculate the average value over a full half-cycle.",opts:["216.5V","340V","240.4V","170V"],a:0,exp:"Vavg = 0.6366 × Vpeak = 0.6366 × 340 = 216.4V. The average is taken over a half-cycle (the full cycle averages to zero for AC).",calc:true},

{t:"AC Theory & Waveforms",q:"What does RMS stand for and why is it used to measure AC quantities?",opts:["Root Mean Square — it gives the equivalent DC value that produces the same power/heating effect in a resistor","Real Measured Signal — it is the most accurate measurement method","Root Maximum Signal — it measures the peak value accurately","Rectified Mean Sum — it averages the rectified waveform"],a:0,exp:"RMS = Root Mean Square. The RMS value of an AC voltage or current is the equivalent DC value that would produce the same power dissipation in a resistive load. P = Vrms²/R = Irms²×R. This is why AC voltmeters display RMS values by default."},

{t:"AC Theory & Waveforms",q:"A transformer nameplate shows 230V. What type of voltage measurement does this refer to?",opts:["RMS (root mean square) value","Peak value","Average value","Instantaneous value at the moment of measurement"],a:0,exp:"All AC voltage and current ratings on equipment nameplates (transformers, motors, switchboards) refer to RMS values. The 230V RMS has a peak of 325V. Equipment insulation is rated for the peak voltage, not the RMS."},

{t:"AC Theory & Waveforms",q:"An AC current of 10A RMS flows through a 5Ω resistor. Calculate the power dissipated.",opts:["500W","707W","250W","1000W"],a:0,exp:"P = Irms² × R = 10² × 5 = 100 × 5 = 500W. The RMS value is used directly in power calculations — this gives the same result as the equivalent DC current.",calc:true},

{t:"AC Theory & Waveforms",q:"An oscilloscope shows a sinusoidal waveform with a peak-to-peak voltage of 650V. What is the RMS voltage?",opts:["229.8V","325V","460V","162.5V"],a:0,exp:"Peak-to-peak = 650V, so peak = 650/2 = 325V. Vrms = 325/sqrt(2) = 229.8V ≈ 230V. This confirms the oscilloscope is showing the NZ standard 230V supply.",calc:true},

{t:"AC Theory & Waveforms",q:"What is the frequency of the NZ AC supply and what does this mean for the waveform?",opts:["50Hz — the voltage completes 50 full cycles per second, with a period of 20 milliseconds","60Hz — 60 cycles per second, period 16.7ms for the installation concerned","50Hz — 50 half-cycles per second under normal operating conditions","100Hz — the waveform reverses 100 times per second under normal operating conditions"],a:0,exp:"NZ standard supply: 50Hz. One complete cycle takes T = 1/f = 1/50 = 0.02 seconds = 20ms. The voltage rises to +325V peak, falls through zero, reaches -325V, and returns to zero in 20ms. This repeats 50 times every second."},

{t:"AC Theory & Waveforms",q:"Define 'frequency' and 'period' of an AC waveform and state how they relate.",opts:["Frequency (f) = cycles per second (Hz); Period (T) = time for one cycle (seconds); T = 1/f","Frequency = peak voltage; Period = average voltage","Frequency = number of phases; Period = phase angle in degrees","Frequency and period are the same quantity measured differently"],a:0,exp:"Frequency (f): the number of complete cycles per second, measured in Hertz (Hz). Period (T): the time taken to complete one cycle, in seconds. Relationship: T = 1/f and f = 1/T. At 50Hz: T = 1/50 = 0.02s = 20ms."},

// ══ HORSEPOWER & TORQUE — extensive coverage ══

{t:"Motors & Starters",q:"A motor nameplate shows 30HP. Convert to kilowatts output power.",opts:["22.38kW","30kW","40.2kW","15kW"],a:0,exp:"Pout = HP × 746 = 30 × 746 = 22,380W = 22.38kW. The conversion factor 1 HP = 746W (or 0.746kW) must be memorised — it appears on every exam.",calc:true},

{t:"Motors & Starters",q:"A motor nameplate shows 15HP. Convert to kilowatts output power.",opts:["11.19kW","15kW","20.1kW","7.46kW"],a:0,exp:"Pout = 15 × 746 = 11,190W = 11.19kW.",calc:true},

{t:"Motors & Starters",q:"A motor produces 22.38kW output. What is this in horsepower?",opts:["30HP","22.38HP","15HP","40HP"],a:0,exp:"HP = kW / 0.746 = 22,380 / 746 = 30HP. Converting kW back to HP divides by 746.",calc:true},

{t:"Motors & Starters",q:"A 30HP motor has efficiency 93.6%. Calculate the input power in kW.",opts:["23.91kW","22.38kW","30kW","25.4kW"],a:0,exp:"Pout = 30 × 746 = 22,380W = 22.38kW. Pin = Pout/η = 22,380/0.936 = 23,910W = 23.91kW.",calc:true},

{t:"Motors & Starters",q:"A 30HP motor runs at 1440rpm with efficiency 93.6% and pf 0.87 on 415V supply. Calculate line current.",opts:["38.24A","22.38A","30.5A","46.8A"],a:0,exp:"Pin = 23,910W (from previous). IL = Pin/(sqrt(3)×VL×pf) = 23910/(1.732×415×0.87) = 23910/625.3 = 38.24A.",calc:true},

{t:"Motors & Starters",q:"A motor runs at 1440rpm and develops a torque of 142.63Nm. Calculate the mechanical output power.",opts:["21.51kW","14.26kW","30.0kW","7.13kW"],a:0,exp:"P = 2π×N×T/60 = 2×3.1416×1440×142.63/60 = 9047.8×142.63/60 = wait — P = (2×3.1416×1440×142.63)/60 = (2×3.1416×1440×142.63)/60. Step by step: 2π×1440 = 9047.8 rad/min. 9047.8×142.63/60 = 1,290,700/60 = 21,511W = 21.51kW.",calc:true},

{t:"Motors & Starters",q:"A motor runs at 960rpm and develops 200Nm torque. Calculate output power.",opts:["20.1kW","19.2kW","30.2kW","9.6kW"],a:0,exp:"P = 2π×N×T/60 = 2×3.1416×960×200/60 = 6031.9×200/60 = 1,206,371/60 = 20,106W = 20.1kW.",calc:true},

{t:"Motors & Starters",q:"A motor produces 15kW output at 1500rpm. Calculate the torque developed.",opts:["95.5Nm","150Nm","47.7Nm","191Nm"],a:0,exp:"Rearrange P = 2π×N×T/60: T = P×60/(2π×N) = 15000×60/(2×3.1416×1500) = 900,000/9424.8 = 95.5Nm.",calc:true},

{t:"Motors & Starters",q:"A motor produces 22.38kW output at 1440rpm. Verify by calculating torque, then recalculate power.",opts:["T=148.5Nm, P=22.38kW (verified)","T=100Nm, P=15kW for domestic installations","T=200Nm, P=30kW — this is the correct NZ practice","T=74.3Nm, P=11.2kW in standard LV installations"],a:0,exp:"T = P×60/(2π×N) = 22380×60/(2π×1440) = 1,342,800/9047.8 = 148.4Nm. Check: P = 2π×1440×148.4/60 = 9047.8×148.4/60 = 1,342,600/60 = 22,377W ≈ 22.38kW ✓",calc:true},

{t:"Motors & Starters",q:"Can a 30HP motor (22.38kW output) drive a load requiring full-load torque of 142.63Nm at 1440rpm? Show working.",opts:["Yes — required power = 21.51kW, motor output = 22.38kW, motor has sufficient power","No — required power exceeds motor rating — this is the correct NZ practice","Yes — but only if supply voltage is increased in standard LV installations","Cannot be determined without knowing the load type per AS/NZS 3000 requirements"],a:0,exp:"Required P = 2π×1440×142.63/60 = 21,511W = 21.51kW. Motor output = 22.38kW. Since 22.38kW > 21.51kW, the motor CAN drive the load with a margin of 0.87kW. This is the exact Q from ET62 Paper Q4(c).",calc:true},

{t:"Motors & Starters",q:"Define torque as it applies to a rotating electrical machine.",opts:["The turning force produced by the machine, measured in Newton-metres (Nm) — the product of force and the radius at which it acts","The rotational speed of the motor shaft in rpm under normal operating conditions","The power output divided by efficiency as required by AS/NZS 3000","The ratio of output torque to input torque for all LV installations in NZ"],a:0,exp:"Torque (T) is the rotational force or twisting moment produced by a motor. T = F × r, where F is the tangential force (N) and r is the radius (m). Unit: Newton-metres (Nm). The mechanical power P = T × ω = 2πNT/60, where N is speed in rpm."},

{t:"Motors & Starters",q:"A motor's speed doubles while torque remains constant. What happens to output power?",opts:["Power doubles","Power stays the same","Power halves","Power quadruples"],a:0,exp:"P = 2π×N×T/60. If N doubles and T is constant, P = 2π×(2N)×T/60 = 2 × (2πNT/60) = 2P. Power doubles. This is why variable speed drives can significantly change power consumption.",calc:true},

{t:"Motors & Starters",q:"Define 'pull-out torque' (also called breakdown torque) of an induction motor.",opts:["The maximum torque the motor can develop without stalling — if load torque exceeds this the motor pulls out of synchronism and stops","The torque at full-load rated conditions under normal operating conditions","The starting torque at the moment of energisation as required by AS/NZS 3000","The torque at which the motor reaches synchronous speed for all LV installations in NZ"],a:0,exp:"Pull-out torque is the peak of the torque-speed characteristic curve. If the load torque exceeds the pull-out torque at any point, the motor cannot maintain rotation — it stalls. Locked-rotor current then flows continuously, rapidly overheating the windings."},

{t:"Motors & Starters",q:"At what speed does an induction motor develop maximum torque (pull-out torque)?",opts:["At a speed just below the point where slip becomes critical — typically 70-80% of synchronous speed","At synchronous speed (zero slip) under normal operating conditions","At standstill (zero speed) as required by AS/NZS 3000","At exactly 50% of synchronous speed for all LV installations in NZ"],a:0,exp:"The pull-out torque occurs at a critical slip value, typically when rotor reactance equals rotor resistance. This is usually at 70-90% of synchronous speed. Above this point, torque decreases as speed increases toward synchronous speed."},

// ══ ADVANCED TRANSFORMER CALCULATIONS ══

{t:"Transformers",q:"A transformer has no-load secondary voltage of 240V. Under full load it drops to 228V. Calculate percentage voltage regulation.",opts:["5.0%","5.26%","4.76%","12V"],a:0,exp:"% Reg = (VNL - VFL)/VNL × 100 = (240-228)/240 × 100 = 12/240 × 100 = 5.0%.",calc:true},

{t:"Transformers",q:"Why is a tap-changer installed on the HIGH voltage winding of a transformer rather than the low voltage winding?",opts:["The high voltage winding carries lower current — so the tap-changer switches smaller currents, reducing arcing and contact wear","The high voltage winding has more turns — easier to access under normal operating conditions","The low voltage winding cannot be tapped as required by AS/NZS 3000","Tap-changers can only be insulated for high voltage for all LV installations in NZ"],a:0,exp:"On the HV winding: current is low (proportional to 1/turns ratio). Tap-changers switch current — lower current means smaller arcing, less contact erosion, simpler design and insulation requirements. The LV winding carries much higher current making tap-changing mechanically difficult and causing severe arcing."},

{t:"Transformers",q:"A transformer has a turns ratio Np:Ns = 10:1. Primary current is 5A. Calculate secondary current (ignore losses).",opts:["50A","5A","0.5A","500A"],a:0,exp:"Is/Ip = Np/Ns → Is = Ip × (Np/Ns) = 5 × (10/1) = 50A. When voltage is stepped DOWN, current is stepped UP by the same ratio. Power in = Power out (ideal transformer).",calc:true},

{t:"Transformers",q:"Explain why the SECONDARY current of a step-down transformer is HIGHER than the primary current.",opts:["Conservation of energy — lower voltage must be accompanied by higher current to maintain the same power transfer (P = VI, so if V↓ then I↑)","Step-down transformers always have more secondary turns under normal operating conditions — no further action is required","The secondary winding resistance is lower as required by AS/NZS 3000 for the installation concerned","The secondary is connected to a low impedance load for all LV installations in NZ under normal operating conditions"],a:0,exp:"P_primary = P_secondary (ideal). If Vs < Vp, then to maintain equal power: Is × Vs = Ip × Vp, so Is = Ip × (Vp/Vs) = Ip × (Np/Ns). Stepping voltage down by factor n means current steps up by same factor n."},

{t:"Transformers",q:"A single-phase distribution transformer is rated 50kVA, 11,000V primary and 230V secondary. Calculate the turns ratio and full-load primary current.",opts:["Ratio=47.8:1, Ip=4.55A","Ratio=47.8:1, Ip=217A","Ratio=1:47.8, Ip=4.55A","Ratio=478:1, Ip=0.455A"],a:0,exp:"Np/Ns = Vp/Vs = 11000/230 = 47.83:1. Full load: kVA = Vp×Ip → Ip = 50000/11000 = 4.55A. Secondary: Is = 50000/230 = 217.4A. Confirms Ip×(Np/Ns) = 4.55×47.83 = 217.6A ≈ Is ✓",calc:true},

// ══ ADVANCED MOTOR CALCULATIONS ══

{t:"Calculations",q:"A motor nameplate: 10kW output, efficiency 81.5%, 4-pole, 50Hz, slip 4%, phase angle 35°, VL=400V. Calculate ALL FOUR: (a) pf, (b) Pin, (c) IL, (d) rotor speed.",opts:["pf=0.819, Pin=12.27kW, IL=21.6A, Nr=1440rpm","pf=0.866, Pin=11.55kW, IL=19.8A, Nr=1450rpm","pf=0.707, Pin=14.15kW, IL=25.0A, Nr=1440rpm","pf=0.875, Pin=11.43kW, IL=20.1A, Nr=1450rpm"],a:0,exp:"(a) pf=cos35°=0.8192. (b) Pin=10/0.815=12.27kW. (c) IL=12270/(1.732×400×0.8192)=12270/567.9=21.6A. (d) Ns=120×50/4=1500rpm. Nr=1500×(1-0.04)=1440rpm.",calc:true},

{t:"Calculations",q:"A 4-pole 60Hz induction motor has slip 4%. Calculate: synchronous speed, rotor speed, and slip speed.",opts:["Ns=1800rpm, Nr=1728rpm, slip speed=72rpm","Ns=1500rpm, Nr=1440rpm, slip speed=60rpm","Ns=3600rpm, Nr=3456rpm, slip speed=144rpm","Ns=900rpm, Nr=864rpm, slip speed=36rpm"],a:0,exp:"Ns=120×60/4=1800rpm. Slip speed=1800×0.04=72rpm. Nr=1800-72=1728rpm. Note 60Hz (imported machinery) gives 1800rpm synchronous vs 1500rpm at 50Hz.",calc:true},

{t:"Calculations",q:"An induction motor runs at 950rpm on 50Hz. It has 6 poles. Calculate the percentage slip.",opts:["5.0%","4.0%","3.0%","6.0%"],a:0,exp:"Ns=120×50/6=1000rpm. %Slip=(Ns-Nr)/Ns×100=(1000-950)/1000×100=50/1000×100=5.0%.",calc:true},

{t:"Calculations",q:"A 3-phase 400V inductive load: IL=31.3A, VL=400V, P=19kW. Calculate reactive power (kVAr) and apparent power (kVA).",opts:["Q=12.5kVAr, S=21.72kVA","Q=6.3kVAr, S=19.8kVA","Q=19kVAr, S=26.9kVA","Q=15.0kVAr, S=24.1kVA"],a:0,exp:"S=sqrt(3)×400×31.3=21,699VA=21.7kVA. Q=sqrt(S²-P²)=sqrt(21.7²-19²)=sqrt(470.9-361)=sqrt(109.9)=10.5kVAr. More precisely: pf=P/S=19/21.7=0.875. phi=arccos(0.875)=28.96°. Q=S×sin(28.96°)=21.7×0.484=10.5kVAr.",calc:true},

// ══ ADVANCED PROTECTION — fuse characteristic curve questions ══

{t:"Electrical Protection",q:"From a time-current characteristic graph: a 25A HRC fuse with 50A fault current flowing — what is the approximate operating time?",opts:["Approximately 60 seconds","Approximately 0.08 seconds","Approximately 10 minutes","Approximately 4 hours"],a:0,exp:"From real EWRB exam answer schedules (ET51): a 25A HRC fuse with 50A flowing (2× rating) operates in approximately 60 seconds. This is within the inverse time-current characteristic region. The higher the fault current multiple, the faster the operation."},

{t:"Electrical Protection",q:"From a time-current characteristic graph: a 25A HRC fuse with 200A fault current flowing — what is the approximate operating time?",opts:["Approximately 0.08 seconds","Approximately 60 seconds","Approximately 10 minutes","Approximately 4 hours"],a:0,exp:"From EWRB ET51 marking schedule: 25A fuse with 200A flowing (8× rating) operates in approximately 0.08 seconds (80ms). High fault currents result in very fast operation — this is the inverse time-current characteristic.",},

{t:"Electrical Protection",q:"A 50A HRC fuse protects a motor circuit. Compare operating time: 75A fault vs 150A fault flowing.",opts:["75A fault: ~10 minutes. 150A fault: ~0.2 seconds — inverse characteristic means 2× current gives much faster operation","75A fault: ~0.2 seconds. 150A fault: ~10 minutes under normal operating conditions","Both take the same time — HRC fuses are constant time devices","75A fault: immediate. 150A fault: 5 minutes as required by AS/NZS 3000"],a:0,exp:"From EWRB ET51 marking schedule: 50A fuse — 75A flowing (1.5×): ~10 minutes. 50A fuse — 150A flowing (3×): ~0.2 seconds. The 2× increase in current produces a 3000× reduction in operating time. This is the inverse time-current characteristic — essential knowledge for discrimination."},

{t:"Electrical Protection",q:"On a time-current characteristic graph of a thermal overload and HRC fuse protecting a motor: what occurs when 50A flows (the overload is set to 40A)?",opts:["The thermal overload operates within 2.5-3.5 minutes — the HRC fuse does not operate (50A is below the fuse rating zone)","The HRC fuse operates immediately under normal operating conditions","Both devices operate simultaneously as required by AS/NZS 3000","Neither device operates — 50A is within the motor's normal range"],a:0,exp:"From ET51 marking schedule: at 50A (25% above the 40A overload setting), only the THERMAL OVERLOAD operates — within approximately 2.5-3.5 minutes. This is a sustained moderate overcurrent — in the overload relay's operating zone, not the HRC fuse's zone. Correct discrimination."},

{t:"Electrical Protection",q:"On the same graph: what occurs when 150A flows (fuse rating 50A, overload set 40A)?",opts:["The HRC fuse operates in approximately 0.2 seconds — the current is far beyond the overload relay's clearing capacity","The thermal overload operates in 2.5-3.5 minutes under normal operating conditions","Both operate simultaneously as required by AS/NZS 3000 as per standard practice","The motor's internal protection operates first for all LV installations in NZ"],a:0,exp:"From ET51: at 150A (3× fuse rating), the HRC FUSE operates in approximately 0.2 seconds. This is a short-circuit level fault — well beyond what the thermal overload can clear. Correct discrimination: overloads handle moderate overcurrents, HRC fuses handle short circuits."},

// ══ ADVANCED RCD QUESTIONS ══

{t:"RCDs & Isolating Transformers",q:"An RCD is protecting a circuit where phase and neutral were transposed at the supply. Does the RCD operate if an earth leakage fault occurs?",opts:["Yes — the RCD detects imbalance between the two conductors regardless of which is phase and which is neutral","No — the RCD only works when phase is in the correct terminal","Only if the fault current exceeds 100mA under normal operating conditions","Only if the supply voltage is correct polarity as required by AS/NZS 3000"],a:0,exp:"Yes. From EWRB ET60 marking schedule: 'The RCD detects the imbalance regardless of the polarity of the supply.' The RCD measures the difference between current in the two conductors — it does not matter which conductor is phase and which is neutral. It still provides earth leakage protection."},

{t:"RCDs & Isolating Transformers",q:"Name the four main types of RCD device and describe what each does (RCCB, RCBO, SRCD, PRCD).",opts:["RCCB=earth leakage only; RCBO=earth leakage+overcurrent; SRCD=socket-mounted RCD; PRCD=portable plug-in RCD","RCCB=overcurrent only; RCBO=earth leakage only; SRCD=socket fuse; PRCD=panel-mounted RCD","RCCB=earth leakage+overcurrent; RCBO=earth leakage only; SRCD=portable RCD; PRCD=socket RCD","All four types are identical — just different brand names"],a:0,exp:"RCCB (Residual Current Circuit Breaker): earth leakage protection only — no overcurrent protection. RCBO: combines RCCB + MCB — gives both earth leakage AND overcurrent (overload + short circuit) protection. SRCD: RCD built into a socket outlet. PRCD: portable plug-in RCD carried to site by the worker."},

// ══ ADVANCED AC CIRCUIT CALCULATIONS ══

{t:"AC Theory & Waveforms",q:"An AC circuit has R=8Ω and XL=6Ω in series. Supply V=100V. Calculate: Z, I, V_R, V_L, and verify KVL.",opts:["Z=10Ω, I=10A, V_R=80V, V_L=60V — phasor sum: sqrt(80²+60²)=100V ✓","Z=14Ω, I=7.14A, V_R=57V, V_L=43V — this is the correct NZ practice","Z=2Ω, I=50A, V_R=400V, V_L=300V in standard LV installations","Z=10Ω, I=10A, V_R=60V, V_L=80V per AS/NZS 3000 requirements"],a:0,exp:"Z=sqrt(8²+6²)=sqrt(64+36)=10Ω. I=V/Z=100/10=10A. V_R=I×R=10×8=80V. V_L=I×XL=10×6=60V. KVL check: in AC, voltages add as phasors (not arithmetic): V_supply=sqrt(V_R²+V_L²)=sqrt(6400+3600)=sqrt(10000)=100V ✓",calc:true},

{t:"AC Theory & Waveforms",q:"In the series RL circuit above (R=8Ω, XL=6Ω, Z=10Ω, I=10A), calculate: power factor, true power, apparent power, and reactive power.",opts:["pf=0.8, P=800W, S=1000VA, Q=600VAr","pf=0.6, P=600W, S=1000VA, Q=800VAr","pf=1.0, P=1000W, S=1000VA, Q=0VAr","pf=0.8, P=1000W, S=800VA, Q=600VAr"],a:0,exp:"pf=cosφ=R/Z=8/10=0.8. P=I²×R=100×8=800W. S=V×I=100×10=1000VA. Q=I²×XL=100×6=600VAr. Check: S²=P²+Q²→1000²=800²+600²→1,000,000=640,000+360,000=1,000,000 ✓",calc:true},

{t:"AC Theory & Waveforms",q:"What is 'inductive reactance' (XL) and how does it change with frequency?",opts:["XL = 2πfL — opposition to AC current by an inductor; XL increases proportionally with frequency","XL = 1/2πfC — decreases with frequency per AS/NZS 3000 requirements","XL = R×f — resistance multiplied by frequency for registered electricians","XL is constant regardless of frequency under the Electricity Act 1992"],a:0,exp:"Inductive reactance: XL = 2πfL (ohms). Where f = frequency (Hz) and L = inductance (Henry). XL is directly proportional to frequency — at higher frequencies an inductor presents more opposition to current flow. At DC (f=0): XL=0 (inductor is just a wire). At high AC frequency: XL can be very large.",calc:true},

{t:"AC Theory & Waveforms",q:"Calculate the inductive reactance of a 100mH inductor at 50Hz.",opts:["31.4Ω","5Ω","0.314Ω","314Ω"],a:0,exp:"XL = 2πfL = 2×3.1416×50×0.1 = 31.42Ω ≈ 31.4Ω.",calc:true},

{t:"AC Theory & Waveforms",q:"What is 'capacitive reactance' (XC) and how does it change with frequency?",opts:["XC = 1/(2πfC) — opposition to AC current by a capacitor; XC decreases as frequency increases","XC = 2πfC — increases with frequency under normal operating conditions","XC = R/f — resistance divided by frequency as required by AS/NZS 3000","XC equals XL at all frequencies for all LV installations in NZ"],a:0,exp:"Capacitive reactance: XC = 1/(2πfC). XC is inversely proportional to frequency — at higher frequencies a capacitor presents LESS opposition (passes AC more easily). At DC (f=0): XC = infinite (capacitor blocks DC). At high frequency: XC approaches zero.",calc:true},

{t:"AC Theory & Waveforms",q:"In a series RLC circuit at resonance, what is the relationship between XL and XC?",opts:["XL = XC — they cancel out, leaving only resistance R; impedance is at minimum, current is at maximum","XL + XC = maximum impedance","XL × XC = R²","Resonance only occurs when R = 0"],a:0,exp:"At resonance: XL = XC. The inductive and capacitive reactances cancel (they are 180° out of phase). Net reactance = XL - XC = 0. Z = R only. Current I = V/R = maximum. This is the series resonance condition.",},

// ══ POWER FACTOR — advanced ══

{t:"AC Theory & Waveforms",q:"A factory has a total load of 50kW with a power factor of 0.6 lagging. The supply authority requires pf improvement to 0.95 lagging. What type of equipment is added?",opts:["Power factor correction capacitors (capacitor bank) — capacitors supply reactive power, reducing the reactive current drawn from the supply","Additional inductors in series with each load","A larger transformer","Resistive load banks to balance the power factor"],a:0,exp:"Inductive loads (motors, fluorescent fittings) draw lagging reactive current, causing poor power factor. Capacitors draw leading reactive current — this opposes and partially cancels the lagging reactive current, improving overall power factor. This reduces total apparent current from the supply, lowering conductor and transformer losses.",},

{t:"AC Theory & Waveforms",q:"A 230V single-phase load draws 10A at pf 0.6. Calculate: true power (kW), apparent power (kVA), and reactive power (kVAr).",opts:["P=1.38kW, S=2.3kVA, Q=1.84kVAr","P=2.3kW, S=2.3kVA, Q=0kVAr","P=1.38kW, S=1.38kVA, Q=1.0kVAr","P=0.6kW, S=2.3kVA, Q=2.24kVAr"],a:0,exp:"S=V×I=230×10=2300VA=2.3kVA. P=S×pf=2300×0.6=1380W=1.38kW. Q=sqrt(S²-P²)=sqrt(2300²-1380²)=sqrt(5,290,000-1,904,400)=sqrt(3,385,600)=1840VAr=1.84kVAr.",calc:true},

// ══ ADVANCED CABLE / DERATING ══

{t:"Cables & Switchboards",q:"A 2.5mm² TPS cable has a current-carrying capacity (CCC) of 24A unenclosed at 30°C. Three identical circuits are bunched together. A derating factor of 0.7 applies. What is the derated CCC?",opts:["16.8A","24A","8.4A","33.6A"],a:0,exp:"Derated CCC = base CCC × derating factor = 24 × 0.7 = 16.8A. When cables are grouped/bunched, mutual heating reduces each cable's ability to dissipate heat — hence the derated current rating.",calc:true},

{t:"Cables & Switchboards",q:"A final subcircuit cable must carry 18A. The base CCC is 24A but cables are bunched (derating factor 0.7) and ambient temperature is high (temperature factor 0.94). Calculate the effective CCC.",opts:["15.8A","24A","22.6A","11.2A"],a:0,exp:"Effective CCC = 24 × 0.7 × 0.94 = 24 × 0.658 = 15.8A. Since the effective CCC (15.8A) is less than the required current (18A), this cable size is INADEQUATE — a larger CSA must be selected.",calc:true},

{t:"Cables & Switchboards",q:"Using the cable table from the real EWRB exam (3-core TPS, unenclosed touching, 75°C conductor, 30°C ambient): what is the minimum cable size to carry 39A for the delta kiln load?",opts:["6mm²","4mm²","10mm²","2.5mm²"],a:0,exp:"From AS/NZS 3000 Table 13 (used in ET63): 3-core TPS, unenclosed touching (column 3-4), 75°C conductor, 30°C ambient (derating factor = 1.0 at reference temperature). Required: ≥39A. From the table: 4mm² = 32A, 6mm² = 41A. Therefore minimum size = 6mm².",calc:true},

// ══ ADVANCED SCENARIO — fuse graph reading ══

{t:"Scenarios",q:"SCENARIO: A motor circuit has a 50A HRC fuse and a thermal overload set at 40A. Draw/describe the discrimination: if a 75A sustained overcurrent flows, which device operates and why?",opts:["Thermal overload operates (~10 min) — 75A is 1.875× the 40A setting, in the overload zone. HRC fuse does not operate at this level","The HRC fuse operates immediately — 75A exceeds the 50A rating under normal operating conditions","Both devices operate simultaneously as required by AS/NZS 3000 for the installation concerned","Neither device operates — 75A is within normal motor start range for all LV installations in NZ"],a:0,exp:"75A is 1.875× the 40A overload setting → thermal overload operates in ~2.5-10 minutes (from ET51 graph data: at 1.5× it operates in ~3 minutes). 75A = 1.5× the 50A HRC fuse rating — the HRC fuse would eventually operate but MUCH more slowly (hours). The thermal overload has a faster characteristic at this current level. Correct discrimination: overload protects, fuse stays intact."},

{t:"Scenarios",q:"SCENARIO: A motor circuit has a 50A HRC fuse and thermal overload set at 40A. A direct short circuit causes 500A to flow. Which device operates and how quickly?",opts:["The HRC fuse operates in milliseconds — 500A is 10× the fuse rating, deep in the instantaneous region of its characteristic curve","The thermal overload operates after 10 minutes under normal operating conditions under normal operating conditions","Both devices operate after 2 minutes as required by AS/NZS 3000 for the circuit in question","The RCD operates first, then the fuse for all LV installations in NZ per the EWRB requirements"],a:0,exp:"500A = 10× the 50A fuse rating. At this level the HRC fuse operates in the cut-off region — milliseconds (typically <10ms at 50Hz). The thermal overload CANNOT safely interrupt this fault current — it would be destroyed. HRC fuses are specifically rated for high fault current interruption. This demonstrates why HRC fuses are needed for short-circuit back-up even when thermal overloads are present."},

// ══ SCENARIO — complete motor nameplate ══

{t:"Scenarios",q:"SCENARIO: Motor nameplate reads: 30HP, 415V, 3-phase, 50Hz, 4-pole, RPM 1440, η=93.6%, cos θ=0.87, Ins. Class F, IP53, S1 duty. Calculate in sequence: output power (kW), input power (kW), then line current.",opts:["Pout=22.38kW, Pin=23.91kW, IL=38.24A","Pout=30kW, Pin=32.05kW, IL=52A","Pout=22.38kW, Pin=22.38kW, IL=36.7A","Pout=30kW, Pin=30kW, IL=41.8A"],a:0,exp:"Step 1: Pout=30×746=22,380W=22.38kW. Step 2: Pin=22380/0.936=23,910W=23.91kW. Step 3: IL=Pin/(sqrt(3)×VL×pf)=23910/(1.732×415×0.87)=23910/625.3=38.24A. This is the exact ET62 Question 4 worked solution.",calc:true},

{t:"Scenarios",q:"SCENARIO: A 30HP motor (Pout=22.38kW) runs at 1440rpm. The load requires 142.63Nm torque at 1440rpm. Verify whether the motor can drive this load — calculate required power and compare to motor output.",opts:["Required P=21.51kW < motor Pout=22.38kW — YES the motor can drive the load with 0.87kW margin","Required P=22.38kW = motor output — YES but no safety margin","Required P=25kW > motor output — NO the motor is undersized","Required P=142.63kW — NO far beyond motor capacity"],a:0,exp:"Required P=2π×1440×142.63/60=(2×3.1416×1440×142.63)/60=1,290,594/60=21,510W=21.51kW. Motor Pout=22.38kW. Since 22.38>21.51, the motor CAN drive the load. Margin = 22.38-21.51=0.87kW=3.9%. This is acceptable. (ET62 Q4 exact question)",calc:true},

{t:"Scenarios",q:"A motor nameplate shows: Ins. Class F, IP53, S1 duty. What does each of these designations mean?",opts:["Ins F=max winding temp 155°C; IP53=dust/splash proof; S1=continuous rated duty","Ins F=flame-proof enclosure; IP53=fully waterproof; S1=short time duty","Ins F=field winding type; IP53=indoor use only; S1=star connected","Ins F=50Hz frequency; IP53=53 amp protection; S1=single phase"],a:0,exp:"Insulation Class F: maximum winding temperature 155°C (rise 100°C in 40°C ambient). IP53: first digit 5 = dust protected (no harmful dust ingress); second digit 3 = protected against water spray up to 60° from vertical. S1 duty: continuous operation — motor can run indefinitely at full rated load without overheating."},

// ══ ADVANCED SAFETY ══

{t:"Personal Safety & Isolation",q:"An electrician is working alone on an isolated piece of equipment. The isolating switch is 20 metres away in a locked room. Describe the correct isolation procedure.",opts:["Open isolator, apply lock and personal Danger Tag to the isolator, use Prove-Test-Prove at the equipment — only then work on it","Turn off the isolator and rely on the locked room under normal operating conditions","Post a sign on the equipment only as required by AS/NZS 3000 when correctly installed","Work quickly without isolation since the room is locked for all LV installations in NZ"],a:0,exp:"Even with the isolator in a locked room: (1) Enter room, open isolator, apply lock and personal Danger Tag with name/date/time. (2) Secure the room key personally. (3) Return to equipment and apply Prove-Test-Prove to confirm dead. (4) Apply secondary Danger Tag at equipment if accessible. The lock protects against someone operating the isolator; the test confirms it worked."},

{t:"Personal Safety & Isolation",q:"Two electricians (A and B) are working on the same isolated equipment. Both need to work safely — describe the Danger Tag requirements.",opts:["Each electrician applies their OWN personal Danger Tag to the isolator — BOTH tags must be removed before the supply can be restored","One electrician applies a single tag representing both workers — this approach is acceptable","The senior electrician applies one tag covering all workers and is fully compliant","One tag is sufficient — the second worker relies on the first worker's tag as per standard practice"],a:0,exp:"Each person working on the equipment MUST apply their own personal Danger Tag. The isolator cannot be re-energised until ALL tags are removed — ensuring every worker has completed their work and personally authorised re-energisation. One worker cannot remove another's tag."},

{t:"Personal Safety & Isolation",q:"You are testing a circuit with a multimeter set to measure voltage. The circuit reads zero volts. Before starting work, what must you do before trusting this reading?",opts:["Apply Prove-Test-Prove: verify the meter reads correctly on a known live source, THEN test the circuit, THEN verify the meter still works — only then trust the zero reading","Zero reading means safe — start work immediately under normal operating conditions and is fully compliant","Test the circuit twice with the same instrument as required by AS/NZS 3000 as per standard practice","Check the circuit diagram confirms the circuit should be dead for all LV installations in NZ without any additional testing"],a:0,exp:"A zero reading could mean: (a) circuit is genuinely dead, OR (b) the test instrument is faulty/has a flat battery/broken lead. Prove-Test-Prove eliminates option (b): PROVE on known live source → TEST on circuit → PROVE again on known live source. If the meter reads correctly before AND after, you can trust the zero reading."},

// ══ HEALTH & SAFETY AT WORK (HSWA 2015) ══

{t:"Health & Safety (HSWA 2015)",
q:"Under the Health and Safety at Work Act 2015 (HSWA), what does the acronym 'PCBU' stand for?",
opts:["Person Conducting a Business or Undertaking","Primary Circuit Breaker Unit","Power Control Board Unit","Provisional Compliance By the User"],
a:0,exp:"PCBU = Person Conducting a Business or Undertaking. This includes companies, self-employed sole traders, partnerships, and organisations. A self-employed electrician IS a PCBU. A PCBU has the primary duty of care under HSWA."},

{t:"Health & Safety (HSWA 2015)",
q:"An electrician runs their own business and is contracted to a building company to do electrical work on a project. Under HSWA, is the electrician a PCBU?",
opts:["Yes — a self-employed electrician conducting their electrical business is a PCBU, even while working for another company","No — only companies with employees are PCBUs in all electrical installations","No — only the building company is a PCBU on site under normal operating conditions","Only if they have more than 5 employees as required by AS/NZS 3000"],
a:0,exp:"Yes. A self-employed person conducting a business is a PCBU. The electrician is ALSO a worker of the building company PCBU. A person can have more than one role. Both the building company AND the electrician (as a PCBU) have duties under HSWA."},

{t:"Health & Safety (HSWA 2015)",
q:"Under HSWA 2015, what is the PRIMARY DUTY OF CARE of a PCBU?",
opts:["Ensure the health and safety of workers and that other people are not put at risk by the work, so far as is reasonably practicable","Ensure all workers hold a current first aid certificate for all LV installations in NZ","Provide written contracts for all workers when tested per Regulation 24","Maintain a register of all tools and equipment under the Electricity Act 1992"],
a:0,exp:"The primary duty of care: a PCBU must ensure, so far as is reasonably practicable, the health and safety of workers while they are at work, AND that the health and safety of other people is not put at risk by the work carried out. 'So far as is reasonably practicable' means what can reasonably be done given the nature of the risk and the cost involved."},

{t:"Health & Safety (HSWA 2015)",
q:"Under HSWA, who is an 'officer' of a PCBU and what are their duties?",
opts:["A person who occupies a position that allows them to significantly influence management of the business (e.g. director, CEO) — they must exercise due diligence to ensure the PCBU meets its health and safety duties","Any worker with a health and safety representative role per EWRB requirements under normal operating conditions — this is the correct NZ practice","A government health and safety inspector under standard conditions as required by HSWA 2015 in standard LV installations","Any worker who holds a first aid certificate in all electrical installations per the Electricity Act 1992 per AS/NZS 3000 requirements"],
a:0,exp:"An officer is a person who makes, or significantly influences, decisions about the management of the business (e.g. company directors, CEOs, partners). Officers must exercise 'due diligence' — taking reasonable steps to understand hazards, ensure resources for H&S, and verify that management systems work."},

{t:"Health & Safety (HSWA 2015)",
q:"Under HSWA, what does 'so far as is reasonably practicable' mean when applied to health and safety duties?",
opts:["Whatever the employer can afford after paying wages and overheads","Taking all steps that would be taken given the likelihood and severity of harm, what is known about the hazard, the availability of controls, and the cost — unless that cost is grossly disproportionate to the risk","Doing the minimum required by law regardless of actual risk","Only measures required by a WorkSafe inspector"],
a:0,exp:"Reasonably practicable considers: the likelihood of the risk occurring, the severity of potential harm, what is reasonably known about the hazard and ways to eliminate/minimise it, the availability and suitability of controls, and the cost. A PCBU does not have to eliminate every possible risk at any cost — but cost alone is not a reason not to act."},

{t:"Health & Safety (HSWA 2015)",
q:"Under HSWA, what is the hierarchy of risk controls that a PCBU must follow?",
opts:["Eliminate the risk if practicable; if not, minimise using: substitution, isolation, engineering controls, administrative controls, PPE — in that order","Provide PPE first, then administrative controls, then engineering controls under normal operating conditions","Risk controls are at the discretion of the PCBU as required by AS/NZS 3000 per AS/NZS 3000 requirements","Document the risk first, then review it annually for all LV installations in NZ for registered electricians"],
a:0,exp:"Hierarchy (in order, most effective first): 1. Eliminate — remove the hazard completely. 2. If cannot eliminate, minimise by: Substitution (replace with something safer), Isolation (barrier between worker and hazard), Engineering controls (guard, interlock), Administrative controls (procedures, training), PPE (last resort). PPE is the least effective control because it relies on human behaviour."},

{t:"Health & Safety (HSWA 2015)",
q:"An electrician is working on a live electrical panel. Under HSWA, what is the PREFERRED approach to managing the risk?",
opts:["Eliminate the risk by isolating and de-energising the panel before working — live work should only be done if de-energising creates greater risk or is not reasonably practicable","Wear rubber gloves (PPE) and proceed with live work when tested per Regulation 24 for registered electricians","Issue a Permit to Work and proceed with live work under the Electricity Act 1992 under the Electricity Act 1992","Put a barrier around the panel and continue working live per EWRB requirements as tested and verified on site"],
a:0,exp:"Under HSWA and the Electricity (Safety) Regulations, eliminating the hazard (de-energising/isolating) is always the first preference. Live electrical work creates high risk of electrocution. Live work is only justified if isolation is not reasonably practicable or would itself create greater risk. PPE alone (rubber gloves) is the last resort and least effective control."},

{t:"Health & Safety (HSWA 2015)",
q:"Under HSWA, what are a WORKER's health and safety duties?",
opts:["Take reasonable care for their own health and safety and that of others, comply with reasonable PCBU instructions, and cooperate with the PCBU's health and safety policies","Workers have no duties — only PCBUs have duties under standard conditions under the Electricity Act 1992","Workers only have duties if they are also health and safety representatives in all electrical installations as tested and verified on site","Workers must only follow instructions from WorkSafe inspectors under normal operating conditions to comply with the regulations"],
a:0,exp:"Workers' duties under HSWA Section 45: take reasonable care for their own H&S; take reasonable care that their acts/omissions do not adversely affect others; comply with reasonable PCBU instructions; cooperate with PCBU H&S policies/procedures. Workers ALSO have the right to refuse unsafe work."},

{t:"Health & Safety (HSWA 2015)",
q:"WorkSafe NZ is the primary health and safety regulator. Under HSWA, what powers does a WorkSafe inspector have?",
opts:["Enter workplaces without notice, require production of documents, take samples, issue improvement notices and prohibition notices, initiate prosecution","Only enter workplaces with 24 hours prior written notice as required by AS/NZS 3000","Only issue written warnings — no power to prohibit work for all LV installations in NZ","Inspectors can only observe — they cannot require anything when tested per Regulation 24"],
a:0,exp:"WorkSafe inspectors have broad powers: enter any workplace without prior notice, require documents/information, take samples, interview people, issue improvement notices (requiring action), prohibition notices (stopping dangerous work immediately), and refer serious breaches for prosecution. Failing to comply with a notice is a criminal offence."},

{t:"Health & Safety (HSWA 2015)",
q:"Under HSWA, what is a 'notifiable event' that must be reported to WorkSafe?",
opts:["Any incident where a worker is injured at work, regardless of severity","A death, serious injury or illness (SII), or a notifiable incident (unplanned/uncontrolled event with serious harm potential) — must be reported to WorkSafe as soon as practicable","Any near-miss event that is documented in the incident register","Minor cuts and bruises that require first aid"],
a:0,exp:"Notifiable events: (1) death of any person, (2) notifiable injury or illness of a person (e.g. fracture, amputation, serious burn, hospitalisation), (3) notifiable incident — an unplanned or uncontrolled event that exposes a worker or any other person to a serious risk to their health or safety (e.g. near-miss electrical flash, electric shock). Must be reported immediately (phone) and documented within 48 hours."},

{t:"Health & Safety (HSWA 2015)",
q:"A worker suffers an electric shock while working on an installation. They recover at the scene but required medical attention. Must this be reported to WorkSafe?",
opts:["Yes — an electric shock requiring medical attention is a notifiable injury/illness and must be reported to WorkSafe as soon as practicable","No — only fatalities must be reported under the Electricity Act 1992 in all electrical installations","Only if the worker is hospitalised overnight per EWRB requirements — no further action is required","Only if the incident is on a commercial site, not residential under standard conditions for the installation concerned"],
a:0,exp:"Yes — electric shock requiring medical attention beyond first aid is a notifiable injury under HSWA Schedule 1. WorkSafe must be notified as soon as practicable (by phone). The scene of a notifiable event must be preserved until a WorkSafe inspector arrives or releases it (except to prevent further harm)."},

{t:"Health & Safety (HSWA 2015)",
q:"Under HSWA, what is a 'health and safety representative' (HSR) and what powers do they have?",
opts:["An elected worker representative who can investigate risks, issue Provisional Improvement Notices (PINs), and direct work to cease if there is serious risk","A WorkSafe government inspector assigned to the site in all electrical installations — no further action is required","The site manager responsible for all H&S documentation under normal operating conditions for the installation concerned","A first aid officer who treats injuries on site as required by AS/NZS 3000 under normal operating conditions"],
a:0,exp:"An HSR is elected by workers to represent their H&S interests. HSRs can: attend workplaces, accompany inspectors, investigate complaints, request information, issue a Provisional Improvement Notice (PIN) if they believe there is a contravention, and direct work to cease if they reasonably believe there is a serious risk. PCBUs must consult with HSRs."},

{t:"Health & Safety (HSWA 2015)",
q:"What is the Site Safe Passport and why is it relevant to electricians working on construction sites in NZ?",
opts:["A passport-sized document proving an electrician's trade registration — required to enter all NZ construction sites","A health and safety induction card showing the holder has completed a recognised construction site H&S induction course — required by many contractors before allowing workers on site","A document issued by WorkSafe confirming the site is safe to enter","A permit to work on live electrical installations"],
a:0,exp:"Site Safe Passport: a wallet-sized card issued to workers who complete a recognised site H&S induction (Site Safe Foundation Course). It certifies basic H&S knowledge for construction environments. Many main contractors require all workers (including electricians) to hold a current Site Safe Passport before entering site. It is NOT a trade registration document."},

// ══ ELECTRICITY ACT 1992 & REGULATIONS ══

{t:"Electricity Act & Regulations NZ",
q:"What is the primary purpose of the Electricity Act 1992?",
opts:["To set cable sizing requirements for all NZ electrical installations","To establish the legislative framework for electrical safety, supply of electricity, and the registration and licensing of electrical workers in New Zealand","To define the AS/NZS 3000 wiring standards","To regulate electricity pricing for consumers"],
a:0,exp:"The Electricity Act 1992 is the parent legislation for electricity in NZ. It establishes: the framework for electrical safety, the regime for electricity supply and lines companies, the registration/licensing system for electrical workers (via EWRB), and offences/penalties for unsafe electrical work. All other electrical regulations (like the Electricity Safety Regulations 2010) are made under this Act."},

{t:"Electricity Act & Regulations NZ",
q:"Under the Electricity (Safety) Regulations 2010, what is 'prescribed electrical work' (PEW)?",
opts:["Any work performed near electrical equipment regardless of whether it is energised","Electrical work on fixed wiring, switchboards, and electrical installations that must be performed by or under the direct supervision of a registered electrical worker","Only work on high-voltage (HV) systems above 1000V","Installing light bulbs and replacing fuses in plug tops"],
a:0,exp:"PEW is defined in the Electricity (Safety) Regulations 2010. It covers installation, maintenance, alteration, repair, and testing of electrical wiring, switchboards, fittings, and electrical installations. PEW must be done by a registered/licensed electrician or a trainee under direct supervision. Non-prescribed work (e.g. plug-top fuse replacement) can be done by anyone."},

{t:"Electricity Act & Regulations NZ",
q:"What are the THREE risk categories of prescribed electrical work under the Electricity (Safety) Regulations 2010?",
opts:["Low risk, general risk, and high risk","Domestic, commercial, and industrial","Single-phase, three-phase, and ELV","New work, repair work, and maintenance work"],
a:0,exp:"The Electricity (Safety) Regulations 2010 classify PEW into three risk categories: (1) Low risk — simple replacement/repair work (e.g. replacing a switch, socket outlet, or light fitting). Requires an ESC. (2) General risk — most installation work (new circuits, rewiring). Requires a CoC and ESC. (3) High risk — complex high-risk work (consumer substations, generating sets, etc.). Requires a Record of Inspection (RoI), CoC, and ESC."},

{t:"Electricity Act & Regulations NZ",
q:"What is an Electrical Safety Certificate (ESC) and when must it be issued?",
opts:["A document certifying that PEW has been tested, is electrically safe, and may be connected to supply — must be issued as soon as practicable after the work is connected to a power supply (within 20 working days)","A document certifying the electrician's licence is current — issued annually for all LV installations in NZ for all supply voltages","A pre-work risk assessment certificate issued before starting any PEW when tested per Regulation 24 when correctly installed","A quality inspection certificate issued by the supply authority under the Electricity Act 1992 — this approach is acceptable"],
a:0,exp:"An ESC (under Regulation 74A) certifies that the PEW has been tested and is electrically safe to use and will not adversely affect other parts of the installation. It must be issued as soon as possible after the work is connected to power supply, and no later than 20 working days. A trainee cannot issue an ESC alone — the supervising registered electrician must sign it."},

{t:"Electricity Act & Regulations NZ",
q:"What is a Certificate of Compliance (CoC) and for what category of PEW is it required?",
opts:["A CoC is required for general risk and high risk PEW — it certifies the work was done lawfully and safely and complies with the Electricity (Safety) Regulations 2010","A CoC is only required for high-risk work on HV systems per EWRB requirements when correctly installed","A CoC replaces the ESC for commercial installations under standard conditions — this approach is acceptable","A CoC is issued by WorkSafe to confirm site compliance in all electrical installations and is fully compliant"],
a:0,exp:"A CoC (under Regulation 65) is required for general risk and high risk PEW. It certifies that the completed PEW was done lawfully, safely, and complies with the Regulations. For high risk work, a Record of Inspection (RoI) is also required BEFORE a CoC can be issued. Low risk PEW only requires an ESC (no CoC required)."},

{t:"Electricity Act & Regulations NZ",
q:"To whom must copies of the CoC and ESC be provided, and within what timeframe?",
opts:["To the person who contracted or authorised the work, as soon as possible and within 20 working days — or to the owner/occupier if the contracting person cannot be contacted","To WorkSafe NZ only, within 5 working days under normal operating conditions — this approach is acceptable","To the supply authority and the EWRB within 30 days as required by AS/NZS 3000 and is fully compliant","They are kept by the electrician only — no copies required for all LV installations in NZ as per standard practice"],
a:0,exp:"Under the Electricity (Safety) Regulations 2010, copies of the CoC and ESC must be provided to the person who contracted/authorised the work as soon as practicable and within 20 working days. If that person cannot be contacted, copies go to the owner or occupier. The electrician retains a copy. For non-consented small standalone dwellings (granny flats), copies must go to BOTH the contracting person AND the owner/occupier."},

{t:"Electricity Act & Regulations NZ",
q:"Under Regulation 74A of the Electricity (Safety) Regulations 2010, what happens when a trainee completes PEW under supervision?",
opts:["The trainee issues the ESC themselves and emails it to the EWRB","The supervising registered electrician must date and sign the ESC, and the supervisor's registration number must be included on the ESC","The trainee does not need any certification documentation","The supervisor must issue a separate certificate in addition to the trainee's ESC"],
a:0,exp:"Under Regulation 74A(3)(f)(ii) and (g)(iii): when a trainee acts under supervision, the supervisor must date and sign the ESC, and the supervisor's registration number must appear on the ESC. The trainee cannot issue an ESC independently. This ensures the registered supervisor takes responsibility for the work and its certification."},

{t:"Electricity Act & Regulations NZ",
q:"What organisation is responsible for the registration and licensing of electrical workers in New Zealand?",
opts:["WorkSafe NZ","The Electrical Workers Registration Board (EWRB)","The Ministry of Business, Innovation and Employment (MBIE) directly","The Energy Efficiency and Conservation Authority (EECA)"],
a:0,exp:"The EWRB (Electrical Workers Registration Board) is the statutory body responsible for registering and licensing electrical workers in NZ under the Electricity Act 1992. The EWRB sets exam requirements (via ASPEQ), issues licences, investigates complaints, and takes disciplinary action against electrical workers who breach the Act or Regulations."},

{t:"Electricity Act & Regulations NZ",
q:"What types of electrical worker registration/licences are available in New Zealand?",
opts:["Electrician, Electrical Inspector, Electrical Service Technician, Line Mechanic, and Installer (among others)","Only two types: Domestic and Commercial when tested per Regulation 24","Apprentice, Journeyman, and Master Electrician under the Electricity Act 1992","Registered and Unregistered — only two categories per EWRB requirements"],
a:0,exp:"Under the Electricity Act 1992 and Regulations, registration categories include: Electrician, Electrical Inspector, Electrical Service Technician, Line Mechanic, Electrical Appliance Serviceperson, Installer (line mechanic), and others. Each category has specific scope of work and examination requirements. Trainees hold a Trainee Limited Certificate (TLC) while working toward registration."},

{t:"Electricity Act & Regulations NZ",
q:"What offences under Section 143 of the Electricity Act 1992 can result in EWRB disciplinary action?",
opts:["Negligently creating risk of serious harm, carrying out PEW without authorisation, providing false/misleading certification, and bringing the profession into disrepute","Only criminal offences under the Crimes Act 1961 under standard conditions for domestic installations","Only failure to pay EWRB registration fees in all electrical installations — this is the correct NZ practice","Only performing work outside normal working hours under normal operating conditions in standard LV installations"],
a:0,exp:"Section 143 disciplinary offences include: (a) conviction of offence reflecting adversely on fitness, (b) negligently creating risk of serious harm, (c) incompetent performance of PEW, (d) failure to comply with EWRB directions, (e) breach of Act/Regulations, (f) providing false/misleading certification, (g) conduct likely to bring the profession into disrepute. Penalties include reprimand, suspension, cancellation of registration, and fines."},

{t:"Electricity Act & Regulations NZ",
q:"What is the difference between a registered electrical worker and a licensed electrical worker in NZ?",
opts:["Registration means the worker is on the EWRB register (theoretical component); a licence (issued annually) allows them to actually carry out PEW — both registration and a current licence are required to perform PEW","They are the same thing — registration and licence are interchangeable terms as required by AS/NZS 3000 — this is the correct NZ practice","A registered worker can work unsupervised; a licensed worker must be supervised for all LV installations in NZ in standard LV installations","Licensed workers only work on commercial sites; registered workers on domestic when tested per Regulation 24 per AS/NZS 3000 requirements"],
a:0,exp:"Under the Electricity Act 1992: Registration is the permanent record on the EWRB register showing the class and scope of work. A Practising Licence must be obtained annually (by paying the levy) to actually carry out PEW. You can be registered but not hold a current licence (if you haven't paid the annual levy or are not currently working as an electrician). Both are required to legally perform PEW."},

// ══ REGULATIONS — SUPERVISION & TRAINING ══

{t:"Electricity Act & Regulations NZ",
q:"A trainee electrician holds a Trainee Limited Certificate (TLC). Under the Electricity (Safety) Regulations, what does 'direct supervision' mean when a trainee carries out PEW?",
opts:["The supervising registered electrician is on the same site and readily available to give immediate assistance — they are responsible for the work","The supervising electrician reviews the work at the end of each week in standard LV installations","The supervisor only needs to be contactable by phone while the trainee works per AS/NZS 3000 requirements","The trainee can work fully independently after 2 years of experience for registered electricians"],
a:0,exp:"Direct supervision requires the supervising registered electrician to be on the same work site and readily available to give immediate assistance or guidance. The supervisor is responsible for the quality and safety of the trainee's work. The supervisor must sign the ESC for work done by a trainee under their supervision."},

{t:"Electricity Act & Regulations NZ",
q:"Under the Electricity (Safety) Regulations 2010, what is the requirement for testing PEW before issuing an ESC?",
opts:["The PEW must be tested in accordance with AS/NZS 3000 Section 8 testing requirements to confirm it is electrically safe — testing must be completed before the ESC is issued","Only a visual inspection is required — no instrument testing under the Electricity Act 1992 per AS/NZS 3000 requirements","Testing is only required for three-phase installations per EWRB requirements for registered electricians","Testing is optional — the electrician certifies based on their knowledge under standard conditions under the Electricity Act 1992"],
a:0,exp:"Under Regulation 74A: the PEW must be tested in accordance with AS/NZS 3000 (or other applicable standards) to confirm it is electrically safe and will not adversely affect other parts of the installation. The required tests include: insulation resistance, earth continuity, polarity, and earth fault loop impedance. Only after satisfactory testing can the ESC be issued."},

// ══ AS/NZS 3000 — WIRING RULES SPECIFIC ══

{t:"Electricity Act & Regulations NZ",
q:"AS/NZS 3000 is commonly called the 'Wiring Rules'. What does it cover?",
opts:["The requirements for the design, installation, inspection, testing, and maintenance of low voltage electrical installations in Australia and New Zealand","Only the requirements for cable sizing and voltage drop in all electrical installations","The requirements for high voltage (HV) transmission lines only under normal operating conditions","The building code requirements for electrical rooms as required by AS/NZS 3000"],
a:0,exp:"AS/NZS 3000 (Wiring Rules) covers the design, selection, installation, inspection, testing, and maintenance of electrical installations. It applies to: new electrical installations, extensions/alterations to existing installations, and repair work. It sets minimum safety requirements. Compliance with AS/NZS 3000 is a legal requirement under the Electricity (Safety) Regulations 2010."},

{t:"Electricity Act & Regulations NZ",
q:"What is the maximum permissible voltage drop from the point of supply to any point of utilisation under AS/NZS 3000?",
opts:["5% of the nominal supply voltage under normal load conditions","2% of the nominal supply voltage","10% of the nominal supply voltage","3% — but only for lighting circuits"],
a:0,exp:"AS/NZS 3000 Clause 3.6.2: maximum 5% voltage drop from point of supply to any utilisation point under normal operating conditions. At 230V: 5% = 11.5V maximum drop. At 400V (3-phase): 5% = 20V maximum drop."},

{t:"Electricity Act & Regulations NZ",
q:"Under AS/NZS 3000, what are the minimum requirements for the protective earthing conductor size relative to the associated phase conductor?",
opts:["The protective earthing conductor must be at least half the CSA of the phase conductor, with a minimum of 1.5mm² copper","The earth conductor must always match the phase conductor CSA exactly as tested and verified on site","There is no minimum size — any conductor can be used as earth to comply with the regulations","Earth conductors are not required if an RCD is installed in all electrical installations"],
a:0,exp:"AS/NZS 3000 Table 5.1: the minimum CSA of a protective earthing conductor (PEC) is related to the phase conductor CSA. For phase conductors up to 16mm², the PEC must be equal in CSA. For larger phase conductors, the PEC can be smaller (but not less than 16mm² copper). The absolute minimum PEC for a flexible cord is 1.0mm²."},

{t:"Electricity Act & Regulations NZ",
q:"Under AS/NZS 3000, where must single-pole switches and protective devices be installed in a circuit?",
opts:["In the phase (active) conductor only — never in the neutral conductor","In the neutral conductor to reduce risk","In either conductor — it does not matter which","In the earth conductor for added safety"],
a:0,exp:"AS/NZS 3000: all single-pole switches, fuses, and circuit breakers MUST be connected in the phase (active) conductor only, never the neutral. If a switch were in the neutral, the load would remain live at phase voltage even with the switch open — a fatal shock hazard. This is verified by the polarity test during commissioning."},

{t:"Electricity Act & Regulations NZ",
q:"Under AS/NZS 3000, what is required at the point where a cable enters a switchboard, enclosure, or conduit entry?",
opts:["A bushing, grommet, or other protection to prevent chafing and mechanical damage to the cable insulation at the entry point","A fuse must be installed at every cable entry for all LV installations in NZ","The cable must be soldered to the enclosure when tested per Regulation 24","No specific requirement — any method is acceptable under the Electricity Act 1992"],
a:0,exp:"AS/NZS 3000: where cables pass through metalwork, conduit entries, or enclosure walls, a smooth bushing, grommet, or protective sleeve must be used to prevent sharp edges chafing through cable insulation. Chafed insulation can cause an earth fault or phase-to-phase short circuit."},

{t:"Electricity Act & Regulations NZ",
q:"Under AS/NZS 3000, what is the minimum height for socket outlets installed in domestic bathrooms?",
opts:["Socket outlets are prohibited in domestic bathrooms — only shaver outlets are permitted within Zone 2 (0.6m from shower/bath) and must be an isolating transformer type","Any height — bathroom socket outlets have no height restriction per EWRB requirements for all NZ electrical workers","Minimum 1.2m above floor level under standard conditions under the relevant regulations","Minimum 1.8m above floor level in all electrical installations in standard NZ practice"],
a:0,exp:"AS/NZS 3000: standard socket outlets are prohibited in bathrooms, shower rooms, and similar wet areas due to electric shock risk. A shaver supply unit (with isolating transformer) is permitted within 0.6m of a bath or shower (Zone 2). Outside Zone 2 (more than 0.6m), a GFCI/RCD-protected socket outlet may be permitted under certain conditions."},

{t:"Electricity Act & Regulations NZ",
q:"Under AS/NZS 3000, what protection must be provided for socket outlets that may be used to supply portable equipment outdoors or in wet areas?",
opts:["A 30mA RCD must protect socket outlets that may supply portable equipment used outdoors, in wet areas, or in other high-risk locations","Only a standard MCB is required under normal operating conditions for the installation concerned","An isolating transformer is required for all outdoor sockets as required by AS/NZS 3000","No special protection is required if the socket has an IP65 rating for all LV installations in NZ"],
a:0,exp:"AS/NZS 3000 Clause 2.6: socket outlets that may supply portable electrical equipment in locations where increased risk of electric shock exists (outdoors, wet areas, construction sites) MUST be protected by a 30mA RCD (Type A). This is also required by the Electricity (Safety) Regulations 2010."},

// ══ SCENARIO — REGULATIONS APPLIED ══

{t:"Scenarios",
q:"SCENARIO: An electrician completes a new power circuit in a domestic house. The circuit is connected to the main switchboard and energised. What certification must be issued, to whom, and by when?",
opts:["Both a Certificate of Compliance (CoC) and an Electrical Safety Certificate (ESC) must be issued to the person who contracted the work, as soon as practicable and within 20 working days","Only an ESC is required for domestic work when tested per Regulation 24 under normal operating conditions","A CoC is issued within 30 days — no ESC is required for single-phase work under the Electricity Act 1992 as required by HSWA 2015","Only a verbal confirmation is required for domestic work per EWRB requirements per the Electricity Act 1992"],
a:0,exp:"A new power circuit = general risk PEW. Required: (1) CoC (Regulation 65) — certifies the work was done lawfully and complies with regulations. (2) ESC (Regulation 74A) — certifies the work is safe and tested. Both must be given to the contracting person (homeowner or contractor) as soon as practicable and within 20 working days of the work being energised."},

{t:"Scenarios",
q:"SCENARIO: A trainee electrician under a TLC completes a switchboard upgrade under the supervision of a registered electrician. Who signs the ESC and what information must it include about the supervisor?",

a:0,exp:"Regulation 74A(3)(f)(ii) and (g)(iii): the SUPERVISING REGISTERED ELECTRICIAN must sign and date the ESC. The supervisor's EWRB registration number MUST be on the ESC. The trainee cannot issue an ESC independently — the supervisor takes legal responsibility for the certification of the work."},

{t:"Scenarios",
q:"SCENARIO: A registered electrician replaces a faulty socket outlet (low risk PEW). What certification is required?",
opts:["An Electrical Safety Certificate (ESC) only — low risk PEW requires an ESC but NOT a Certificate of Compliance (CoC)","A CoC and ESC are both required for any PEW under standard conditions","No certification is required for simple replacement work in all electrical installations","Only a text message to the homeowner confirming the work is done under normal operating conditions"],
a:0,exp:"Replacement of a socket outlet is LOW RISK PEW. Under the Electricity (Safety) Regulations 2010: low risk PEW requires only an ESC — no CoC is required. The ESC confirms the replacement has been tested and is electrically safe. General risk PEW (new circuits, rewiring) requires both a CoC AND an ESC."},

{t:"Scenarios",
q:"SCENARIO: An electrician installs a consumer substation (high risk PEW). What certification is required and in what sequence?",
opts:["Record of Inspection (RoI) issued first, then Certificate of Compliance (CoC), then Electrical Safety Certificate (ESC) when energised","ESC only — high risk work only needs one certificate as required by AS/NZS 3000 for all supply voltages","CoC only — issued after completion for all LV installations in NZ when correctly installed","No certification required for substation work — supply authority handles it when tested per Regulation 24"],
a:0,exp:"High risk PEW requires ALL THREE documents in sequence: (1) Record of Inspection (RoI) — must be issued BEFORE the CoC can be completed. (2) Certificate of Compliance (CoC) — certifies the work complies with regulations. (3) Electrical Safety Certificate (ESC) — issued when the work is energised. This is the most extensive certification requirement."},

{t:"Scenarios",
q:"SCENARIO: An electrician fails to issue a CoC for general risk PEW and does not provide it within 20 working days. What can the EWRB do?",
opts:["Take disciplinary action under Section 143(f) of the Electricity Act 1992 for providing a false or misleading return, or failing to provide certification in the required timeframe","Issue a verbal warning only — first offence is never disciplined under the Electricity Act 1992 for all NZ electrical workers","Refer the matter to WorkSafe only per EWRB requirements under the relevant regulations when correctly installed","Cancel the electrician's licence without any disciplinary process under standard conditions in standard NZ practice — this approach is acceptable"],
a:0,exp:"Failure to issue required certification (or providing false/misleading certification) is a disciplinary offence under Section 143(f) of the Electricity Act 1992. The EWRB can: issue a formal warning, impose a fine, require remedial training, suspend the licence, or cancel the registration. This is one of the most common EWRB disciplinary matters."},

// ══ SCENARIO — H&S APPLIED TO ELECTRICAL WORK ══

{t:"Scenarios",
q:"SCENARIO: An electrician is asked by a site foreman to work on a live 230V distribution board because de-energising it would shut down the building's computer systems. Under HSWA, what should the electrician do?",
opts:["Assess whether the risk of live work is justified — if de-energising is not reasonably practicable and the risk cannot be adequately managed with other controls, work may proceed with appropriate controls (PPE, buddy system, written procedure). If risk cannot be adequately managed, refuse the live work","Proceed with live work — the foreman has the authority to make this decision in all electrical installations under normal operating conditions — this approach is acceptable","Refuse all live work under any circumstances — it is always illegal under normal operating conditions as required by HSWA 2015 and is fully compliant without any additional testing","Only proceed if the electrician holds a live work permit from WorkSafe as required by AS/NZS 3000 per the Electricity Act 1992 as per standard practice for domestic installations"],
a:0,exp:"Under HSWA, the PCBU (electrician or their employer) must assess the risk. The preferred approach is elimination (de-energise). Live work is only justified if de-energising is not reasonably practicable OR creates greater risk. If live work is justified: use appropriate controls — insulated tools, rubber gloves (Class 0 minimum), rubber mat, trained observer/buddy, written procedure. If the risk cannot be adequately controlled, the electrician has the right to refuse unsafe work under HSWA Section 83."},

{t:"Scenarios",
q:"SCENARIO: An electrician working alone in a factory notices a colleague has been electrocuted and is lying in contact with a live conductor. The supply switch is 15m away. Describe the correct response.",
opts:["Isolate the supply at the switch immediately — do not touch the person until isolated. Then apply Prove-Test-Prove, call 111, apply CPR if trained and person is not breathing","Touch the person immediately to check if they are conscious for all LV installations in NZ","Apply CPR immediately without checking if the person is still live when tested per Regulation 24","Call 111 first and wait for the ambulance before taking any action under the Electricity Act 1992"],
a:0,exp:"PRIORITY 1: Scene safety. Do NOT touch the person while they may still be live. Isolate the supply at the switch (15m away). Apply Prove-Test-Prove to confirm isolation. THEN approach the casualty. Call 111. Apply CPR if trained and person is not breathing. This is a notifiable event — WorkSafe must be notified. Preserve the scene until released by WorkSafe."},

{t:"Scenarios",
q:"SCENARIO: An electrician is about to start work in a confined space (a buried cable pit). Under HSWA, what must occur BEFORE entry?",
opts:["A confined space entry permit must be issued: atmosphere tested for oxygen deficiency and toxic gases, rescue plan established, communications maintained, trained standby person stationed outside — BEFORE entry","Simply inform the site supervisor and enter per EWRB requirements for all NZ electrical workers as per standard practice","Only required if the space is underground — above-ground confined spaces need no permit under standard conditions under the relevant regulations","Wear a hard hat and hi-vis vest then enter in all electrical installations in standard NZ practice without any additional testing"],
a:0,exp:"Confined space entry under HSWA/WorkSafe regulations: requires a formal entry permit, atmospheric testing (oxygen 19.5–23.5%, toxic gas below LEL), isolation of all services (electrical, gas, water), a trained standby person outside the entry point, communications, and an emergency rescue plan. An electrician entering a cable pit or substation basement must follow confined space procedures."},
