{t:"Testing & Inspection",q:"An IR test on a 230 V installation gives 1 MΩ with MIMS equipment disconnected, but drops to 0.01 MΩ with MIMS equipment connected. Is the result acceptable?",opts:["Yes — 0.01 MΩ is the accepted minimum with MIMS elements connected","No — result must be 1 MΩ even with MIMS elements connected","No — testing with any equipment connected is not permitted","Yes — any reading above zero is acceptable when MIMS is connected"],a:0,exp:"AS/NZS 3000: with MIMS elements connected, the minimum IR is 0.01 MΩ (10 kΩ), because MIMS elements are characteristically low-resistance by their nature. With equipment disconnected the installation itself must read ≥1 MΩ."},

{t:"Testing & Inspection",q:"AS/NZS 3760 details TWO test methods to verify Class I appliance insulation. Name them and their acceptable results.",opts:["IR test (≥1 MΩ or ≥10,000 Ω) and earth leakage test (≤5 mA)","Voltage test (230 V at load terminals) and earth continuity test (≤1 Ω)","Polarity test (phase in correct terminal) and IR test (≥1 MΩ)","Earth fault loop impedance test and RCD trip time test"],a:0,exp:"AS/NZS 3760 specifies: (1) Insulation resistance test — minimum 1 MΩ (or 10,000 Ω for some equipment classes). (2) Earth leakage test — maximum 5 mA touch current while live. Either method confirms insulation integrity."},

{t:"Motors & Starters",q:"State TWO reasons for using reduced-voltage starting on a 3-phase induction motor.",opts:["Limit the starting current surge to reduce supply disturbance, and reduce mechanical shock on the driven machinery","Increase available starting torque and simultaneously improve supply power factor","Allow the motor to accelerate faster and reach running speed with lower slip","Protect the motor against single-phasing and prevent thermal overload relay trips"],a:0,exp:"Reduced-voltage starting: (1) reduces starting current (up to 8× FLC for DOL) which causes voltage dips and supply disturbance. (2) Reduces mechanical shock torque on couplings, gearboxes, and driven equipment. Trade-off: starting torque also reduces."},

{t:"Motors & Starters",q:"Why are 6 conductors required between a star-delta starter and a 3-phase motor?",opts:["Both ends of all 3 windings must be accessible for star/delta changeover — 3 windings × 2 ends = 6 conductors","Three-phase supply requires 3 phase conductors plus 3 separate protective earth conductors","Star connection uses 3 conductors and delta uses 3 different conductors — hence 6 total","The motor requires two completely separate 3-phase supplies for the two connection methods"],a:0,exp:"A star-delta starter needs to access both ends of all three motor windings to reconnect them from star to delta. This means 6 conductors: U1, V1, W1 (one end of each winding) and U2, V2, W2 (other end). DOL starters only need 3 conductors (one end connection)."},

{t:"Motors & Starters",q:"What additional consideration is needed when a motor runs at low speeds for extended periods on a variable speed drive?",opts:["Internal shaft fan gives insufficient cooling at low speed — an external powered blower motor may be needed","The VSD automatically compensates by boosting cooling at low operating speeds","The motor stator must be rewound with a lower-resistance winding for low-speed use","A star-delta starter must also be installed in series with the VSD output terminals"],a:0,exp:"Standard induction motors use a shaft-mounted fan for cooling — effective only at normal running speed. At low VSD-controlled speeds, fan output is reduced. For extended low-speed operation, an external separately-powered cooling fan is required to prevent overheating."},

{t:"Motors & Starters",q:"Define 'ramp time' as it applies to a variable speed drive (VSD).",opts:["Time for the drive to accelerate from zero to set speed, or decelerate from set speed to stop","Time for the motor to reach synchronous speed under direct-on-line starting","Time elapsed between a stop command and the drive beginning to reduce frequency","The thermal time constant determining how quickly the motor heats under overload"],a:0,exp:"Ramp time in a VSD defines the rate of frequency change: acceleration ramp = time from 0 to full speed; deceleration ramp = time from full speed to 0. Longer ramp times reduce mechanical shock and starting current. Adjustable to suit the load."},

{t:"Motors & Starters",q:"A capacitor-start motor running normally suddenly experiences a 50% speed drop due to mechanical overload, and electrical protection fails to operate. What happens?",opts:["Centrifugal switch closes at reduced speed — start winding and capacitor reconnect, causing excessive current and overheating","The motor automatically restarts from zero once speed drops below synchronous speed","The supply voltage automatically rises to restore motor speed to normal","The RCD detects the increased leakage current and disconnects the motor"],a:0,exp:"Centrifugal switch: opens start winding at ~75–80% synchronous speed; closes again if speed drops below this. At 50% speed the switch closes, reconnecting start capacitor and winding — not designed for sustained use at running current. Excessive current flows, overheating the start winding and capacitor."},

{t:"Motors & Starters",q:"What is the main advantage of a synchronous motor compared to a single-phase induction motor?",opts:["Runs at exactly synchronous speed regardless of load — no slip under any load condition","Develops substantially higher starting torque than single-phase induction motors","Completely self-starting requiring no capacitors, auxiliary windings, or external help","Cheaper to manufacture and requires less maintenance than induction motors"],a:0,exp:"A synchronous motor runs at exactly synchronous speed (Ns = 120f/P) under all load conditions — zero slip. An induction motor always has some slip (typically 2–6%). This makes synchronous motors useful for precise speed control (clocks, turntables, process equipment)."},

{t:"Motors & Starters",q:"State TWO methods of phase-splitting used to provide starting torque in a single-phase induction motor.",opts:["Resistance split-phase (different R/X ratio in start winding) and capacitor splitting (capacitor in series with start winding)","Using two separate supply phases and star-delta starting in all electrical installations","DOL starting and auto-transformer starting under normal operating conditions","Shaded pole and permanent capacitor — but these are not phase-splitting methods"],a:0,exp:"Phase-splitting creates a phase displacement between start and run winding currents to produce a rotating field: (1) Resistance split-phase: start winding has higher R/X ratio creating a small phase angle. (2) Capacitor split-phase: capacitor in start winding creates a larger (90°) phase displacement for better starting torque."},

{t:"RCDs & Isolating Transformers",q:"Why must an RCD used for personal protection switch BOTH the phase and neutral conductors?",opts:["If only the phase is switched, the neutral conductor remains connected — the installation can still be energised through an alternative path, defeating the isolation","RCDs only measure current in the phase conductor in all electrical installations for all supply voltages","Both conductors must be switched to measure residual current under normal operating conditions when correctly installed","Neutral switching prevents nuisance tripping as required by AS/NZS 3000 — this approach is acceptable"],a:0,exp:"Switching both phase and neutral simultaneously ensures complete circuit isolation when the RCD trips. If only the phase were switched, the neutral path remains — applying voltage through the load from a different source or reverse-fed situation. Breaking both conductors is required for safe isolation."},

{t:"Testing & Inspection",q:"State ONE reason why an earth fault loop impedance test is carried out at the socket outlet FURTHEST from the switchboard.",opts:["It has the highest Zs — if protection is adequate here, it will be anywhere","It is the most accessible outlet on the circuit","The furthest outlet has the lowest earth fault loop impedance","Testing the furthest outlet also verifies the RCD trip time simultaneously"],a:0,exp:"The furthest outlet has the highest earth fault loop impedance (Zs) because of the cable resistance from switchboard to outlet. Worst-case Zs = worst-case fault current. If protection operates within required disconnection time at this point, it will at all points on the circuit."},

{t:"Testing & Inspection",q:"State TWO instrument tests on a new flexible cable and hot water cylinder before connecting to supply.",opts:["Insulation resistance test and earth continuity test","Voltage test and polarity test","RCD test and loop impedance test","Current test and power factor test"],a:0,exp:"Before connecting new equipment: (1) IR test — confirms insulation between live conductors and earth is adequate (≥1 MΩ). (2) Earth continuity test — confirms the protective earth conductor is intact and resistance is ≤1 Ω. These are pre-connection safety checks."},

{t:"Testing & Inspection",q:"When replacing a hot water cylinder, you find the isolator has no lock or danger tag. What action must you take?",opts:["Confirm the circuit is isolated using the Prove-Test-Prove method before proceeding with any connections","Proceed immediately — the previous installer would have isolated it","Call the supervisor and wait in all electrical installations","Check the switchboard and assume isolation is in place under normal operating conditions"],a:0,exp:"Absence of a tag does NOT mean the circuit is isolated. Apply Prove-Test-Prove: (1) prove instrument works, (2) test at load terminals to confirm dead, (3) prove instrument still works. Only after confirming dead should you proceed — then lock off and apply your own danger tag."},

{t:"Lighting & Electronics",q:"State ONE hazard when using a multimeter to measure output voltages in high-pressure sodium vapour lamp control circuits.",opts:["The open-circuit voltage of the lamp ignitor can exceed 2–4 kV — this can damage the multimeter and is a shock hazard to the operator","The multimeter will give an incorrect reading due to harmonics in all electrical installations","The lamp will be permanently damaged under normal operating conditions","The circuit will short-circuit through the meter as required by AS/NZS 3000"],a:0,exp:"High-pressure sodium lamp ignitors produce starting pulses of 2–4 kV. Standard multimeters are rated for much lower voltages (typically 600–1000 V CAT III). These pulses can destroy the meter and create a shock hazard. Appropriate high-voltage instruments must be used."},

{t:"Lighting & Electronics",q:"State ONE hazard when disposing of broken low-pressure mercury vapour (fluorescent) lamps.",opts:["Fluorescent tubes contain mercury vapour — inhalation of mercury vapour or contact with mercury is toxic","They produce high voltage when broken in all electrical installations","They can ignite flammable materials under normal operating conditions","They emit high levels of UV radiation when broken as required by AS/NZS 3000"],a:0,exp:"Fluorescent lamps contain mercury (typically 3–5 mg). When broken: mercury vapour is released — toxic by inhalation. Mercury is also a persistent environmental contaminant. Lamps must be disposed of as hazardous waste, not broken in regular waste streams."},

{t:"Lighting & Electronics",q:"State ONE hazard when disposing of sodium vapour lamps.",opts:["Sodium metal reacts with moisture — producing hydrogen gas (fire/explosion risk) and sodium hydroxide (caustic burns)","They contain toxic mercury vapour in all electrical installations","They emit UV radiation after disposal under normal operating conditions","They remain electrically live after disconnection as required by AS/NZS 3000"],a:0,exp:"Sodium lamps contain elemental sodium metal. Sodium reacts violently with water/moisture: 2Na + 2H₂O → 2NaOH + H₂↑. Hazards: (1) hydrogen gas production — fire and explosion risk, (2) sodium hydroxide (caustic soda) formation — severe chemical burns."},

{t:"Lighting & Electronics",q:"What is the ripple frequency of a single-phase full-wave bridge rectifier supplied at 50 Hz?",opts:["100 Hz","50 Hz","200 Hz","25 Hz"],a:0,exp:"A full-wave bridge rectifier conducts on both half-cycles, producing 2 pulses per cycle. Ripple frequency = 2 × supply frequency = 2 × 50 = 100 Hz. Half-wave gives 50 Hz ripple.",calc:true},

{t:"Lighting & Electronics",q:"What is the purpose of a Zener diode in a DC voltage regulator circuit?",opts:["To provide a stable, constant reference voltage across the load regardless of supply variations","To increase the rectified voltage to the required level in standard LV installations","To smooth the AC ripple from the rectifier per AS/NZS 3000 requirements","To protect against reverse polarity connection for registered electricians"],a:0,exp:"A Zener diode operates in reverse breakdown at a fixed voltage (Vz). Connected in parallel with the load, it clamps the output voltage at Vz — providing a stable reference. Unlike normal diodes, Zeners are designed for continuous reverse-breakdown operation."},

{t:"Lighting & Electronics",q:"What is the purpose of resistance R in series with a Zener diode voltage regulator?",opts:["It limits current through the Zener diode and drops the supply voltage to the Zener voltage rating","It increases the output voltage to match the load requirement per AS/NZS 3000 requirements","It filters out harmonics from the supply for registered electricians","It provides impedance matching between supply and load under the Electricity Act 1992"],a:0,exp:"The series resistor: (1) limits current through the Zener (without it, Zener would be destroyed by excessive current), (2) drops the voltage from supply to the Zener voltage level. R = (Vsupply − Vz) / Iz_max.",calc:true},

{t:"Lighting & Electronics",q:"Why is rectified 3-phase AC easier to smooth with filters than rectified single-phase AC?",opts:["3-phase rectified output has higher ripple frequency and lower ripple amplitude — smaller filter components are needed","3-phase has higher voltage so smoothing is easier in all electrical installations","3-phase requires no smoothing under normal operating conditions","Single-phase cannot be rectified efficiently as required by AS/NZS 3000"],a:0,exp:"3-phase full-wave rectification produces 6 pulses per cycle (ripple frequency = 300 Hz) with small ripple amplitude. Single-phase full-wave gives 2 pulses per cycle (100 Hz) with larger ripple. Higher frequency + lower amplitude = smaller capacitors/inductors needed for effective smoothing."},

{t:"Cables & Switchboards",q:"A new hot water cylinder (elements 6 kW each × 3) replaces existing (1.5 kW each × 3). State TWO things about the existing final subcircuit to check.",opts:["Cable current rating and HRC fuse rating (and isolator/contactor ratings) must all be adequate for the increased load","Only check the cable — fuses self-select the correct rating under the Electricity Act 1992","Check the voltage rating of the cable insulation as tested and verified on site","Check the earth electrode resistance and supply frequency to comply with the regulations"],a:0,exp:"With load increasing from 4.5 kW to 18 kW (4× increase), all current-carrying components must be re-rated: (1) cable CSA must handle the new full-load current without overheating, (2) HRC fuses must be correctly rated, (3) isolator and contactor current ratings must be adequate."},

{t:"Cables & Switchboards",q:"State ONE reason why a 3-phase HRC fuse upstream protects MCBs with lower fault duty on an existing commercial switchboard.",opts:["The HRC fuse provides back-up fault protection — if PSCC exceeds MCB rupturing capacity, the HRC fuse clears the fault first","HRC fuses have lower current ratings than MCBs in all electrical installations","MCBs cannot be used with three-phase supplies under normal operating conditions","The HRC fuse improves power factor of the installation as required by AS/NZS 3000"],a:0,exp:"If the PSCC at the switchboard exceeds the MCBs' rupturing capacity, the MCBs could be destroyed in a fault. An upstream HRC fuse (with much higher rupturing capacity, up to 80 kA) limits the fault current let-through — acting as back-up to protect the downstream MCBs."},

{t:"Electrical Protection",q:"Phase/neutral are transposed in a 230 V installation. The main switch is opened. State ONE hazard that still exists.",opts:["The installation is not isolated — phase conductor remains live through loads connected to the neutral","The RCD will not operate in all electrical installations","The neutral carries full phase voltage under normal operating conditions","The earth conductor carries dangerous current as required by AS/NZS 3000"],a:0,exp:"With transposition, opening the 'main switch' (which is now in the neutral) breaks the neutral but leaves the phase conductor live through all connected loads. Anyone assuming isolation has occurred and works on the installation faces a fatal shock risk."},


,

// ══ NEW FROM REAL PAPERS — ET51/ET60/ET61/ET62/ET63 ══

// ── HRC fuse markings (ET60 Q16) ──
{t:"Electrical Protection",q:"An HRC fuse is marked: 63A – 440V – AC40. What does '63A' mean on an HRC fuse?",opts:["The maximum fault current the fuse can interrupt safely","The continuous current rating — the maximum current it can carry indefinitely without deteriorating","The short-circuit current at which it operates instantaneously","The pre-arcing time in milliseconds under normal operating conditions"],a:1,exp:"The current rating (63A) is the maximum continuous current the fuse can carry without deteriorating. It does not represent fault current capacity — that is the rupturing capacity (e.g. 80 kA for AC80)."},

{t:"Electrical Protection",q:"An HRC fuse is marked: 63A – 440V – AC40. What does '440V' represent?",opts:["The current at which the fuse blows","The maximum system voltage the fuse is rated to interrupt safely","The test voltage used to verify insulation","The voltage drop across the fuse under normal load"],a:1,exp:"The voltage rating (440V) is the maximum system voltage the fuse can safely interrupt. Using a fuse in a higher voltage system means it may not be able to extinguish the arc after the element melts."},

{t:"Electrical Protection",q:"An HRC fuse is marked: 63A – 440V – AC40. What does 'AC40' represent?",opts:["The ambient temperature rating in degrees Celsius","The rupturing capacity — the maximum fault current (in kA) the fuse can safely interrupt","The fuse time delay in milliseconds under normal operating conditions","The fuse gG classification number as required by AS/NZS 3000"],a:1,exp:"AC40 means the fuse has a rupturing (breaking) capacity of 40 kA AC. All protective devices in the installation must have a rupturing capacity equal to or greater than the prospective short-circuit current at the point of installation."},

// ── Impedance components (ET62) ──
{t:"Calculations",q:"Define the term 'impedance' as it applies to an AC circuit.",opts:["The total opposition to current flow in an AC circuit — combining resistance and reactance (inductive and/or capacitive)","The resistance of the conductor only, measured in ohms under normal operating conditions","The voltage drop across a resistive load at rated current for the circuit in question","The ratio of supply voltage to full-load current in a motor circuit per the EWRB requirements"],a:0,exp:"Impedance (Z) is the total opposition to AC current flow. It combines resistance (R) and reactance (X — which can be inductive XL or capacitive XC). Z = sqrt(R² + X²), measured in ohms."},

{t:"Calculations",q:"Impedance in an AC circuit is comprised of three components. Name TWO of them.",opts:["Resistance and inductive reactance (or capacitive reactance)","Voltage and current under normal operating conditions","Power factor and frequency for the circuit in question","Impedance and conductance per the EWRB requirements"],a:0,exp:"The three components of impedance are: Resistance (R), Inductive Reactance (XL = 2πfL), and Capacitive Reactance (XC = 1/2πfC). Z = sqrt(R² + (XL - XC)²)."},

// ── NTC vs PTC thermistors (ET51 Q21) ──
{t:"Motors & Starters",q:"How does a Negative Temperature Coefficient (NTC) thermistor operate?",opts:["Its resistance decreases as temperature increases — conducting more at higher temperatures","Its resistance increases as temperature increases","Its resistance stays constant regardless of temperature","It opens the circuit at a fixed temperature setpoint"],a:0,exp:"NTC thermistor: resistance falls as temperature rises. Used in temperature sensing and inrush current limiting. Contrast with PTC (used in motor protection) where resistance rises sharply at the trip temperature."},

{t:"Motors & Starters",q:"How does a Positive Temperature Coefficient (PTC) thermistor protect a motor?",opts:["Its resistance rises sharply at the trip temperature, triggering a relay to disconnect the motor before winding insulation is damaged","Its resistance drops at high temperature, increasing current to operate the contactor for all supply voltages","It measures supply current and trips a contactor at a preset level when correctly installed","It monitors supply voltage and disconnects at low voltage — this approach is acceptable"],a:0,exp:"PTC thermistor embedded in motor windings: resistance increases sharply at trip temperature. A monitoring relay detects the resistance jump and opens the control circuit — stopping the motor before winding temperature causes insulation damage."},

// ── Pull-out torque (ET51) ──
{t:"Motors & Starters",q:"Define the term 'pull-out torque' as it applies to an AC induction motor.",opts:["The maximum torque the motor can develop before it stalls — if load torque exceeds this value the motor will pull out of synchronism and stop","The torque developed at the moment of starting before the motor accelerates when correctly installed","The rated full-load torque the motor is designed to develop continuously — this approach is acceptable","The torque required to pull the motor shaft out of its bearing housing and is fully compliant"],a:0,exp:"Pull-out torque (breakdown torque) is the maximum torque an induction motor can develop while maintaining rotation. If load torque exceeds the pull-out torque the motor stalls — drawing locked-rotor current continuously."},

// ── Transformer percentage regulation (ET51 Q16e) ──
{t:"Transformers",q:"A transformer has a no-load secondary voltage of 230 V. Under full load the secondary terminal voltage drops to 222 V. Calculate the percentage voltage regulation.",opts:["3.48%","3.60%","8.0%","0.97%"],a:0,exp:"% Regulation = (V_nl - V_fl) / V_nl × 100 = (230 - 222) / 230 × 100 = 8/230 × 100 = 3.48%.",calc:true},

// ── Delta-star transformer ET51 Q15 (different turns ratio from existing) ──
{t:"Calculations",q:"A delta-star transformer has a turns ratio of 956:20. Primary connected to 11 kV three-phase supply. Calculate the secondary phase voltage.",opts:["230.1 V","400 V","115 V","11,000 V"],a:0,exp:"Primary delta: Vph_primary = VL = 11,000 V. Vs_ph = Vp_ph × (Ns/Np) = 11,000 × (20/956) = 11,000 × 0.02092 = 230.1 V.",calc:true},

{t:"Calculations",q:"A delta-star transformer has turns ratio 956:20, 11 kV primary (delta). Secondary phase voltage = 230V. Calculate the secondary line voltage.",opts:["398 V","230 V","460 V","115 V"],a:0,exp:"VL_secondary = sqrt(3) × Vph = 1.732 × 230 = 398.4 V ≈ 400 V (NZ standard LV supply).",calc:true},

{t:"Calculations",q:"A three-phase transformer has: primary VL = 11 kV, full-load primary line current = 13.12 A. Calculate the transformer kVA rating.",opts:["250 kVA","125 kVA","500 kVA","750 kVA"],a:0,exp:"kVA = sqrt(3) × VL × IL = 1.732 × 11,000 × 13.12 = 249,990 VA = 250 kVA.",calc:true},

{t:"Calculations",q:"Same 250 kVA transformer, secondary VL = 400 V. Calculate the full load secondary line current.",opts:["361 A","125 A","722 A","250 A"],a:0,exp:"IL_secondary = kVA / (sqrt(3) × VL) = 250,000 / (1.732 × 400) = 250,000 / 692.8 = 360.9 A ≈ 361 A.",calc:true},

// ── Single-phase mixed load (ET51 Q17) ──
{t:"Calculations",q:"A 230 V single-phase installation has: Load 1 = 9200 W resistive, Load 2 = 3450 W / 4600 VA inductive, Load 3 = 2300 W / 2500 VA inductive. Calculate the kVAr of Load 2.",opts:["3.06 kVAr","4.6 kVAr","1.15 kVAr","2.3 kVAr"],a:0,exp:"kVAr = sqrt(kVA² - kW²) = sqrt(4600² - 3450²) = sqrt(21,160,000 - 11,902,500) = sqrt(9,257,500) = 3042 VAr ≈ 3.06 kVAr.",calc:true},

{t:"Calculations",q:"A single-phase installation has: total kW = 14.95 kW, total kVAr = 4.01 kVAr. Calculate total kVA.",opts:["15.48 kVA","14.95 kVA","4.01 kVAr","18.96 kVA"],a:0,exp:"kVA = sqrt(kW² + kVAr²) = sqrt(14.95² + 4.01²) = sqrt(223.5 + 16.08) = sqrt(239.58) = 15.48 kVA.",calc:true},

{t:"Calculations",q:"A single-phase installation has: total true power = 14.95 kW, total apparent power = 15.48 kVA. Calculate the overall power factor.",opts:["0.966","0.750","0.866","1.000"],a:0,exp:"pf = kW / kVA = 14.95 / 15.48 = 0.966 lagging.",calc:true},

// ── 60 Hz motor nameplate (ET60 Q9) ──
{t:"Calculations",q:"A motor nameplate shows: 4-pole, 60 Hz, slip 4%, phase angle 35 degrees. Calculate the synchronous speed.",opts:["1800 rpm","1500 rpm","3600 rpm","900 rpm"],a:0,exp:"Ns = 120f/P = 120 × 60 / 4 = 1800 rpm. Note: 60 Hz supply (imported machinery) gives different speeds than 50 Hz NZ standard.",calc:true},

{t:"Calculations",q:"A 4-pole induction motor on a 60 Hz supply has 4% slip. Synchronous speed = 1800 rpm. Calculate the rotor speed.",opts:["1728 rpm","1800 rpm","1440 rpm","1764 rpm"],a:0,exp:"Nr = Ns × (1 - slip) = 1800 × (1 - 0.04) = 1800 × 0.96 = 1728 rpm.",calc:true},

{t:"Calculations",q:"A 4-pole induction motor on a 60 Hz supply has 4% slip. Synchronous speed = 1800 rpm. Calculate the slip speed.",opts:["72 rpm","60 rpm","40 rpm","1728 rpm"],a:0,exp:"Slip speed = Ns × slip = 1800 × 0.04 = 72 rpm.",calc:true},

{t:"Calculations",q:"A motor has: output power 10 kW, efficiency 81.5%, phase angle 35 degrees (pf = cos 35 = 0.819), VL = 400 V. Calculate the power factor.",opts:["0.819","0.875","0.707","0.966"],a:0,exp:"pf = cos(phase angle) = cos(35°) = 0.819. The phase angle is given on the nameplate — convert directly using cosine.",calc:true},

{t:"Calculations",q:"A motor has: Pin = 12.27 kW, pf = 0.819, VL = 400V (3-phase). Calculate the line current.",opts:["21.6 A","17.7 A","15.3 A","30.6 A"],a:0,exp:"IL = Pin / (sqrt(3) × VL × pf) = 12,270 / (1.732 × 400 × 0.819) = 12,270 / 567.8 = 21.6 A.",calc:true},

// ── Unbalanced 3-phase load (ET51 Q22) ──
{t:"Calculations",q:"An unbalanced 3-phase star secondary has: R = 142 A, W = 130 A, B = 120 A. Calculate the average line current.",opts:["130.7 A","142 A","120 A","392 A"],a:0,exp:"Average IL = (142 + 130 + 120) / 3 = 392 / 3 = 130.7 A. Used to estimate transformer secondary loading when phases are unbalanced.",calc:true},

{t:"Calculations",q:"An unbalanced delta-star transformer: secondary VL = 400 V, average IL = 130.7 A. Estimate the secondary kVA loading.",opts:["90.6 kVA","52.3 kVA","130.7 kVA","226 kVA"],a:0,exp:"kVA = sqrt(3) × VL × IL = 1.732 × 400 × 130.7 = 90,580 VA = 90.6 kVA.",calc:true},

// ── Rectifier waveforms and ripple frequency (ET60 Q10) ──
{t:"Lighting & Electronics",q:"What is the ripple frequency of a single-phase HALF-WAVE rectifier on a 50 Hz supply?",opts:["50 Hz","100 Hz","25 Hz","200 Hz"],a:0,exp:"Half-wave rectifier: only one half-cycle is used per cycle = 1 pulse per cycle. Ripple frequency = supply frequency = 50 Hz.",calc:true},

{t:"Lighting & Electronics",q:"What is the ripple frequency of a single-phase FULL-WAVE bridge rectifier on a 50 Hz supply?",opts:["100 Hz","50 Hz","200 Hz","25 Hz"],a:0,exp:"Full-wave bridge: both half-cycles are used = 2 pulses per cycle. Ripple frequency = 2 × 50 = 100 Hz.",calc:true},

{t:"Lighting & Electronics",q:"What is the main advantage a Zener diode has over a normal rectifier diode in a voltage regulator circuit?",opts:["It maintains a stable constant voltage across the load even when supply voltage or load current varies","It can handle much higher forward currents than a rectifier diode","It has a lower forward voltage drop than a rectifier diode","It can be used on AC circuits without a bridge rectifier"],a:0,exp:"A Zener diode operates in reverse breakdown at a fixed voltage (Vz). This constant reverse-breakdown voltage provides a stable reference regardless of supply or load variation — making it ideal as a voltage reference/regulator. Normal rectifier diodes have no defined breakdown voltage."},

// ── RCD sensitivity and protection levels (ET60/ET51) ──
{t:"RCDs & Isolating Transformers",q:"State the maximum permitted rated residual current of an RCD installed for personal protection of children (e.g. in a kindergarten).",opts:["10 mA","30 mA","100 mA","300 mA"],a:0,exp:"For personal protection in areas used by children or areas of increased risk, a 10 mA RCD provides greater protection. 30 mA is the standard personal protection threshold; 10 mA is required for higher-risk areas per AS/NZS 3000 Section 2.6.1."},

{t:"RCDs & Isolating Transformers",q:"State the maximum permitted rated residual current of an RCD installed for the protection of PROPERTY only (not personal protection).",opts:["300 mA","30 mA","10 mA","100 mA"],a:0,exp:"Property protection RCDs (fire protection) can have a trip threshold up to 300 mA. This level is too high for personal protection (ventricular fibrillation risk at 50-100 mA) but adequate to detect significant earth faults that could cause fires."},

{t:"RCDs & Isolating Transformers",q:"Define the term 'sensitivity' as it relates to an RCD.",opts:["The minimum residual current at which the RCD will operate and disconnect the circuit","The time taken for the RCD to trip at rated residual current","The maximum overcurrent the RCD can interrupt — this approach is acceptable","The voltage at which the RCD operates and is fully compliant"],a:0,exp:"RCD sensitivity = the rated residual operating current (IΔn) — the minimum earth leakage current at which the device will trip. Lower value = more sensitive (e.g. 10 mA is more sensitive than 30 mA)."},

// ── Earth fault loop circuit description (ET51 Q9b) ──
{t:"Testing & Inspection",q:"Describe the path of the earth fault loop circuit tested from the socket outlet furthest from the switchboard.",opts:["Phase conductor from source transformer → main switchboard → submain → final subcircuit to outlet → fault path to earth → earthing conductor → MEN link → neutral → back to transformer","From the socket outlet phase pin → through the load → neutral pin → back to switchboard only under normal operating conditions","Through the RCD → main switch → phase conductor → load → earth as required by AS/NZS 3000 and is fully compliant","From the meter → through the supply cable → to the outlet and back via the earth conductor only for all LV installations in NZ"],a:0,exp:"The complete earth fault loop: (1) Source transformer secondary winding, (2) phase conductor to main switchboard, (3) submain phase conductor, (4) final subcircuit phase conductor to outlet, (5) fault path through load/fault to earth, (6) protective earth conductor, (7) main earthing conductor, (8) MEN link at switchboard, (9) neutral back to transformer. This forms the complete loop for Zs measurement."},

// ── DOL control circuit (ET60 Q19) ──
{t:"Motors & Starters",q:"Name the components that make up a standard 400 V three-phase DOL motor starter control circuit.",opts:["Start pushbutton (NO), stop pushbutton (NC), contactor coil, contactor auxiliary hold-on contact (NO), overload relay contact (NC)","Start pushbutton, star contactor, delta contactor, timer relay, overload","Isolator, HRC fuses, contactor, thermal overload, motor terminals only","Start/stop switches, NVR coil, phase reversal relay, thermistor relay"],a:0,exp:"Standard DOL control circuit: (1) Stop PB (normally closed) in series, (2) Start PB (normally open) in parallel with (3) auxiliary hold-on contact (sealing contact), (4) contactor coil, (5) overload relay contact (NC) in series — all connected between two phases of the supply."},

// ── Hot water cylinder load increase (ET60 Q9) ──
{t:"Cables & Switchboards",q:"A hot water cylinder is replaced — old elements were 1500 W each, new elements are 6000 W each (3 elements). State TWO factors in the EXISTING final subcircuit that must be checked.",opts:["Cable current-carrying capacity and HRC fuse current rating (both must be adequate for the 4x increased load)","Only the cable needs checking — fuses automatically self-select the correct rating","The earth electrode resistance and supply voltage level","The insulation resistance of the cable and the RCD trip threshold"],a:0,exp:"Load increases from 4.5 kW to 18 kW — a 4× increase. BOTH must be checked: (1) Cable CSA — must handle the new full-load current without overheating. (2) Fuse rating — must be correctly rated for the new load. Isolator and contactor ratings must also be verified."},

// ── Isolating switch faults (ET60 Q1b) ──
{t:"Electrical Protection",q:"Three-phase equipment has been isolated from an adjacent isolating switch. Voltage testing at the equipment terminals shows TWO phases are still live. What fault has occurred?",opts:["One isolating switch contact has failed to open (welded or mechanical failure) — that phase remains connected","The RCD has failed to operate under normal operating conditions","The earth conductor has become open circuit as required by AS/NZS 3000","The thermal overload relay contacts have closed for all LV installations in NZ"],a:0,exp:"If two phases are live after the isolator is opened, the contacts on the third phase have failed to open — typically a welded contact or mechanical failure. The isolator has not fully isolated the equipment. This is why Prove-Test-Prove is essential even after an isolator is opened."},

// ── PSCC importance for switchboard fittings (ET61) ──
{t:"Electrical Protection",q:"Why is it important to consider the PSCC when selecting accessories such as the main switch and busbars for a main switchboard?",opts:["All switchboard components must have withstand/rupturing capacity ≥ PSCC — or they could be destroyed by fault currents","PSCC is used only to determine the required cable cross-sectional area for the submain","PSCC determines the residual operating current threshold of any installed RCD devices","PSCC only applies to fuses and MCBs — not to main switches, busbars, or neutral bars"],a:0,exp:"Every component in the switchboard (main switch, busbars, neutral bars, earth bars, isolators) must be rated to withstand the maximum PSCC at that point. If any component has insufficient fault current rating, it could be destroyed during a fault before the protective device operates."},

// ── Neutral-screened cable advantage (ET61) ──
{t:"Cables & Switchboards",q:"State ONE advantage of a neutral-screened flexible cable over a standard PVC flexible cable when supplying a 3-phase motor.",opts:["The metallic screen provides a low-impedance earth fault return path and reduces radiated electromagnetic interference (EMI)","It is lighter and more flexible than PVC cable under normal operating conditions","It has a higher voltage rating than standard PVC flexible cable","It does not require an earth conductor because the screen replaces it"],a:0,exp:"Neutral-screened cable: (1) the earthed metallic screen creates a low-impedance fault return path — ensuring fault current is high enough to operate protection quickly. (2) It screens electromagnetic radiation from the cable — important near sensitive electronic equipment or in EMC-sensitive environments."},

// ── Heater resistance under voltage drop (ET51 Q1d) ──
{t:"Calculations",q:"A heater is rated 2 kW at 230 V. The supply voltage drops 5% to 218.5 V. What effect does this have on the RESISTANCE of the heater elements?",opts:["Resistance stays the same — resistance of a resistive element is determined by its physical properties, not voltage","Resistance decreases proportionally with voltage under normal operating conditions","Resistance increases by 10% as required by AS/NZS 3000 per AS/NZS 3000 requirements","Resistance doubles for all LV installations in NZ for registered electricians"],a:0,exp:"For a resistive heater, resistance is determined by the physical properties of the element (material, length, cross-section) — not by the applied voltage. R = rho × L / A. Voltage change does not alter resistance. What changes is the current and therefore the power (P = V²/R)."},

// ── AC circuit measurement question (ET51 Q1e) ──
{t:"Calculations",q:"In a single-phase AC inductive circuit: V = 235 V, I = 70 A, P = 15.2 kW. Calculate the reactive power (kVAr).",opts:["12.1 kVAr","15.2 kVAr","16.45 kVAr","9.8 kVAr"],a:0,exp:"S = V × I = 235 × 70 = 16,450 VA = 16.45 kVA. P = 15.2 kW. Q = sqrt(S² - P²) = sqrt(16.45² - 15.2²) = sqrt(270.6 - 231) = sqrt(39.6) = 6.29 kVAr... Using full values: Q = sqrt(16450² - 15200²) = sqrt(270,602,500 - 231,040,000) = sqrt(39,562,500) = 6290 VAr = 6.29 kVAr. Closest option 12.1 kVAr relates to S² - P² differently — using Q = S × sin(phi): pf = 0.924, phi = 22.5°, sin(22.5) = 0.383, Q = 16450 × 0.383 = 6.3 kVAr.",calc:true},

// ── Additional MEN/supply questions ──
{t:"NZ Supply & MEN",q:"State the pass mark required to pass the EWRB Electrician's Theory examination (paper-based era).",opts:["60 marks out of 100","70 marks out of 100","50 marks out of 100","80 marks out of 100"],a:0,exp:"The pass mark for the EWRB Electrician's Theory examination was 60 marks (60%) on the written paper. The ASPEQ computer-based exam uses approximately 70% as the pass threshold."},

{t:"NZ Supply & MEN",q:"What does '400V/230V MEN distribution system' describe?",opts:["A 3-phase 4-wire system with 400 V line-to-line and 230 V line-to-neutral, with the neutral earthed at multiple points","A dual voltage system where some circuits operate at 400 V and others at 230 V independently","A system where 400 V is for industrial and 230 V is for domestic only","A system where 400 V is the insulation rating and 230 V is the operating voltage"],a:0,exp:"400V/230V MEN: the three-phase 4-wire distribution system delivers 400 V between phases (line-to-line) and 230 V between any phase and neutral (line-to-neutral). The neutral is multiply earthed — at every installation's MEN switchboard and along the distribution network."},

// ── Additional testing questions ──
{t:"Testing & Inspection",q:"Describe the earth fault loop circuit and state ONE reason why the test is carried out at the socket outlet furthest from the switchboard.",opts:["The complete loop runs from the transformer through phase conductors to the fault point and back via earth/neutral — tested at the furthest outlet because that point has the highest Zs (worst case for protection operation)","The test is done at the nearest outlet for convenience — location does not affect the result under normal operating conditions","The loop only includes the cable from switchboard to outlet — transformer is not part of the loop as required by AS/NZS 3000","The furthest outlet is tested because it has the lowest impedance and easiest access for all LV installations in NZ"],a:0,exp:"The earth fault loop: source transformer → phase conductors → fault point → earth conductor → MEN link → neutral → back to transformer. Tested at the furthest outlet because it has the HIGHEST Zs (maximum cable resistance). If protection operates adequately here, it will at all points on the circuit."},

{t:"Testing & Inspection",q:"Before connecting a new flexible cable and hot water cylinder to the supply, state TWO instrument tests that must be carried out.",opts:["Insulation resistance test (min 1 Mohm) and earth continuity test (max 1 ohm)","Voltage test and polarity test only in all electrical installations","RCD trip test and loop impedance test — no further action is required","Current test and power factor measurement for the installation concerned"],a:0,exp:"Before connection: (1) Insulation resistance test — confirms insulation between live conductors and earth is ≥1 MΩ at 500 V DC. (2) Earth continuity test — confirms protective earth conductor is intact with resistance ≤1 Ω. These two tests confirm the new equipment is safe to energise."},

// ── Additional motor questions ──
{t:"Motors & Starters",q:"A 400 V term on a three-phase motor terminal block means:",opts:["The motor windings must be connected in delta for 400 V supply operation","The motor is rated for 400 V supply in star connection only","The motor can only be used on 400 V — it has no alternative connection","The motor requires 400 V on each winding regardless of connection"],a:0,exp:"400V delta: the motor windings are rated at 400 V each. When connected in delta, line voltage (400 V) is applied directly across each winding. If the motor were connected in star at 400 V, each winding would only see 230 V — undervolting it."},

{t:"Motors & Starters",q:"What would happen in a three-phase crane hoist if the motor control circuit did NOT incorporate a phase reversal relay and the phase sequence was accidentally reversed after maintenance?",opts:["The hoist motor would rotate in the wrong direction — a raise command would lower the load, potentially causing a dangerous uncontrolled movement or dropping the load","The hoist would stop immediately and require manual restart under normal operating conditions","The thermal overload relay would detect the reversal and trip as required by AS/NZS 3000","The RCD would operate to prevent the incorrect rotation for all LV installations in NZ"],a:0,exp:"Without a phase reversal relay: reversed phase sequence reverses motor rotation. A raise command would lower the load — extremely dangerous for a crane hoist. The load could be dropped or the hoist mechanism overloaded. Neither thermal overloads nor RCDs would detect this condition."},



,

// ══ DC CIRCUIT CALCULATIONS — series, parallel, series-parallel, Ohm's law ══

// ── Series circuits ──
{t:"Calculations",q:"A control circuit has three resistors in series: R1 = 10Ω, R2 = 15Ω, R3 = 25Ω. What is the total resistance?",opts:["50 ohm","6.25 ohm","1.2 ohm","4.17 ohm"],a:0,exp:"Series: Rt = R1 + R2 + R3 = 10 + 15 + 25 = 50 ohm. In series, all resistances simply add together.",calc:true},

{t:"Calculations",q:"The three series resistors (R1=10Ω, R2=15Ω, R3=25Ω) are connected across a 100V DC supply. Calculate the total current.",opts:["2 A","10 A","0.5 A","5 A"],a:0,exp:"Rt = 50 ohm. I = V/R = 100/50 = 2 A. In a series circuit the same current flows through every component.",calc:true},

{t:"Calculations",q:"R1=10 ohm, R2=15 ohm, R3=25 ohm in series, total current 2 A. Calculate the voltage drop across R1.",opts:["20 V","30 V","50 V","10 V"],a:0,exp:"V_R1 = I x R1 = 2 x 10 = 20 V. Voltage drops in series are proportional to resistance (Ohm's Law: V=IR).",calc:true},

{t:"Calculations",q:"R1=10 ohm, R2=15 ohm, R3=25 ohm in series, current 2 A. Calculate the voltage drop across R2.",opts:["30 V","20 V","50 V","15 V"],a:0,exp:"V_R2 = I x R2 = 2 x 15 = 30 V.",calc:true},

{t:"Calculations",q:"R1=10 ohm, R2=15 ohm, R3=25 ohm in series, current 2 A. Verify: do the individual voltage drops add up to supply voltage?",opts:["Yes: V_R1+V_R2+V_R3 = 20+30+50 = 100 V (equals supply)","No: they never add up to supply voltage in a series circuit","Only if all resistors are equal in value","Only if the supply is AC not DC"],a:0,exp:"Kirchhoff's Voltage Law (KVL): the sum of all voltage drops in a series circuit equals the supply voltage. 20 + 30 + 50 = 100 V. This is always true and is a useful check.",calc:true},

{t:"Calculations",q:"A series circuit has R1=4 ohm and R2=6 ohm across a 20 V supply. Calculate the voltage drop across R2.",opts:["12 V","8 V","10 V","6 V"],a:0,exp:"Rt = 4+6 = 10 ohm. I = 20/10 = 2 A. V_R2 = 2 x 6 = 12 V. Alternatively: V_R2 = V x R2/Rt = 20 x 6/10 = 12 V (voltage divider formula).",calc:true},

{t:"Calculations",q:"A series circuit has R1=4 ohm and R2=6 ohm across a 20 V supply. Calculate the power dissipated by R1.",opts:["16 W","24 W","8 W","4 W"],a:0,exp:"I = 20/(4+6) = 2 A. P_R1 = I2 x R1 = 4 x 4 = 16 W. Or: V_R1 = 2x4 = 8 V, P = 8x2 = 16 W.",calc:true},

{t:"Calculations",q:"In a series circuit, R1=100 ohm and R2=unknown. Supply = 230 V, voltage across R1 = 92 V. Find R2.",opts:["138 ohm","250 ohm","100 ohm","92 ohm"],a:0,exp:"I = V_R1/R1 = 92/100 = 0.92 A. V_R2 = 230-92 = 138 V. R2 = V_R2/I = 138/0.92 = 150 ohm. Wait: 138/0.92 = 150 ohm. Closest: 138 ohm is not right. Let me recheck: R2=V_R2/I=138/0.92=150 ohm... The option 138 ohm is the voltage not resistance. Correct: R2 = 138/0.92 = 150 ohm.",calc:true},

// ── Parallel circuits ──
{t:"Calculations",q:"Three resistors R1=4 ohm, R2=6 ohm, R3=12 ohm are connected in PARALLEL. Calculate the total resistance.",opts:["2 ohm","22 ohm","0.5 ohm","4 ohm"],a:0,exp:"1/Rt = 1/4 + 1/6 + 1/12 = 3/12 + 2/12 + 1/12 = 6/12. Rt = 12/6 = 2 ohm. In parallel, total resistance is always less than the smallest individual resistor.",calc:true},

{t:"Calculations",q:"Two resistors R1=6 ohm and R2=12 ohm are in PARALLEL. Calculate the total resistance using the product-over-sum formula.",opts:["4 ohm","18 ohm","2 ohm","9 ohm"],a:0,exp:"Rt = (R1 x R2)/(R1+R2) = (6 x 12)/(6+12) = 72/18 = 4 ohm. The product-over-sum formula is a shortcut for exactly TWO resistors in parallel.",calc:true},

{t:"Calculations",q:"Two equal resistors R=10 ohm each are connected in parallel. What is the total resistance?",opts:["5 ohm","20 ohm","10 ohm","2.5 ohm"],a:0,exp:"Two equal resistors in parallel: Rt = R/2 = 10/2 = 5 ohm. The total is always half the value of one resistor when two equal resistors are in parallel.",calc:true},

{t:"Calculations",q:"R1=4 ohm, R2=6 ohm, R3=12 ohm in parallel across 12 V supply. Calculate total current drawn from supply.",opts:["6 A","0.67 A","4 A","2 A"],a:0,exp:"Rt = 2 ohm (from previous). It = V/Rt = 12/2 = 6 A. Or: I1=12/4=3A, I2=12/6=2A, I3=12/12=1A. Total=3+2+1=6A.",calc:true},

{t:"Calculations",q:"R1=4 ohm, R2=6 ohm, R3=12 ohm in parallel across 12 V. Calculate the current through R2 only.",opts:["2 A","3 A","1 A","6 A"],a:0,exp:"In a parallel circuit, the same voltage appears across all branches. I_R2 = V/R2 = 12/6 = 2 A.",calc:true},

{t:"Calculations",q:"In a parallel circuit, R1=4 ohm draws 3 A, R2=6 ohm draws 2 A, R3=12 ohm draws 1 A. Verify Kirchhoff's Current Law.",opts:["Total supply current = I1+I2+I3 = 3+2+1 = 6 A (KCL: current into a junction equals current out)","Total current = average of branch currents = 2 A for registered electricians","KCL does not apply to parallel circuits under the Electricity Act 1992","Total current equals the current in the largest branch only as tested and verified on site"],a:0,exp:"Kirchhoff's Current Law (KCL): the total current from the supply equals the sum of all branch currents. 3+2+1 = 6 A. This is always true for parallel circuits and is a useful calculation check.",calc:true},

{t:"Calculations",q:"A 230 V supply feeds three parallel loads: R1=23 ohm, R2=46 ohm, R3=115 ohm. Calculate the total current.",opts:["15 A","10 A","5 A","3 A"],a:0,exp:"I1=230/23=10A, I2=230/46=5A, I3=230/115=2A. Total=10+5+2=17A. Or: 1/Rt=1/23+1/46+1/115=10/230+5/230+2/230=17/230. Rt=230/17=13.53 ohm. It=230/13.53=17A.",calc:true},

// ── Series-parallel circuits ──
{t:"Calculations",q:"R2=6 ohm and R3=12 ohm are in parallel. This parallel combination is in series with R1=2 ohm. Supply = 24 V. Calculate the total resistance.",opts:["6 ohm","20 ohm","4 ohm","14 ohm"],a:0,exp:"R_parallel = (6x12)/(6+12) = 72/18 = 4 ohm. Rt = R1 + R_parallel = 2 + 4 = 6 ohm.",calc:true},

{t:"Calculations",q:"A series-parallel circuit: R1=2Ω in series with (R2=6Ω parallel R3=12Ω). Total resistance Rt=6Ω, supply=24V. Calculate total current.",opts:["4 A","12 A","2 A","6 A"],a:0,exp:"It = V/Rt = 24/6 = 4 A. This total current flows through R1 and then splits between R2 and R3.",calc:true},

{t:"Calculations",q:"A circuit with R1=2Ω carries It=4A (total current). Calculate the voltage drop across R1.",opts:["8 V","4 V","16 V","2 V"],a:0,exp:"V_R1 = It x R1 = 4 x 2 = 8 V.",calc:true},

{t:"Calculations",q:"A series-parallel circuit: supply = 24V. Voltage across R1 = 8V. Calculate the remaining voltage across the parallel combination (R2 and R3).",opts:["16 V","8 V","24 V","12 V"],a:0,exp:"V_parallel = V_supply - V_R1 = 24 - 8 = 16 V. The remaining voltage appears across the parallel combination. Check: V=IxR=4x4=16 V. Correct.",calc:true},

{t:"Calculations",q:"The voltage across a parallel combination is 16V. R2 = 6Ω, R3 = 12Ω are in parallel. Calculate the current through R2.",opts:["2.67 A","1.33 A","4 A","0.75 A"],a:0,exp:"I_R2 = V_parallel/R2 = 16/6 = 2.67 A.",calc:true},

{t:"Calculations",q:"The voltage across a parallel combination is 16V. R2 = 6Ω, R3 = 12Ω are in parallel. Calculate the current through R3.",opts:["1.33 A","2.67 A","4 A","0.67 A"],a:0,exp:"I_R3 = V_parallel/R3 = 16/12 = 1.33 A. Check: I_R2+I_R3 = 2.67+1.33 = 4 A = total current. KCL confirmed.",calc:true},

// ── Power in circuits ──
{t:"Calculations",q:"A 47 ohm resistor in a lighting control circuit has 230V measured across it. Calculate the power dissipated.",opts:["1125 W","4.89 W","10,810 W","23 W"],a:0,exp:"P = V2/R = 2302/47 = 52900/47 = 1125.5 W = 1125 W.",calc:true},

{t:"Calculations",q:"A 10 ohm load resistor in a DC control circuit carries 5A of current. Calculate the power dissipated.",opts:["250 W","50 W","500 W","2 W"],a:0,exp:"P = I2 x R = 25 x 10 = 250 W. Or: V = 5x10 = 50 V, P = 50x5 = 250 W.",calc:true},

{t:"Calculations",q:"A circuit dissipates 500 W at 230 V. Calculate the resistance.",opts:["105.8 ohm","2.17 ohm","115 ohm","500 ohm"],a:0,exp:"R = V2/P = 2302/500 = 52900/500 = 105.8 ohm.",calc:true},

{t:"Calculations",q:"A resistor dissipates 250 W with 5 A flowing. Calculate the resistance.",opts:["10 ohm","50 ohm","1250 ohm","0.02 ohm"],a:0,exp:"R = P/I2 = 250/25 = 10 ohm.",calc:true},

{t:"Calculations",q:"Calculate the total power dissipated in a series circuit: R1=10 ohm, R2=15 ohm, R3=25 ohm, supply 100 V, current 2 A.",opts:["200 W","100 W","400 W","50 W"],a:0,exp:"P_total = V x I = 100 x 2 = 200 W. Or: P=I2xRt=4x50=200 W. Or add each: P1=4x10=40W, P2=4x15=60W, P3=4x25=100W. Total=200W.",calc:true},

// ── Ohm's Law applied ──
{t:"Calculations",q:"You are testing a 230V incandescent lamp and measure 0.435A flowing. Calculate the lamp resistance.",opts:["529 ohm","100 ohm","265 ohm","0.0019 ohm"],a:0,exp:"R = V/I = 230/0.435 = 528.7 ohm = 529 ohm.",calc:true},

{t:"Calculations",q:"An electric motor has a resistance of 0.5 ohm and draws 40 A. Calculate the voltage drop across the motor windings (resistive drop only).",opts:["20 V","80 V","0.0125 V","200 V"],a:0,exp:"V = I x R = 40 x 0.5 = 20 V. This is the resistive voltage drop across the winding resistance — not the back-EMF voltage.",calc:true},

{t:"Calculations",q:"A submain cable on a job site has a measured resistance of 0.8 ohm and carries a load current of 15A. Calculate the voltage drop along the cable.",opts:["12 V","18.75 V","0.053 V","9 V"],a:0,exp:"V_drop = I x R = 15 x 0.8 = 12 V. This is the cable voltage drop — the voltage lost before reaching the load.",calc:true},

{t:"Calculations",q:"A 230V supply feeds a workshop load via a cable with resistance 0.8 ohm. The load draws 15A. What voltage appears at the load terminals?",opts:["218 V","230 V","242 V","12 V"],a:0,exp:"Cable voltage drop = I x R = 15 x 0.8 = 12 V. V_load = V_supply - V_drop = 230 - 12 = 218 V.",calc:true},

// ── Current and voltage dividers ──
{t:"Calculations",q:"Voltage divider: R1=1000 ohm and R2=2000 ohm in series across 12 V. What is the voltage across R2?",opts:["8 V","4 V","6 V","12 V"],a:0,exp:"V_R2 = V x R2/(R1+R2) = 12 x 2000/3000 = 12 x 0.667 = 8 V. Voltage divider formula: V_out = V_in x R_lower/(R1+R2).",calc:true},

{t:"Calculations",q:"Current divider: R1=6 ohm and R2=3 ohm in parallel, total current = 9 A. Calculate the current through R1.",opts:["3 A","6 A","4.5 A","9 A"],a:0,exp:"In a current divider, current divides inversely proportional to resistance. I_R1 = It x R2/(R1+R2) = 9 x 3/(6+3) = 27/9 = 3 A. Check: I_R2=9x6/9=6A. Total=3+6=9A. Correct.",calc:true},

{t:"Calculations",q:"Current divider: R1=6 ohm and R2=3 ohm in parallel, total current = 9 A. Calculate current through R2.",opts:["6 A","3 A","4.5 A","2 A"],a:0,exp:"I_R2 = It x R1/(R1+R2) = 9 x 6/(6+3) = 54/9 = 6 A. Note: the larger current flows through the LOWER resistance (R2=3 ohm gets more current than R1=6 ohm).",calc:true},

// ── Resistance from physical properties ──
{t:"Calculations",q:"A copper conductor has a resistivity of 1.72x10-8 ohm.m, length 100 m, cross-sectional area 2.5 mm2. Calculate resistance.",opts:["0.688 ohm","1.72 ohm","0.172 ohm","6.88 ohm"],a:0,exp:"R = (rho x L) / A = (1.72e-8 x 100) / (2.5e-6) = 1.72e-6 / 2.5e-6 = 0.688 ohm. This is the resistance of one conductor. A 2-core circuit loop resistance = 2 x 0.688 = 1.376 ohm.",calc:true},

{t:"Calculations",q:"A cable loop has total resistance (R1+R2) = 1.4 ohm and carries a load of 16 A. What is the total voltage drop in the cable?",opts:["22.4 V","11.2 V","0.875 V","44.8 V"],a:0,exp:"V_drop = I x (R1+R2) = 16 x 1.4 = 22.4 V. This represents the total voltage drop in both the phase and neutral conductors combined.",calc:true},

// ── Internal resistance / terminal voltage ──
{t:"Calculations",q:"A battery has EMF = 12 V and internal resistance = 0.5 ohm. It supplies a 2.5 ohm load. Calculate terminal voltage.",opts:["10 V","12 V","11 V","9 V"],a:0,exp:"I = EMF/(r+R) = 12/(0.5+2.5) = 12/3 = 4 A. Terminal voltage = EMF - (I x r) = 12 - (4 x 0.5) = 12 - 2 = 10 V. Or: V = I x R_load = 4 x 2.5 = 10 V.",calc:true},

{t:"Calculations",q:"A battery has EMF=12 V, internal resistance 0.5 ohm, load 2.5 ohm. Calculate the power delivered to the LOAD (not including internal resistance losses).",opts:["40 W","48 W","8 W","2 W"],a:0,exp:"I = 4 A (from previous). P_load = I2 x R_load = 16 x 2.5 = 40 W. Or: P = V_terminal x I = 10 x 4 = 40 W.",calc:true},

// ── Resistor combinations from real exam-style oven/heater questions ──
{t:"Calculations",q:"A 230 V electric oven has two heating elements: Element A = 2.3 kW and Element B = 1.15 kW, both connected in parallel. Calculate the resistance of Element A.",opts:["23 ohm","46 ohm","11.5 ohm","10 ohm"],a:0,exp:"R_A = V2/P = 2302/2300 = 52900/2300 = 23 ohm.",calc:true},

{t:"Calculations",q:"A 230V oven has Element A = 23Ω and Element B = 46Ω connected in parallel. Calculate the total current drawn from supply.",opts:["15 A","10 A","5 A","3 A"],a:0,exp:"I_A = 230/23 = 10 A. I_B = 230/46 = 5 A. Total I = 10+5 = 15 A. Or: Rt = (23x46)/(23+46) = 1058/69 = 15.33 ohm. I = 230/15.33 = 15 A.",calc:true},

{t:"Calculations",q:"What is the total power consumed when Element A (2.3 kW) and Element B (1.15 kW) are both on in parallel?",opts:["3.45 kW","1.15 kW","2.3 kW","4.6 kW"],a:0,exp:"P_total = P_A + P_B = 2300 + 1150 = 3450 W = 3.45 kW. In parallel circuits, total power is the sum of individual powers.",calc:true},

// ── Wheatstone bridge / balanced bridge concept ──
{t:"Calculations",q:"In a Wheatstone bridge, the bridge is said to be 'balanced' when no current flows through the galvanometer. What is the condition for balance?",opts:["R1/R2 = R3/R4 (ratio of adjacent arms are equal)","R1 + R2 = R3 + R4","All four resistors are equal","The supply voltage equals the galvanometer sensitivity"],a:0,exp:"Balance condition: R1/R2 = R3/R4 (or R1 x R4 = R2 x R3). When balanced, no current flows through the meter. Used to measure unknown resistance: Rx = (R2 x R3)/R1.",calc:true}
,

{t:"Calculations",
q:"<div class='qdiagram'><svg viewBox='0 0 300 130' xmlns='http://www.w3.org/2000/svg' style='width:100%;max-width:300px;display:block;margin:8px auto'><rect width='300' height='130' fill='#f8f8f4' rx='6'/><text x='10' y='16' font-size='10' fill='#333'>Voltage divider</text><line x1='25' y1='25' x2='25' y2='105' stroke='#185FA5' stroke-width='2'/><text x='5' y='45' font-size='10' fill='#185FA5'>+</text><text x='5' y='90' font-size='10' fill='#185FA5'>−</text><line x1='25' y1='25' x2='100' y2='25' stroke='#333' stroke-width='2'/><rect x='100' y='15' width='40' height='20' fill='white' stroke='#333' stroke-width='2'/><text x='120' y='29' font-size='10' text-anchor='middle'>R1</text><text x='120' y='43' font-size='9' text-anchor='middle' fill='#666'>1kΩ</text><line x1='140' y1='25' x2='190' y2='25' stroke='#333' stroke-width='2'/><rect x='190' y='15' width='40' height='20' fill='white' stroke='#333' stroke-width='2'/><text x='210' y='29' font-size='10' text-anchor='middle'>R2</text><text x='210' y='43' font-size='9' text-anchor='middle' fill='#666'>2kΩ</text><line x1='230' y1='25' x2='270' y2='25' stroke='#333' stroke-width='2'/><line x1='270' y1='25' x2='270' y2='105' stroke='#333' stroke-width='2'/><line x1='25' y1='105' x2='270' y2='105' stroke='#333' stroke-width='2'/><line x1='210' y1='35' x2='210' y2='105' stroke='#e8a000' stroke-width='1.5' stroke-dasharray='4,2'/><text x='230' y='75' font-size='10' fill='#e8a000'>V_out</text><text x='215' y='90' font-size='10' fill='#e8a000'>= ?</text><text x='148' y='118' font-size='11' text-anchor='middle' fill='#185FA5' font-weight='bold'>12 V</text></svg></div>Voltage divider: R1=1kΩ and R2=2kΩ in series across 12V. What voltage appears across R2 (V_out)?",
opts:["8V","4V","6V","12V"],

// ══ SCENARIO QUESTIONS — based directly on real exam introduction-style questions ══

// Scenario 1: Hot water cylinder replacement (from ET60 Q3)
{t:"Scenarios",
q:"SCENARIO: A factory has a 3-phase star-connected hot water cylinder on a final subcircuit protected by HRC fuses and controlled by a lockable isolator and contactor. The cylinder must be removed and later replaced. An electrician arrives to disconnect the existing cylinder.\n\nWhat is the CORRECT isolation procedure before disconnecting the cylinder?",
opts:["Open the lockable isolator, apply Prove-Test-Prove at the cylinder terminals, attach Danger Tag with name/date/time, then disconnect","Turn the contactor off at the control panel only, then disconnect immediately","Ask a colleague to hold the isolator open while you disconnect under normal operating conditions","Remove the HRC fuses then disconnect without testing as required by AS/NZS 3000"],
a:0,exp:"Correct isolation: (1) Open the lockable isolator. (2) Apply Prove-Test-Prove — prove instrument works, test at cylinder terminals to confirm dead, prove instrument still works. (3) Attach Danger Tag with your name, date and time. (4) Only then proceed to disconnect. Never rely on someone else holding the isolator — use a lock and tag."},

{t:"Scenarios",
q:"SCENARIO: Same factory. Building work is complete. A new correctly-rated cable is connected to the new hot water cylinder. The electrician finds there is NO lock or Danger Tag on the lockable isolator.\n\nWhat action must the electrician take before connecting the cylinder to the contactor?",
opts:["Apply Prove-Test-Prove at the contactor terminals to confirm the circuit is dead before making any connections","Assume the previous electrician isolated it safely and proceed with connections","Check the switchboard MCB is off then proceed without any additional testing","Call the supervisor and wait — no work can proceed without a tag for domestic installations"],
a:0,exp:"Absence of a Danger Tag does NOT mean the circuit is isolated. The electrician MUST apply Prove-Test-Prove: prove instrument works → test at contactor terminals to confirm dead → prove instrument still works. Only then make connections and apply their own Danger Tag. Never assume isolation from absence of a tag."},

{t:"Scenarios",
q:"SCENARIO: Same factory. The new cylinder has been connected and is ready to be tested. The elements in the old cylinder were rated 1500W each. The new cylinder has elements rated 6000W each (3 elements star-connected).\n\nState TWO factors of the EXISTING final subcircuit that MUST be checked before livening.",
opts:["Cable current-carrying capacity and HRC fuse rating — both must be adequate for the increased load current","Only the HRC fuse rating — cable sizing is not affected by element wattage","Only the cable CSA — fuses automatically adjust to the correct rating","The RCD trip threshold and the earth electrode resistance"],
a:0,exp:"Old load: 3×1500W = 4.5kW. New load: 3×6000W = 18kW — a 4× increase. BOTH must be verified: (1) Cable CSA — existing cable may be undersized for the new higher current. (2) HRC fuse rating — existing fuses may be too small. Also check isolator and contactor ratings."},

{t:"Scenarios",
q:"SCENARIO: An earth continuity test is carried out on the new hot water cylinder flexible cable (2.5mm² conductors, 3m long). The test result between the protective earth conductor end and the cylinder frame reads 0.8Ω.\n\nIs this result acceptable? State why.",
opts:["Not acceptable — 0.8Ω exceeds the 1Ω maximum, indicating a poor earth connection that will not safely carry fault current or limit touch voltage","Acceptable — 0.8Ω is below the 1Ω maximum, so the result passes","Not acceptable — the maximum for a 3-phase circuit is 0.5Ω","Acceptable — earth continuity only needs to be below 10Ω for short cables"],
a:0,exp:"0.8Ω IS actually below 1Ω so this result IS acceptable. Wait — the exam answer from ET62 states 0.8Ω is NOT acceptable because the cable is only 3m long — at 2.5mm², the expected resistance is much lower (~0.02Ω). A result of 0.8Ω indicates a poor connection (loose terminal, corroded conductor). The maximum 1Ω limit applies to flexible cords on appliances; for a 3m installation cable the expected result should be <0.1Ω.",calc:false},

// Scenario 2: Star-delta motor reconnection (from ET62 Q3)
{t:"Scenarios",
q:"SCENARIO: A 400V 3-phase 10kW induction motor controlled by a star-delta starter has been repaired. The flexible cable (6 phase conductors + earth) is reconnected to the motor. Before livening, the motor windings must be identified.\n\nWhich instrument is used to identify the motor windings, and what results are expected?",
opts:["Insulation resistance tester: continuity between winding ends of same winding (low resistance ~1-5Ω), and infinite resistance between different windings","Clamp meter: measures current in each winding at full load under normal operating conditions","Voltage tester: applies 400V and measures response as required by AS/NZS 3000","Earth fault loop impedance tester: measures loop from each terminal to earth for all LV installations in NZ"],
a:0,exp:"Use a low-resistance ohmmeter (continuity tester). Connect between pairs of conductors: winding pairs of the SAME winding show continuity (low resistance, typically 1-10Ω for small motors). Conductors from DIFFERENT windings show no continuity (open circuit/infinite resistance). This identifies the three pairs: U1-U2, V1-V2, W1-W2."},

{t:"Scenarios",
q:"SCENARIO: A 3-phase 10kW star-delta motor has been reconnected after repair. Before reconnecting to supply, an insulation resistance test must be carried out on the motor and flexible cable.nection to supply.\n\nState: (a) test instrument, (b) test voltage, (c) minimum acceptable result.",
opts:["(a) Insulation resistance tester (Megger), (b) 500V DC, (c) minimum 1MΩ","(a) Clamp meter, (b) 230V AC, (c) minimum 0.5MΩ","(a) Multimeter on resistance range, (b) battery voltage (~9V), (c) minimum 10kΩ","(a) Earth fault loop tester, (b) 230V AC, (c) minimum 1Ω"],
a:0,exp:"(a) Insulation resistance tester (Megohmmeter/Megger). (b) 500V DC — standard test voltage for LV equipment up to 500V. (c) Minimum 1MΩ — per AS/NZS 3000 Section 8. If result is below 1MΩ, insulation is degraded and motor must not be reconnected to supply."},

{t:"Scenarios",
q:"SCENARIO: A 400V 3-phase star-delta motor has 6 terminals: U1, V1, W1 (start of each winding) and U2, V2, W2 (end of each winding).: U1, V1, W1 (start of each winding) and U2, V2, W2 (end of each winding). The motor is to be connected for 400V delta operation.\n\nHow are the terminals connected for DELTA?",
opts:["U1-W2, V1-U2, W1-V2 joined together at three junction points — supply connected to U1/W2, V1/U2, W1/V2","U1-V1-W1 joined together at star point — supply connected to U2, V2, W2","U1-U2, V1-V2, W1-W2 short-circuited together under normal operating conditions","U1-V1-W1-U2-V2-W2 all joined together as required by AS/NZS 3000"],
a:0,exp:"Delta connection: the END of one winding joins the START of the next. U1 joins W2, V1 joins U2, W1 joins V2. Supply is connected to the three junction points. This applies full line voltage (400V) across each winding."},

// Scenario 3: 3-phase kiln (from ET63 Q26-29)
{t:"Scenarios",
q:"SCENARIO: A 400V 3-phase industrial kiln has 3 elements each rated 17.77Ω connected in DELTA. Calculate the phase current in each element.",
opts:["22.5A","13.0A","39.0A","7.5A"],
a:0,exp:"Delta: Vph = VL = 400V. I_ph = Vph/R = 400/17.77 = 22.51A ≈ 22.5A. Each element has the full 400V line voltage across it in delta.",calc:true},

{t:"Scenarios",
q:"SCENARIO: A 400V 3-phase industrial kiln has 3 elements (R=17.77Ω each) in DELTA. Phase current Iph = 22.5A. Calculate the LINE current.",
opts:["39.0A","22.5A","67.5A","13.0A"],
a:0,exp:"Delta: IL = √3 × Iph = 1.732 × 22.5 = 38.97A ≈ 39.0A.",calc:true},

{t:"Scenarios",
q:"SCENARIO: A 400V 3-phase kiln has elements in DELTA: R=17.77Ω per element, IL=39A, VL=400V. Calculate the total power output.",
opts:["27.0kW","9.0kW","46.7kW","13.5kW"],
a:0,exp:"P = √3 × VL × IL × pf = 1.732 × 400 × 39 × 1.0 = 27,019W ≈ 27kW. Or: P = 3 × Vph²/R = 3 × 400²/17.77 = 3 × 9003 = 27kW.",calc:true},

{t:"Scenarios",
q:"SCENARIO: A 400V 3-phase kiln has elements (R=17.77Ω each) reconnected from delta to STAR on the same 400V supply. Calculate the new phase voltage across each element.cross each element.",
opts:["231V","400V","693V","115V"],
a:0,exp:"Star: Vph = VL/√3 = 400/1.732 = 231V. Each element now only sees 231V instead of 400V in delta.",calc:true},

{t:"Scenarios",
q:"SCENARIO: Kiln elements in STAR (Vph=231V, R=17.77Ω). Calculate total power in star. Compare to delta power of 27kW — what is the difference?",
opts:["Star power = 9.0kW, difference = 18kW (star gives 1/3 the power of delta)","Star power = 27kW, no difference in all electrical installations","Star power = 13.5kW, difference = 13.5kW — no further action is required","Star power = 81kW, difference = 54kW for the installation concerned"],
a:0,exp:"I_ph(star) = 231/17.77 = 13.0A. P_star = 3 × I²× R = 3 × 169 × 17.77 = 9,005W ≈ 9kW. Or: P_star = P_delta/3 = 27/3 = 9kW. Delta-to-star always reduces power to exactly 1/3. Difference = 27-9 = 18kW.",calc:true},

// Scenario 4: Earth fault loop impedance scenario (from ET63 Q22-24)
{t:"Scenarios",
q:"SCENARIO: An earth fault loop impedance test is plugged into a 230V socket outlet protected by a 20A HRC fuse. The test result is 1.2Ω. Three rewireable fuses are on the switchboard.\n\nThe rewireable fuses need replacing. State ONE reason WHY they need replacing.",
opts:["The test reveals a PSCC of 192A — rewireable fuses have a rupturing capacity of only ~1kA which sounds fine, but the real issue is the fault level may have been higher before the additional cable resistance. The fuses have a fusing factor of ~2 meaning they provide poor protection","The test result of 1.2Ω means PSCC = 230/1.2 = 192A — this confirms fault current is adequate for the MCBs but rewireable fuses with fusing factor of 2 provide only coarse excess current protection, not close protection to cables","The rewireable fuses have blown during the test","Rewireable fuses cannot be used on 3-phase installations"],
a:1,exp:"PSCC = 230/1.2 = 192A at the outlet. The real concern is: rewireable fuses are classified as COARSE excess current protection (fusing factor ~2 — melt at 2× rated current). They provide poor protection to cables against sustained overloads. MCBs provide CLOSE protection (trip at ~1.25-1.45× rated current) and also trip all 3 poles simultaneously on 3-phase, preventing single-phasing."},

{t:"Scenarios",
q:"SCENARIO: A 400V 3-phase workshop has been completely rewired including a 2kW MIMS water heater. The main switchboard loop impedance has been tested., including a 2kW MIMS water heater. The main switchboard loop impedance has been tested.\n\nWhat ADDITIONAL earth fault loop impedance test must still be carried out?",
opts:["Test at the furthest point of each final subcircuit — including at the water heater — to verify protection will operate within required disconnection time at the worst-case point","No further testing is needed once the switchboard test is complete under normal operating conditions for the installation concerned","Re-test the switchboard every 24 hours for one week as required by AS/NZS 3000 under normal operating conditions","Test at the water heater supply terminals only for all LV installations in NZ for the circuit in question"],
a:0,exp:"The switchboard test gives the lowest Zs (best case). AS/NZS 3000 requires testing at the FURTHEST point of each final subcircuit — this gives the highest Zs (worst case). At the water heater (final subcircuit end), Zs will be higher due to cable resistance. If protection operates adequately there, it will everywhere on that circuit."},

{t:"Scenarios",
q:"SCENARIO: A 230V domestic installation has been rewired. The earth fault loop impedance at the socket outlet furthest from the switchboard measures 0.45Ω. A 32A Type B MCB protects the circuit.\n\nA Type B MCB requires 5× In to trip instantaneously. Calculate the fault current and state if disconnection within 0.4s is achievable.",
opts:["IF=511A, required trip current=160A — 511A >> 160A so YES the MCB will trip instantaneously well within 0.4s","IF=511A, required trip current=320A — marginal, may not trip in time","IF=230A, the MCB will not trip under normal operating conditions","IF=1022A, the MCB is overloaded as required by AS/NZS 3000"],
a:0,exp:"IF = V/Zs = 230/0.45 = 511A. Type B MCB instantaneous trip requires 5×In = 5×32 = 160A. Since 511A >> 160A, the MCB will trip instantaneously (within 0.01s) — well within the 0.4s requirement for final subcircuits. Disconnection time is satisfactory.",calc:true},

// Scenario 5: Motor protection sequence (from ET51 Q2)
{t:"Scenarios",
q:"SCENARIO: A 3-phase DOL-started induction motor is protected by thermal overloads and HRC fuses. The motor stalls due to a sudden mechanical jam.\n\nDescribe the sequence of protection events.",
opts:["Locked-rotor current (6-8× FLC) flows continuously → thermal overload relay heats and trips after a time delay → contactor drops out → if thermal overload fails, HRC fuses blow as back-up","HRC fuses blow immediately → then thermal overload trips → then contactor opens under normal operating conditions for the circuit in question","RCD trips immediately as earth leakage increases → then MCB opens as required by AS/NZS 3000 per the EWRB requirements","Motor simply stops with no protection operating until manually reset for all LV installations in NZ for all supply voltages"],
a:0,exp:"On stall: (1) Motor draws locked-rotor current (typically 6-8× FLC) continuously on all 3 phases. (2) Thermal overload relay detects sustained overcurrent and trips after its time delay — opening the control circuit, dropping out the contactor. (3) If thermal overload fails, HRC fuses provide back-up short-circuit protection. The thermal overload is the primary protection; HRC fuses are back-up for faults the overload cannot clear."},

{t:"Scenarios",
q:"SCENARIO: A 400V 3-phase induction motor is running fully loaded. The supply voltage drops to 350V.\n\nWhat happens?",
opts:["Motor draws higher current trying to maintain torque → if sustained, thermal overload eventually operates","HRC fuses blow immediately as voltage drops under normal operating conditions","Motor runs faster due to reduced impedance as required by AS/NZS 3000","RCD trips as earth leakage increases for all LV installations in NZ"],
a:0,exp:"Lower voltage → lower torque capability → motor draws more current to attempt to maintain load torque. The sustained overcurrent (not a short circuit — too small for HRC fuses) causes the thermal overload relay to eventually operate and disconnect the motor. Voltage dips are a common cause of nuisance tripping."},

{t:"Scenarios",
q:"SCENARIO: A 3-phase induction motor is running at full load when one supply fuse blows, causing single-phasing.\n\nWhat happens and why is it dangerous without protection?",
opts:["Motor runs on 2 phases — current in remaining windings rises significantly — thermal overload operates — without protection the motor overheats and windings burn out","Motor stops immediately and safely with no damage under normal operating conditions for all supply voltages","HRC fuses on remaining phases blow simultaneously as required by AS/NZS 3000 when correctly installed","Motor runs at reduced speed with no current increase for all LV installations in NZ — this approach is acceptable"],
a:0,exp:"Single-phasing: (1) Motor attempts to continue on 2 phases — rotor still has inertia. (2) Remaining windings carry higher current (they must develop the same torque with one phase missing). (3) Thermal overload relay detects overcurrent and operates. (4) Without protection: the two remaining windings overheat and burn out rapidly. Single-phasing is a leading cause of motor winding failure."},

// Scenario 6: Heater voltage fluctuation (from ET61)
{t:"Scenarios",
q:"SCENARIO: A 230V plug-in heater has an output of 2kW. The supply voltage fluctuates between 230V and 240V.\n\nDescribe the effect this voltage change has on power output. Calculate power at 230V and 240V.",
opts:["At 230V: 2000W. At 240V: P=V²/R=240²/26.45=2174W. Power increases by about 8.7% — the heater runs hotter at higher voltage","Voltage change has no effect — heaters maintain constant power output when correctly installed","At 240V power decreases to 1800W because resistance increases under normal operating conditions","Power doubles at 240V to 4000W as required by AS/NZS 3000 — this approach is acceptable"],
a:0,exp:"R = V²/P = 230²/2000 = 26.45Ω (resistance is constant for a resistive element). At 240V: P = 240²/26.45 = 57600/26.45 = 2177W. Increase = (2177-2000)/2000 × 100 = 8.9%. A 4.3% voltage rise causes ~8.9% power increase because P∝V². The heater runs hotter — not dangerous but element life may be reduced.",calc:true},

// Scenario 7: Rewiring scenario with MIMS
{t:"Scenarios",
q:"SCENARIO: A 3-phase workshop is completely rewired including a 230V 2kW MIMS water heater permanently connected. Insulation resistance testing is carried out. With MIMS element connected the IR test reads 0.01MΩ.\n\nIs this acceptable? What does the test at 0.01MΩ tell you?",
opts:["Yes — 0.01MΩ (10kΩ) is the accepted minimum when MIMS elements remain connected. The MIMS element has inherently low insulation resistance by design — this is normal","No — minimum must be 1MΩ regardless of MIMS being connected under normal operating conditions — this approach is acceptable","Not acceptable — disconnect all equipment and retest as required by AS/NZS 3000 and is fully compliant","Yes — any reading above zero is always acceptable for MIMS installations for all LV installations in NZ as per standard practice"],
a:0,exp:"Acceptable. AS/NZS 3000: with MIMS elements connected, the minimum permitted IR is 0.01MΩ (10kΩ). MIMS elements inherently have low but safe insulation resistance due to the magnesium oxide insulation and mineral construction. With all equipment disconnected, the installation wiring itself must still read ≥1MΩ."},

// ══ ADDITIONAL CONCEPTUAL QUESTIONS from real papers ══

{t:"Electrical Protection",
q:"A fault level of 20,000A (20kA) has been calculated at a switchboard. What type of protective device must be installed?",
opts:["HRC fuse rated at least 20kA rupturing capacity","Standard rewireable fuse","Type B MCB rated 20A","RCD rated 30mA under normal operating conditions"],
a:0,exp:"With a fault level of 20kA, any installed device MUST have a rupturing capacity ≥20kA. Only HRC fuses (rupturing capacity up to 80kA) or high-rated MCCBs can safely interrupt this fault current. Standard MCBs (typically 6-10kA) and rewireable fuses (typically 1-4kA) would be destroyed catastrophically."},

{t:"Electrical Protection",
q:"State why an earth fault loop impedance test is ALSO carried out at the SWITCHBOARD of an installation (not just at the furthest outlet).",
opts:["Switchboard has minimum Zs and highest PSCC — verifying all components can withstand max fault current","The switchboard test replaces all other loop impedance tests under normal operating conditions","The switchboard has a higher voltage than outlets as required by AS/NZS 3000","To test the RCD at the switchboard for all LV installations in NZ"],
a:0,exp:"At the switchboard: Zs is lowest (minimum cable in the loop) → PSCC is highest. This worst-case high fault current must be within the rupturing capacity of all switchboard components (main switch, busbars, fuses/MCBs). At the furthest outlet: Zs is highest → PSCC is lowest — tests whether protection operates fast enough at the worst disconnection point."},

{t:"NZ Supply & MEN",
q:"Why is the earth fault loop path through the MAIN NEUTRAL conductor more important than the path through the MASS OF EARTH back to the transformer star point?",
opts:["Neutral conductor impedance is far lower and more consistent than the variable high-resistance soil earth path — ensuring reliable fault current","The neutral conductor is shorter than the earth path under normal operating conditions","The earth path is only used during lightning strikes as required by AS/NZS 3000","The neutral conductor is always the same colour for all LV installations in NZ"],
a:0,exp:"The metallic neutral conductor has very low, predictable impedance. The soil/earth path has high, variable impedance (depending on soil type, moisture, electrode resistance). Low Zs via neutral = high, predictable fault current = reliable, fast operation of overcurrent protection. The earth path alone would give insufficient fault current in many installations."},

{t:"Testing & Inspection",
q:"An earth fault loop impedance test at a switchboard shows Zs=0.34Ω. How is this information used?",
opts:["Calculate PSCC=230/0.34=676A, verify all switchboard devices have rupturing capacity ≥676A, and verify disconnection times are met","Use it to select the cable size for the submain under normal operating conditions for domestic installations","Compare it to the RCD trip threshold as required by AS/NZS 3000 — this is the correct NZ practice","Use it to calculate the power factor of the installation for all LV installations in NZ"],
a:0,exp:"PSCC = V/Zs = 230/0.34 = 676A = 0.676kA. This is used to: (1) Verify all protective devices and switchboard components have rupturing capacity ≥676A. (2) Confirm that under a fault, sufficient current flows to operate protection within required disconnection time (0.4s for final subcircuits, 5s for distribution circuits).",calc:true},
